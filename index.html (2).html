: 'Object<br>O (cm)', r: 1 }, { k: 'L', l: 'Lens pair<br>L (cm)', r: 1 }, { k: 'S', l: 'Screen<br>S (cm)', r: 1 },\n    { k: 'u', l: 'u = L \u2212 O<br>(cm)' }, { k: 'v', l: 'v = S \u2212 L<br>(cm)' }, { k: 'iu', l: '1/u<br>(cm\u207b\u00b9)' }, { k: 'iv', l: '1/v<br>(cm\u207b\u00b9)' }, { k: 'f', l: 'F = uv/(u + v)<br>(cm)' }],\n  4: [{ k: 'L1', l: 'Lens 1<br>L\u2081 (cm)', r: 1 }, { k: 'L2', l: 'Lens 2<br>L\u2082 (cm)', r: 1 }, { k: 'S', l: 'Screen<br>S (cm)', r: 1 },\n    { k: 'd', l: 'd = L\u2082 \u2212 L\u2081<br>(cm)' }, { k: 'bfl', l: 'BFL = S \u2212 L\u2082<br>(cm)' }, { k: 'iF', l: '1/F = (1 \u2212 d/f\u2081)/BFL<br>(cm\u207b\u00b9)' }, { k: 'F', l: 'F<br>(cm)' }]\n};\nconst DIG = { u: 1, v: 1, d: 1, bfl: 1, iu: 4, iv: 4, iF: 4, f: 2, F: 2 };\nconst TOLF = { u: () => 0.06, v: () => 0.06, d: () => 0.06, bfl: () => 0.06, iu: x => Math.max(0.0004, 0.01 * Math.abs(x)), iv: x => Math.max(0.0004, 0.01 * Math.abs(x)), iF: x => Math.max(0.0004, 0.02 * Math.abs(x)), f: x => 0.015 * Math.abs(x), F: x => 0.025 * Math.abs(x) };\nconst calcKeys = e => COLS[e].filter(c => !c.r).map(c => c.k);\nfunction expected(sub, r) {\n  if (sub.e === 2) { const u = num(r.I1) - num(r.L2), v = num(r.I2) - num(r.L2); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (v - u) }; }\n  if (sub.e === 3) { const u = num(r.L) - num(r.O), v = num(r.S) - num(r.L); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (u + v) }; }\n  const f1 = num(sub.res.f1), d = num(r.L2) - num(r.L1), bfl = num(r.S) - num(r.L2), iF = (1 - d / f1) / bfl; return { d, bfl, iF, F: 1 / iF };\n}\nfunction rowVals(sub, r) { const ex = expected(sub, r), o = {}; calcKeys(sub.e).forEach(k => { o[k] = isFinite(num(r[k])) ? num(r[k]) : ex[k]; }); return o; }\n\nconst SRC = {\n  2: [['Judging the sharpest image twice (for I\u2081 and for I\u2082), so the two errors add up', 1], ['Index error: the pointers are not exactly under the lens centres', 1], ['The concave lens was too far from I\u2081, so the final image was faint and hard to focus', 1], ['The thickness of the lenses (the formulas are for thin lenses)', 1], ['A concave lens changes the colour of the light and so changes f', 0], ['The warm room lamp changed the focal length of the lens', 0]],\n  3: [['Judging the sharpest image position by eye', 1], ['Index error of the carrier pointers', 1], ['The two lenses were not exactly in contact, so a small gap changed F', 1], ['The f\u2081 and f\u2082 you compare with carry their own errors from earlier experiments', 1], ['The lens pair was heated by the lamp and changed its shape', 0], ['The thickness of the lenses (the formulas are for thin lenses)', 1]],\n  4: [['Judging the sharpest image of a very small image of the distant window', 1], ['d is a difference of two pointer readings, so index errors do not cancel completely', 1], ['BFL is short, so a small reading error is a large fraction of it', 1], ['f\u2081 from Experiment 1 has its own error, and it enters every point of the graph', 1], ['The distant window moved during the experiment', 0], ['The lenses expand when the lamp is on', 0]]\n};\nconst PRE = {\n  2: [['Place the concave lens between the convex lens and I\u2081, closer to I\u2081 than |f|', 1], ['Keep the object and all lens centres at the same height on one axis', 1], ['Do not move the object or the convex lens between phase 1 and phase 2', 1], ['Put the concave lens before the convex lens', 0], ['Focus slowly and judge the sharpest image from both sides', 1], ['Wipe the lens with a wet cloth before each reading', 0]],\n  3: [['Press the two lenses firmly together in one holder', 1], ['Keep the object and the lens centres on one axis', 1], ['Take object distances greater than 1.5 F', 1], ['Take the readings only for a single object distance', 0], ['Use a small aperture, or cover the edge of the lenses', 1], ['Wipe the lenses with a wet cloth before every reading', 0]],\n  4: [['Make sure the window really is far away (so the beam is nearly parallel)', 1], ['Keep both lenses on the same axis', 1], ['Do not let the carriers touch each other', 1], ['Take d larger than f\u2081 + f\u2082 every time', 0], ['Focus the image slowly and judge from both sides', 1], ['Move the lamp closer to heat the lenses evenly', 0]]\n};\n\n/* ---------- Step 1: aim, set-up ---------- */\nconst INFO = {\n  2: {\n    title: 'Experiment 2: focal length of a concave lens (auxiliary lens method)',\n    body: sub => `<div class=\"card\"><h3>Aim<\/h3><p>To determine the focal length of a concave lens using an auxiliary convex lens.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers \u00b7 illuminated cross-wire \u00b7 an auxiliary convex lens \u00b7 the concave lens \u00b7 screen \u00b7 graph paper.<\/p>\n      <div class=\"row\"><label class=\"fld\">Concave lens<select disabled><option>Lens ${sub.id}<\/option><\/select><\/label>\n      <label class=\"fld\">Auxiliary convex lens<select id=\"aux\"><option value=\"A\">Lens A<\/option><option value=\"B\">Lens B<\/option><option value=\"C\">Lens C<\/option><\/select><\/label><\/div><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>A concave lens alone gives only a virtual image. So we let a convex lens form a real image I\u2081 on the screen first. Then we place the concave lens between the convex lens and I\u2081. The rays are now heading for I\u2081, so I\u2081 is a <b>virtual object<\/b> for the concave lens, at distance <i>u<\/i> = I\u2081 \u2212 L\u2082. The concave lens moves the image farther to I\u2082, at <i>v<\/i> = I\u2082 \u2212 L\u2082.<\/p>\n      <p class=\"eq\">1/v \u2212 1/u = 1/f &nbsp;\u21d2&nbsp; |f| = uv/(v \u2212 u)<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">With u positive (virtual object) and v positive (real image), f comes out negative for a concave lens. We quote its magnitude |f|. A real final image forms only if u is smaller than |f|, so the concave lens must be placed close to I\u2081.<\/p>\n      <p>The graph of 1/v against 1/u is a straight line of slope +1. It cuts the x-axis at 1/|f|.<\/p><\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>With the concave lens out of the beam, focus the image I\u2081 of the object on the screen. Note O, L\u2081 and I\u2081.<\/li><li>Put the concave lens in, between the convex lens and I\u2081. Move the screen to focus again to get I\u2082. Note L\u2082 and I\u2082.<\/li><li>Repeat for at least five different positions.<\/li><li>Calculate u, v and |f|, plot the graph and find |f| from it.<\/li><\/ol><\/div>`,\n    readIntro: `<p>Each reading has two phases. In phase 1 the concave lens is <b>out<\/b> of the beam and you find the image I\u2081. In phase 2 you switch the concave lens <b>in<\/b>, place it before I\u2081, and refocus to find I\u2082. Do not move the object or the convex lens between the two phases.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and |f| for every row. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and |f| to 2 decimal places.'\n  },\n  3: {\n    title: 'Experiment 3: two thin lenses in contact',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To determine the equivalent focal length of two thin lenses in contact and to verify <span class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers \u00b7 illuminated cross-wire \u00b7 Lens ${a} (${typeOf(a)}) and Lens ${b} (${typeOf(b)}) mounted together in one holder \u00b7 screen \u00b7 graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>Two thin lenses in contact act as one thin lens. The light from the object meets the first lens, and the image it would form is the object for the second. Adding the two lens equations gives<\/p>\n      <p class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082, &nbsp; P = P\u2081 + P\u2082<\/p>\n      <p>Here f is positive for a convex lens and negative for a concave lens. We measure F by the u\u2013v method, with distances taken from the lens pair, and compare it with the value from the f\u2081 and f\u2082 you found earlier.<\/p><\/div>\n      <div class=\"note\">Use your own earlier results for f\u2081 and f\u2082: Experiment 1 for the convex lenses and Experiment 2 for the concave lenses. If you did not measure a lens yet, the result page will tell you.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Fix the lens pair on its carrier. Place the object beyond 1.5 F (estimate F from f\u2081 and f\u2082).<\/li><li>Focus the image on the screen and read the three pointers. Repeat for five object distances.<\/li><li>Fill the table and calculate F for each reading.<\/li><li>Plot 1/v against 1/u, read the intercepts and find F.<\/li><li>Compare with 1/F = 1/f\u2081 + 1/f\u2082.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The two lenses sit together on the lens carrier. Put the object far enough away (more than about 1.5 F) and focus the image on the screen. Read the three pointers and record. Take at least five readings with different object distances.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and F for each row, as in Experiment 1. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and F to 2 decimal places.'\n  },\n  4: {\n    title: 'Experiment 4: two thin lenses separated by a distance',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To study how the equivalent focal length F of two thin lenses depends on their separation d, and to verify <span class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082)<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and two lens carriers \u00b7 Lens ${a} (${typeOf(a)}) as lens 1 and Lens ${b} (${typeOf(b)}) as lens 2 \u00b7 screen \u00b7 a far-away window as the object \u00b7 graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>For a distant object the light is almost parallel. It focuses at the back focal length BFL behind lens 2. For two thin lenses separated by d,<\/p>\n      <p class=\"eq\">BFL = F (1 \u2212 d/f\u2081) &nbsp;&nbsp; so &nbsp;&nbsp; 1/F = (1 \u2212 d/f\u2081) / BFL<\/p>\n      <p>and the formula to verify is <span class=\"eq\">1/F = (1/f\u2081 + 1/f\u2082) \u2212 d/(f\u2081f\u2082)<\/span>. So a graph of 1/F against d is a straight line. Its intercept (at d = 0) is 1/f\u2081 + 1/f\u2082, and its slope is \u22121/(f\u2081f\u2082). From the slope you can find f\u2082.<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">F is measured from the principal planes, not from lens 2. That is why we measure BFL and then convert.<\/p><\/div>\n      <div class=\"note\">You need f\u2081 (the lens 1 value you measured in Experiment 1). The table page asks for it.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Place lens 1 and lens 2 on the rail at a separation d (keep d between about 4 and 12 cm).<\/li><li>Focus the image of the distant window on the screen and read the three pointers.<\/li><li>Repeat for at least five values of d.<\/li><li>Calculate d, BFL, 1/F and F. Plot 1/F against d.<\/li><li>From the slope find f\u2082, and compare with its value from the earlier experiments.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The object is a window far outside the lab, so the light arrives almost parallel. Set lens 1 and lens 2 a few centimetres apart, and focus the image of the window on the screen. Read the three pointers. Take at least five readings with different separations d (about 4 to 12 cm).<\/p>`,\n    tableIntro: 'First enter f\u2081, the focal length of lens 1 that you measured. Then work out d, BFL, 1/F and F for each row. Give d and BFL to 0.1 cm, 1/F to 4 decimal places and F to 2 decimal places.'\n  }\n};\nfunction step1(root, sub) {\n  root.innerHTML = `<h2>${INFO[sub.e].title}<\/h2>` + INFO[sub.e].body(sub);\n  if (sub.e === 2) { const sel = $('#aux', root); sel.value = sub.aux; sel.disabled = sub.rows.length > 0; sel.addEventListener('change', () => { sub.aux = sel.value; save(); }); }\n  nextBtn(root, 'Go to the bench');\n}\n\n/* ---------- Step 2: readings ---------- */\nfunction field(id, label, val) { return `<label class=\"fld\">${label}<input id=\"${id}\" inputmode=\"decimal\" value=\"${val || ''}\"><\/label>`; }\nconst ptrOK = (t, a) => isFinite(t) && Math.abs(t - a) <= 0.06;\nfunction step2(root, sub) {\n  const e = sub.e, p = sub.pos;\n  root.innerHTML = `<h2>Take readings<\/h2>${INFO[e].readIntro}<div id=\"bench\"><\/div><div class=\"card\" id=\"rec\"><\/div>`;\n  mountBench($('#bench', root), sub);\n  const rec = $('#rec', root);\n  const blank = () => Object.fromEntries(calcKeys(e).map(k => [k, '']));\n  const note = html => { $('#rfb', rec).innerHTML = html; };\n  function auto() { return `<label class=\"chk\"><input type=\"checkbox\" id=\"auto\" ${S.auto ? 'checked' : ''}><span>Skip the scale-reading practice: fill the pointer readings for me<\/span><\/label>`; }\n  function hookAuto() { $('#auto', rec).addEventListener('change', ev => { S.auto = ev.target.checked; save(); }); }\n  function val(id, actual) { return S.auto ? actual : num($('#' + id, rec).value); }\n  function addRow(fields, extra) { sub.rows.push(Object.assign({ checked: null }, fields, blank(), extra || {})); save(); refreshNav(); }\n  const count = () => `<p style=\"margin:8px 0 0;font-size:.93rem;color:var(--muted)\">Readings recorded so far: <b>${sub.rows.length}<\/b> of at least 5.<\/p>`;\n\n  function drawRec() {\n    if (e === 3) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rL', 'Lens-pair pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const O = val('rO', p.o), L = val('rL', p.a), Sx = val('rS', p.s);\n        if (![O, L, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(O, p.o) || !ptrOK(L, p.a) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No image can form on the screen with the object this close. Move the object farther away.'));\n        if (sub.rows.some(r => Math.abs(num(r.O) - O) < .05 && Math.abs(num(r.L) - L) < .05 && Math.abs(num(r.S) - Sx) < .05)) return note(T('bad', 'You have already recorded this setting. Change the object distance.'));\n        addRow({ O: String(O), L: String(L), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else if (e === 4) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rA', 'Lens 1 pointer (cm)')}${field('rB', 'Lens 2 pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const A = val('rA', p.a), B = val('rB', p.b), Sx = val('rS', p.s);\n        if (![A, B, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(A, p.a) || !ptrOK(B, p.b) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No real image forms on the screen with this separation. Try a smaller d.'));\n        if (sub.rows.some(r => Math.abs(num(r.L2) - num(r.L1) - (B - A)) < .05)) return note(T('bad', 'You already have a reading with this separation. Change d.'));\n        addRow({ L1: String(A), L2: String(B), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else {\n      const ph = sub.stage.phase;\n      if (ph === 1) {\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 1: concave lens OUT of the beam<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rA', 'Convex lens pointer (cm)')}${field('rI', 'Screen pointer for I\u2081 (cm)')}<button class=\"btn primary\" id=\"lock\" type=\"button\" style=\"align-self:flex-end\">Lock phase 1<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#lock', rec).addEventListener('click', () => {\n          const O = val('rO', p.o), A = val('rA', p.a), I = val('rI', p.s);\n          if (sub.inpath) return note(T('bad', 'Take the concave lens out of the beam first (use the switch above the carriers).'));\n          if (![O, A, I].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n          if (!ptrOK(O, p.o) || !ptrOK(A, p.a) || !ptrOK(I, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub); if (st.virtual) return note(T('bad', 'The convex lens makes no real image with the object this close. Move the object farther away.'));\n          sub.stage = { phase: 2, O, L1: A, I1: I, tO: p.o, tA: p.a, d1: +st.delta.toFixed(2) }; save(); drawRec();\n          note(T('good', 'Phase 1 locked. Now switch the concave lens IN, place it before I\u2081 (closer to I\u2081 than its focal length), and refocus the screen.'));\n        });\n      } else {\n        const g = sub.stage;\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 2: concave lens IN the beam<\/h3><p style=\"margin:0 0 8px;font-size:.95rem\">Locked from phase 1: O = ${g.O}, L\u2081 = ${g.L1}, I\u2081 = ${g.I1}<\/p><div class=\"row\">${field('rB', 'Concave lens pointer (cm)')}${field('rI2', 'Screen pointer for I\u2082 (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\">Add to the observation table<\/button><button class=\"btn\" id=\"redo\" type=\"button\" style=\"align-self:flex-end\">Start phase 1 again<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#redo', rec).addEventListener('click', () => { sub.stage = { phase: 1 }; save(); drawRec(); });\n        $('#add', rec).addEventListener('click', () => {\n          const B = val('rB', p.b), I2 = val('rI2', p.s);\n          if (!sub.inpath) return note(T('bad', 'Switch the concave lens IN the beam first.'));\n          if (Math.abs(p.o - g.tO) > 0.05 || Math.abs(p.a - g.tA) > 0.05) return note(T('bad', 'You moved the object or the convex lens after phase 1. Press \u201cStart phase 1 again\u201d.'));\n          if (![B, I2].every(isFinite)) return note(T('', 'Enter both pointer readings.'));\n          if (!ptrOK(B, p.b) || !ptrOK(I2, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub);\n          if (st.virtual) return note(T('bad', 'No real image forms. The concave lens is too far from I\u2081 (more than its focal length). Move it closer to I\u2081.'));\n          if (g.I1 - B < 0.3) return note(T('bad', 'The concave lens must be placed before I\u2081 (to the left of it), so that I\u2081 is a virtual object for it.'));\n          if (I2 - g.I1 < 0.3) return note(T('bad', 'The new ima :flex-end\">Use my earlier result<\/button><div id=\"un\" style=\"width:100%\"><\/div>`;\n  root.innerHTML = `<h2>Result and analysis<\/h2><div class=\"card\"><h3>Your values<\/h3><div class=\"row\">${fields}<\/div><\/div>\n    <div class=\"card\"><h3>Sources of error: tick the ones that apply<\/h3><div id=\"src\"><\/div><\/div><div class=\"card\"><h3>Precautions: tick the correct ones<\/h3><div id=\"pre\"><\/div><\/div>\n    <button class=\"btn primary\" id=\"sub\" type=\"button\">Submit the result<\/button><div id=\"rfb\"><\/div>`;\n  checks('src', SRC[e], 'src'); checks('pre', PRE[e], 'pre');\n  const map = { fm: 'mean', fg: 'fg', ff: 'ff', p1: 'p1', p2: 'p2' };\n  Object.keys(map).forEach(id => { const el = $('#' + id, root); if (el) el.addEventListener('input', ev => { r[map[id]] = ev.target.value; save(); }); });\n  const usePrev = (id, key, inp) => { const v = earlierF(id); if (isFinite(v)) { const sg = (id === 'D' || id === 'E') ? -Math.abs(v) : v; r[key] = String(sg); $('#' + inp, root).value = sg; save(); $('#un', root).innerHTML = ''; } else $('#un', root).innerHTML = T('', `I could not find a saved result for Lens ${id}. Type your own value, or finish that experiment first.`); };\n  if ($('#u1', root)) $('#u1', root).addEventListener('click', () => usePrev(ia, 'p1', 'p1'));\n  if ($('#u2', root)) $('#u2', root).addEventListener('click', () => usePrev(e === 4 ? ib : ib, 'p2', 'p2'));\n  $('#sub', root).addEventListener('click', () => {\n    const fb = $('#rfb', root); let html = '', good = true;\n    const sc = SRC[e], pc = PRE[e], sOK = r.src.filter(i => sc[i][1]).length, sBad = r.src.filter(i => !sc[i][1]).length, pOK = r.pre.filter(i => pc[i][1]).length, pBad = r.pre.filter(i => !pc[i][1]).length;\n    const arr = sub.rows.map(q => num(q[mk])).filter(isFinite), mean = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN;\n    if (e === 2) {\n      const fm = num($('#fm', root).value), fg = num($('#fg', root).value), ff = num($('#ff', root).va
