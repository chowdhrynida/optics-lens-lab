rms an image\u2026', ['at f, smaller', 'at 2f, the same size and inverted', 'at infinity'], 1, 'At u = 2f, v = 2f and m = \u22121.'],\n    ['Why do we repeat the experiment for different object distances?', ['To reduce the random error of one setting and to check the lens formula', 'To heat the lens evenly', 'To change the focal length'], 0, 'Several readings average out random errors in judging sharpness.'],\n    ['What happens if the object is placed inside the focal length?', ['A real image forms on the screen', 'No real image forms; the image is virtual', 'The lens stops working'], 1, 'A virtual image cannot be caught on a screen.']\n  ];\n  const v = $('#viva', root); const lv = LN();\n  Q.forEach((q, i) => { const d = document.createElement('div'); d.className = 'card noprint'; d.innerHTML = `<b>${i + 1}. ${q[0]}<\/b><div class=\"opts\"><\/div><div class=\"fb\"><\/div>`; q[1].forEach((o, k) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm'; b.style.margin = '4px 6px 0 0'; b.textContent = o; b.addEventListener('click', () => { $('.fb', d).innerHTML = k === q[2] ? T('good', 'Correct. ' + q[3]) : T('bad', 'Not quite. Think again.'); }); $('.opts', d).appendChild(b); }); v.appendChild(d); });\n  void lv; nextBtn(root);\n}\n\n\n/* ======================================================\n   Shared helpers: confirm dialog, report, ray diagram, error analysis\n   ====================================================== */\nfunction askConfirm(msg, yes, onYes) {\n  const prev = document.activeElement, ov = document.createElement('div'); ov.className = 'modal-ov';\n  ov.innerHTML = '<div class=\"modal\" role=\"alertdialog\" aria-modal=\"true\" aria-label=\"Please confirm\"><p>' + msg + '<\/p><div class=\"row\"><button class=\"btn primary\" type=\"button\" data-y=\"1\">' + yes + '<\/button><button class=\"btn\" type=\"button\" data-y=\"0\">Cancel<\/button><\/div><\/div>';\n  const key = ev => { if (ev.key === 'Escape') close(); };\n  const close = () => { ov.remove(); document.removeEventListener('keydown', key); if (prev && prev.focus) prev.focus(); };\n  ov.addEventListener('click', ev => { if (ev.target === ov) close(); });\n  ov.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const y = b.dataset.y === '1'; close(); if (y) onYes(); }));\n  document.addEventListener('keydown', key); document.body.appendChild(ov); ov.querySelector('[data-y=\"0\"]').focus();\n}\nfunction hookReport(root) {\n  const msg = $('#rmsg', root);\n  $('#prt', root).addEventListener('click', () => { try { window.print(); } catch (e) { msg.textContent = 'Printing is blocked here. Use \"Download report as a file\" and print that file.'; } });\n  $('#dl', root).addEventListener('click', () => {\n    try {\n      const c = $('.rep', root).cloneNode(true), vv = c.querySelector('#viva');\n      if (vv) { if (vv.previousElementSibling) vv.previousElementSibling.remove(); vv.remove(); }\n      const html = '<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Lab report<\/title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:20px auto;padding:0 16px;color:#111;line-height:1.5}table{border-collapse:collapse;font-size:.9rem;margin:6px 0}td,th{border:1px solid #bbb;padding:3px 8px;text-align:center}img{max-width:100%;height:auto;border:1px solid #ccc}h2{border-bottom:2px solid #111;padding-bottom:4px}h3{margin:1.1em 0 .3em}<\/style><\/head><body>' + c.innerHTML + '<\/body><\/html>';\n      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'lens-lab-report.html';\n      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n      msg.textContent = 'Report downloaded.';\n    } catch (e) { msg.textContent = 'Download is blocked here. Open the lab in a normal browser tab.'; }\n  });\n}\nfunction rayUV(r) { const O = num(r.O), L = num(r.L), Sx = num(r.S); return { u: L - O, v: Sx - L }; }\nfunction drawRay(cv, u, v) {\n  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = 700, H = 290;\n  cv.width = W * dpr; cv.height = H * dpr;\n  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  const ink = css('--ink'), muted = css('--muted'), surf = css('--surface'), c1 = css('--accent'), c2 = css('--ok'), c3 = css('--warn');\n  ctx.fillStyle = surf; ctx.fillRect(0, 0, W, H); ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';\n  if (!(u > 0 && v > 0 && isFinite(u + v))) { ctx.fillStyle = muted; ctx.fillText('No valid u and v for this reading.', W / 2, H / 2); return; }\n  const f = u * v / (u + v), pad = 36, xmin = -u - 5, xmax = v + 5, sx = (W - 2 * pad) / (xmax - xmin), X = x => pad + (x - xmin) * sx, cy = 125;\n  const h = Math.min(52, 100 * u / v), hi = h * v / u, lx = X(0);\n  ctx.strokeStyle = muted; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(pad - 14, cy); ctx.lineTo(W - pad + 14, cy); ctx.stroke();\n  ctx.fillStyle = muted; ctx.font = '12px system-ui, sans-serif';\n  [[-f, 'F'], [f, 'F\u2032'], [-2 * f, '2F'], [2 * f, '2F\u2032']].forEach(([x, t]) => { const px = X(x); if (px > 8 && px < W - 8) { ctx.beginPath(); ctx.moveTo(px, cy - 5); ctx.lineTo(px, cy + 5); ctx.stroke(); ctx.fillText(t, px, cy + 19); } });\n  ctx.beginPath(); ctx.moveTo(lx, cy - 105); ctx.quadraticCurveTo(lx - 20, cy, lx, cy + 105); ctx.quadraticCurveTo(lx + 20, cy, lx, cy - 105); ctx.closePath();\n  ctx.globalAlpha = .18; ctx.fillStyle = c1; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke();\n  const P0 = [X(-u), cy - h], I = [X(v), cy + hi];\n  const ray = (mid, col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(P0[0], P0[1]); ctx.lineTo(mid[0], mid[1]); ctx.lineTo(I[0], I[1]); ctx.stroke(); };\n  ray([lx, cy - h], c1); ray([lx, cy], c2); ray([lx, cy + hi], c3);\n  ctx.font = 'bold 13px system-ui, sans-serif';\n  const arr = (x, y2, label) => { ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x, y2); ctx.stroke(); const d = y2 < cy ? 1 : -1; ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x - 5, y2 + d * 10); ctx.lineTo(x + 5, y2 + d * 10); ctx.closePath(); ctx.fill(); ctx.textAlign = 'center'; ctx.fillText(label, x, y2 < cy ? y2 - 8 : y2 + 18); };\n  arr(P0[0], P0[1], 'object'); arr(I[0], I[1], 'image');\n  ctx.font = '12px system-ui, sans-serif';\n  const dim = (xa, xb, label) => { ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(xa, 262); ctx.lineTo(xb, 262); ctx.moveTo(xa, 256); ctx.lineTo(xa, 268); ctx.moveTo(xb, 256); ctx.lineTo(xb, 268); ctx.stroke(); ctx.textAlign = 'center'; ctx.fillText(label, (xa + xb) / 2, 254); };\n  dim(X(-u), lx, 'u = ' + fmt(u, 1) + ' cm'); dim(lx, X(v), 'v = ' + fmt(v, 1) + ' cm');\n  ctx.textAlign = 'left'; ctx.fillStyle = ink; ctx.font = '13px system-ui, sans-serif';\n  ctx.fillText('1/f = 1/u + 1/v, so f = ' + fmt(f, 2) + ' cm', 12, 20);\n}\nfunction mountRay(host, getRows) {\n  host.innerHTML = '<div class=\"card\"><h3>Ray diagram of your reading<\/h3><p style=\"margin:0 0 8px;font-size:.95rem\">Pick a reading. The diagram is drawn from <i>your<\/i> own object and image distances (u and v). Three rays leave the top of the object: one parallel to the axis, one through the centre of the lens, and one through F. If you judged the sharp image well, all three meet exactly at the image.<\/p><div class=\"row\" data-r=\"sel\" style=\"margin-bottom:8px\"><\/div><div class=\"cvwrap2\"><canvas aria-label=\"Ray diagram drawn from your reading\"><\/canvas><\/div><div data-r=\"cap\" style=\"font-size:.93rem;margin-top:6px\"><\/div><\/div>';\n  const sel = host.querySelector('[data-r=sel]'), cv = host.querySelector('canvas'), cap = host.querySelector('[data-r=cap]'); let cur = 0, shown = -1;\n  function refresh() {\n    const rows = getRows();\n    if (!rows.length) { sel.innerHTML = ''; shown = -1; cv.style.display = 'none'; cap.textContent = 'Record at least one reading to see its ray diagram.'; return; }\n    cv.style.display = ''; cur = Math.min(cur, rows.length - 1);\n    if (shown !== rows.length) { sel.innerHTML = ''; rows.forEach((_, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Reading ' + (i + 1); b.addEventListener('click', () => { cur = i; refresh(); }); sel.appendChild(b); }); shown = rows.length; }\n    Array.prototype.forEach.call(sel.children, (b, i) => { b.className = 'btn sm' + (i === cur ? ' primary' : ''); });\n    const uv = rayUV(rows[cur]); drawRay(cv, uv.u, uv.v);\n    cap.innerHTML = 'Reading ' + (cur + 1) + ': u = <b>' + fmt(uv.u, 1) + ' cm<\/b>, v = <b>' + fmt(uv.v, 1) + ' cm<\/b>, so f = uv/(u + v) = <b>' + fmt(uv.u * uv.v / (uv.u + uv.v), 2) + ' cm<\/b> and the magnification is v/u = ' + fmt(uv.v / uv.u, 2) + '. The image is real and inverted.';\n  }\n  refresh(); return { refresh };\n}\nfunction statsCard(arr, unit, name) {\n  const n = arr.length;\n  if (n < 2) return '<div class=\"card\"><h3>Error analysis<\/h3><p style=\"margin:0\">Fill the ' + name + ' column of the observation table for at least two readings. The mean deviation and the standard error will then appear here.<\/p><\/div>';\n  const mean = arr.reduce((a, b) => a + b, 0) / n, dev = arr.map(x => Math.abs(x - mean)), md = dev.reduce((a, b) => a + b, 0) / n;\n  const sd = Math.sqrt(arr.reduce((a, x) => a + (x - mean) * (x - mean), 0) / (n - 1)), se = sd / Math.sqrt(n);\n  const rows = arr.map((x, i) => '<tr><td>' + (i + 1) + '<\/td><td>' + fmt(x, 2) + '<\/td><td>' + fmt(dev[i], 2) + '<\/td><\/tr>').join('');\n  return '<div class=\"card\"><h3>Error analysis of your ' + name + ' values<\/h3><div class=\"tw\"><table class=\"ob\" style=\"min-width:0\"><thead><tr><th>No.<\/th><th>' + name + ' (' + unit + ')<\/th><th>|' + name + ' \u2212 mean| (' + unit + ')<\/th><\/tr><\/thead><tbody>' + rows + '<\/tbody><\/table><\/div>'\n    + '<p style=\"margin:10px 0 4px\">Mean = <b>' + fmt(mean, 2) + ' ' + unit + '<\/b>. Mean deviation \u0394' + name + ' = <b>' + fmt(md, 2) + ' ' + unit + '<\/b>, which is <b>' + fmt(md / Math.abs(mean) * 100, 1) + '%<\/b> of the mean.<\/p>'\n    + '<p style=\"margin:0 0 4px\">Standard deviation = ' + fmt(sd, 2) + ' ' + unit + '. Standard error of the mean = ' + fmt(se, 2) + ' ' + unit + '.<\/p>'\n    + '<p style=\"margin:0\">Quote your result as <b>' + name + ' = ' + fmt(mean, 2) + ' \u00b1 ' + fmt(md, 2) + ' ' + unit + '<\/b> (mean deviation, as school lab manuals do) or with \u00b1 ' + fmt(se, 2) + ' ' + unit + ' (standard error, as degree labs do).<\/p><\/div>';\n}\nfunction statsLine(arr, name) {\n  name = name || 'f'; const n = arr.length; if (n < 2) return '';\n  const mean = arr.reduce((a, b) => a + b, 0) / n, md = arr.reduce((a, x) => a + Math.abs(x - mean), 0) / n;\n  return '<b>Error analysis:<\/b> mean deviation \u0394' + name + ' = ' + fmt(md, 2) + ' cm (' + fmt(md / Math.abs(mean) * 100, 1) + '% of the mean), so ' + name + ' = ' + fmt(mean, 2) + ' \u00b1 ' + fmt(md, 2) + ' cm.';\n}\n\n/* ======================================================\n   Router\n   ====================================================== */\nconst stepFns = [null, step1, step2, step3, step4, step5, step6, step7];\nfunction render() { refreshNav(); const main = $('#main'); main.innerHTML = ''; const root = document.createElement('div'); main.appendChild(root); stepFns[S.step](root); }\n$('#resetBtn').addEventListener('click', () => askConfirm('Reset the whole lab? All readings, graphs and results will be erased and new lenses will be given.', 'Reset lab', () => { S = newState(); save(); render(); window.scrollTo(0, 0); }));\nwindow.__lab = Object.assign(window.__lab || {}, { S: () => S, LN, bestScreen: () => bestScreenPointer(LN()), setStep: n => { S.step = n; render() ><div class=\"in\">\n  <div class=\"row\">\n    <span class=\"title\">Optics Lab \u00b7 Experiment 1B: other methods for a single lens<\/span>\n    <span class=\"seg\" id=\"lensTabs\" role=\"group\" aria-label=\"Choose the lens\"><\/span>\n    <button class=\"btn sm\" id=\"resetBtn\" type=\"button\">Reset this lab<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'exp1'},'*')\">Experiment 1 (u\u2013v)<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'method'},'*')\">Which method?<\/button>\n  <\/div>\n  <div class=\"steps\" id=\"steps\" aria-label=\"Steps\"><\/div>\n<\/div><\/div>\n<main class=\"wrap\"><div id=\"main\"><\/div><\/main>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst clamp = (x, a, b) => Math.max(a, Math.min(b, x));\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst num = s => { const x = parseFloat(String(s).replace('\u2212', '-').replace(',', '.')); return isFinite(x) ? x : NaN; };\nfunction fmt(n, d = 2) { if (!isFinite(n)) return '\u2014'; let r = Math.round(n * 10 ** d) / 10 ** d; if (Object.is(r, -0)) r = 0; return String(r).replace('-', '\u2212'); }\nfunction rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst T = (cls, html) => `<div class=\"teacher ${cls || ''}\"><b class=\"who\">Teacher\u2019s remark<\/b>${html}<\/div>`;\nconst field = (id, label, val, w) => `<label class=\"fld\">${label}<input id=\"${id}\" inputmode=\"decimal\" value=\"${val === undefined || val === null ? '' : val}\"${w ? ` style=\"width:${w}px\"` : ''}><\/label>`;\nfunction ask(msg, ok) { /* own confirm dialog: window.confirm can be blocked inside frames */\n  const d = document. ated cross-wire \u00b7 convex lens (A, B or C: the same lenses as in Experiment 1) \u00b7 screen \u00b7 graph paper.<\/p><\/div>\n  <div class=\"card\"><h3>Theory<\/h3>\n    <p><b>Plane-mirror method.<\/b> If an object pin is at the focal point of a lens, the light leaves the lens as a parallel beam. A plane mirror behind the lens sends it straight back, and the lens focuses it back at the pin. The image and the pin are in the same plane, so there is no parallax between them. The distance from the pin to the lens is <i>f<\/i>. This needs no screen and no formula.<\/p>\n    <p><b>Displacement method.<\/b> Fix the object and the screen a distance <i>D<\/i> apart, with D greater than 4f. A sharp image forms for <i>two<\/i> positions of the lens, a distance <i>d<\/i> apart. Then<\/p>\n    <p class=\"eq\">f = (D\u00b2 \u2212 d\u00b2) / 4D &nbsp;&nbsp; so &nbsp;&nbsp; D\u00b2 \u2212 d\u00b2 = 4f\u00b7D<\/p>\n    <p>A graph of (D\u00b2 \u2212 d\u00b2) against D is a straight line through the origin, with slope 4f. The method does not need the position of the lens centre: d is a difference of two readings on the <i>same<\/i> pointer, so a fixed index error in the lens pointer cancels out.<\/p><\/div>\n  <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:72ch\"><li>Plane-mirror method: find the pin position with no parallax. Check by moving the mirror. Take three readings.<\/li><li>Displacement method: fix the object and the screen, find the two sharp positions of the lens, and read all four pointers. Do this for at least four values of D.<\/li><li>Calculate f from each reading, then plot (D\u00b2 \u2212 d\u00b2) against D, and find f from the slope.<\/li><li>Compare f from the three methods and decide which is the most reliable for your readings.<\/li><\/ol><\/div>\n  <div class=\"note\">Choose Lens A, B or C at the top. They are the same lenses as in Experiment 1, so you can compare your results.<\/div>`;\n  nextBtn(root, 'G against D<\/h3><div class=\"row\"><label class=\"fld\">x-axis: 1 cm on paper = <select id=\"xs\">${opt([1, 2, 2.5, 5, 10], g.xs)}<\/select><\/label><label class=\"fld\">y-axis: 1 cm on paper = <select id=\"ys\">${opt([100, 200, 250, 500, 1000, 2000], g.ys)}<\/select><\/label><\/div>\n      <div class=\"row\" style=\"margin-top:6px\"><label class=\"fld\">x-axis label<input id=\"xl\" value=\"${g.xl}\" placeholder=\"e.g. D (cm)\"><\/label><label class=\"fld\">y-axis label<input id=\"yl\" value=\"${g.yl}\" placeholder=\"e.g. D\u00b2 \u2212 d\u00b2 (cm\u00b2)\"><\/label><\/div>\n      <p style=\"margin:8px 0 0;font-size:.9rem;color:var(--muted)\">Points plotted: <b id=\"np\">${g.pts.length}<\/b> of ${rows.length}. Click on the paper to plot a point; click a plotted point to remove it.<\/p><div class=\"row\" style=\"margin-top:8px\" id=\"gbtn\"><\/div><\/div><div id=\"gfb\"><\/div><div id=\"gread\"><\/div>`;\n    $('#xs', side).addEventListener('change', e => { g.xs = e.target.value; save(); flags = null; tri = null; redraw(); }); $('#ys', side).addEventListener('change', e => { g.ys = e.target.value; save(); flags = null; tri = null; redraw(); });\n    $('#xl', side).addEventListener('input', e => { g.xl = e.target.value; save(); redraw(); }); $('#yl', side).addEventListener('input', e => { g.yl = e.target.value; save(); redraw(); });\n    const bt = $('#gbtn', side), add = (t, fn, cls) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm ' + (cls || ''); b.textContent = t; b.addEventListener('click', fn); bt.appendChild(b); };\n    add('Undo last point', () => { g.pts.pop(); flags = null; save(); upd(); });\n    add('Clear all points', () => { g.pts = []; g.line = null; flags = null; tri = null; save(); upd(); });\n    add('Place the ruler line', () => { if (g.pts.length < 2) { $('#gfb', side).innerHTML = T('', 'Plot at least two points first.'); return; } const { m, c } = lsLine(g.pts), xs = g.pts.map(q => q[0]), x0 = Math.min(...xs close to the points. Adjust the handles.'); }\n    const ok = !msgs.length; g.checked = { plotOk: ok, ok: (g.checked && g.checked.ok) || false }; save(); fb.innerHTML = ok ? T('good', 'The plot looks good. Now read the slope below.') : T('bad', msgs.map(m => '\u2022 ' + m).join('<br>')); redraw(); readPanel(); refreshNav();\n  }\n  const pos = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * PW, (ev.clientY - r.top) / r.height * PH]; };\n  const inPaper = (px, py) => px >= OX - 2 && px <= OX + XR * SQ + 4 && py >= OY - YR * SQ - 4 && py <= OY + BELOW * SQ + 4;\n  cv.addEventListener('pointermove', ev => { const xs = parseFloat(g.xs), ys = parseFloat(g.ys), [px, py] = pos(ev); if (dragH !== null) { const [x, y] = toD({ xs, ys }, Math.round(px / 1.5) * 1.5, Math.round(py / 1.5) * 1.5); g.line[dragH] = [Math.max(0, x), y]; tri = null; redraw(); return; } if (xs > 0 && ys > 0 && inPaper(px, py)) { const [x, y] = toD({ xs, ys }, px, py); $('#cur', root).textContent = `D \u2248 ${fmt(x, 1)}   D\u00b2\u2212d\u00b2 \u2248 ${fmt(y, 0)}`; } });\n  cv.addEventListener('pointerdown', ev => {\n    const xs = parseFloat(g.xs), ys = parseFloat(g.ys); if (!(xs > 0 && ys > 0)) return; const [px, py] = pos(ev), gs = { xs, ys };\n    if (g.line) for (let i = 0; i < 2; i++) { const q = toP(gs, g.line[i][0], g.line[i][1]); if (Math.hypot(q[0] - px, q[1] - py) < 12) { dragH = i; cv.setPointerCapture(ev.pointerId); return; } }\n    if (!inPaper(px, py)) return;\n    for (let i = 0; i < g.pts.length; i++) { const q = toP(gs, g.pts[i][0], g.pts[i][1]); if (Math.hypot(q[0] - px, q[1] - py) < 8) { g.pts.splice(i, 1); flags = null; save(); upd(); return; } }\n    g.pts.push(toD(gs, Math.round(px / 1.5) * 1.5, Math.round(py / 1.5) * 1.5)); flags = null; save(); upd();\n  });\n  const stop = () => { if (dragH !== null) { dragH = null; save(); } }; cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);\n  if (g.checked && g.checked.ok && g.line) { const x1 = num(g.x1), y1 = num(g.y1), x2 = num(g.x2), y2 = num(g.y2); if ([x1, y1, x2, y2].every(isFinite)) tri = [[x1, y1], [x2, y2]]; }\n  if (!rows.length) side.innerHTML = T('', 'You have no displacement readings yet. Go back and take readings first.'); else { buildSide(); redraw(); }\n  nextBtn(root, 'Compare the methods');\n}\n\n/* ======================================================\n   Step 5: compare the methods\n   ====================================================== */\nconst SRC = [['Judging the sharpest image: it is done twice per reading in the displacement method, and once per reading for the u\u2013v method', 1], ['Judging the no-parallax position (plane-mirror method)', 1], ['Index error: the pointer is not exactly under the lens centre. It affects u\u2013v and the plane-mirror method, but cancels in d of the displacement method', 1], ['Reading the scale to about \u00b10.5 mm', 1], ['The lens is thick, and a thin-lens formula was used', 1], ['The lamp changed the focal length of the lens', 0], ['The plane mirror was slightly curved, so the lens formula changed', 0]];\nconst PRE = [['For the displacement method, keep D more than 4f', 1], ['Do not move the object or the screen between the two lens positions', 1], ['For the plane-mirror method, check by moving the mirror', 1], ['Keep everything at the same height on one axis', 1], ['Use only the mirror method, since it needs only one reading', 0], ['Change D by moving the lens, not the screen', 0]];\nfunction step5(root, l) {\n  const c = l.cmp, f = trueF(l), prev = expOneResult(l), dRows = l.dis.rows.map(r => num(r.f)).filter(isFinite), dMean = dRows.length ? dRows.reduce((s, x) => s + x, 0) / dRows.length : NaN;\n  const checks = (id, arr, key) => { $('#' + id, root).innerHTML = arr.map(([t], i) => `<label class=\"chk\"><input type=\"checkbox\" data-i=\"${i}\" ${c[key].includes(i) ? 'checked' : ''}><span>${t}<\/span><\/label>`).join(''); $$('#' + id + ' input', root).forEach(k plane-mirror', m], ['displacement (table)', dt], ['displacement (graph)', dg]]; if (isFinite(uv)) list.unshift(['u\u2013v (Experiment 1)', uv]);\n    const best = list.reduce((a, b) => err(a[1]) <= err(b[1]) ? a : b); c.err = err(fin).toFixed(1); c.submitted = true; save(); refreshNav();\n    const sOK = c.src.filter(i => SRC[i][1]).length, sBad = c.src.filter(i => !SRC[i][1]).length, pOK = c.pre.filter(i => PRE[i][1]).length, pBad = c.pre.filter(i => !PRE[i][1]).length;\n    let html = `The accepted value for Lens ${l.id} is <b>${fmt(f, 2)} cm<\/b>. Your final f is ${fmt(fin, 2)} cm (<b>${fmt(err(fin), 1)}%<\/b> away).<br><br><b>Comparison:<\/b><ul style=\"margin:6px 0 6px 1.2em\">${list.map(([n, x]) => `<li>${n}: ${fmt(x, 2)} cm, ${fmt(err(x), 1)}% from the accepted value<\/li>`).join('')}<\/ul>`;\n    html += `Closest in your readings: <b>${best[0]}<\/b>. `;\n    html += `<br><br><b>Why the methods differ.<\/b> In the u\u2013v method, u and v both depend on the position of the lens pointer, so a fixed index error enters both. In the displacement method, d is a difference of two readings on the same pointer, so that error cancels, and only D (a difference of two other pointers) carries it, and it matters less because D is large. The plane-mirror method needs a single setting but depends on how well you judge parallax, and on the pin and lens pointers. None of the three is free of error. The displacement method is the least affected by the pointer index error, because the lens-pointer error cancels in d. Whether it is also the closest in <i>your<\/i> readings depends on how well you judged the sharp positions.`;\n    html += `<br><br>Sources of error: ${sOK} correct, ${sBad} wrong. Precautions: ${pOK} correct, ${pBad} wrong.`;\n    fb.innerHTML = T(err(fin) <= 6 ? 'good' : 'bad', html);\n  });\n  nextBtn(root, 'Go to the report');\n}\n\n/* ======================================================\n   Step 6: report\n   ====================================================== */\nfunction step6(root, l) {\n  const M = l.mir, D = l.dis, c = l.cmp, g = D.g;\n  if (!D.rows.length && !M.rows.length) { root.innerHTML = '<h2>Lab report<\/h2><p>You have not taken any readings for this lens yet.<\/p>'; nextBtn(root); return; }\n  let img = ''; if (g.pts.length) { const cn = document.createElement('canvas'); cn.width = PW; cn.height = PH; let tri = null; const x1 = num(g.x1), y1 = num(g.y1), x2 = num(g.x2), y2 = num(g.y2); if (g.checked && g.checked.ok && [x1, y1, x2, y2].every(isFinite)) tri = [[x1, y1], [x2, y2]]; drawPaper(cn.getContext('2d'), g, { tri }); img = `<img alt=\"Graph\" src=\"${cn.toDataURL('image/png')}\" width=\"${PW}\">`; }\n  root.innerHTML = `<div class=\"row noprint\" style=\"margin-bottom:10px\"><button class=\"btn primary\" id=\"prt\" type=\"button\">Print or save as PDF<\/button><span id=\"pmsg\" style=\"font-size:.9rem;color:var(--muted)\"><\/span><\/div>\n  <div class=\"rep\"><h2>Focal length of a convex lens: plane-mirror and displacement methods (Lens ${l.id})<\/h2>\n  <h3>Aim<\/h3><p>To find the focal length of a convex lens by the plane-mirror method and by the displacement method, and to compare them with the u\u2013v method.<\/p>\n  <h3>Theory<\/h3><p>Plane mirror: with the pin at the focal point there is no parallax between the pin and its image, so f is the pin-to-lens distance. Displacement: f = (D\u00b2 \u2212 d\u00b2)/4D for D greater than 4f; the graph of D\u00b2 \u2212 d\u00b2 against D is a straight line of slope 4f.<\/p>\n  <h3>Plane-mirror method<\/h3><table><tr><th>No.<\/th><th>P (cm)<\/th><th>L (cm)<\/th><th>f (cm)<\/th><\/tr>${M.rows.map((r, i) => `<tr><td>${i + 1}<\/td><td>${r.P}<\/td><td>${r.L}<\/td><td>${r.f}<\/td><\/tr>`).join('')}<\/table><p>Mean f = ${M.mean || '\u2014'} cm.<\/p>\n  <h3>Displacement method<\/h3><div class=\"tw\"><table><tr><th>No.<\/th>${DCOLS.map(x => `<th>${x.l}<\/th>`).join('')}<\/tr>${D.rows.map((r, i) => `<tr><td>${i + 1}<\/td>${DCOLS.map(x => `<td>${r[x.k]}<\/td>`).join('')}<\/tr>`).join('')}<\/table><\/div>\n  <h3>Graph<\/h3>${img || '<p>Not plotted.<\/p>'}<p>Slope = 4f = ${g.slope || '\u2014'} cm, so f = ${g.f || '\u2014'} cm.<\/p>\n  <h3>Result<\/h3><p>u\u2013v: ${c.uv || '\u2014'} cm. Plane mirror: <b>${c.mir || '\u2014'} cm<\/b>. Displacement (table): <b>${c.dt || '\u2014'} cm<\/b>. Displacement (graph): <b>${c.dg || '\u2014'} cm<\/b>. Final f = <b>${c.fin || '\u2014'} cm<\/b>.<\/p>\n  <h3>Sources of error<\/h3><p>${c.src.length ? c.src.map(i => SRC[i][0]).join('; ') : 'not filled in'}.<\/p><h3>Precautions<\/h3><p>${c.pre.length ? c.pre.map(i => PRE[i][0]).join('; ') : 'not filled in'}.<\/p><\/div>`;\n  $('#prt', root).addEventListener('click', () => { try { window.print(); } catch (e) { $('#pmsg', root).textContent = 'Printing is blocked here. Use Ctrl+P, or open this page in its own tab.'; } });\n  nextBtn(root);\n}\n\n/* ======================================================\n   Router\n   ====================================================== */\nconst STEP_FNS = [null, step1, step2, step3, step4, step5, step6];\nfunction render() { refreshNav(); const main = $('#main'); main.innerHTML = ''; const root = document.createElement('div'); main.appendChild(root); STEP_FNS[S.step](root, LN()); }\n$('#resetBtn').addEventListener('click', () => ask('Reset this lab? All readings, graphs and results in Experiment 1B will be erased.', () => { const keep = S.lens; S = newState(); LENSES.forEach(L => { S.lens[L.id].f = keep[L.id].f; }); save(); render(); window.scrollTo(0, 0); }));\nwindow.__lab = { S: () => S, LN, setStep: n => { S.step = n; render(); }, rerender: render, autoImage: sh => autoImage(LN(), sh), dispImage: () => dispImage(LN()), dispSharp: () => dispSharp(LN()), trueF: () => trueF(LN()), geom: { PW, PH, SQ, OX, OY, XR, YR } };\nrender();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "college": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: Combination of Lenses (method of magnification)<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16213A; --muted:#55627C; --line:#D2DAE6; --soft:#E9EFFA;\n  --accent:#1F5FD6; --ok:#12805C; --okbg:#E2F4EB; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0E1424; --surface:#151F36; --ink:#E8EDF8; --muted:#A5B2CB; --line:#2C3A58; --soft:#1B2B4D;\n    --accent:#7BA9FF; --ok:#4FCF98; --okbg:#12332A; --bad:#FF8A80; --badbg:#3A1E1B; --warn:#F5C451; --warnbg:#3A3015; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh2{font-size:1.6rem} h3{font-size:1.15rem;margin-top:1.3em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,input,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\nsub,sup{line-height:0}\n.top{background:var(--bg);border-bottom:1px solid var(--line)}\n@media (min-width:700px){.top{position:sticky;top:0;z-index:30}}\n.top .in{max-width:1060px;margin:0 auto;padding:8px 16px}\n.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.title{font-family:var(--serif);font-size:1.05rem;font-weight:700}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.seg button{border:0;background:var(--surface);padding:5px 13px;cursor:pointer;font-size:.92rem}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;font-weight:600}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}\n.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.87rem;cursor:pointer}\n.steps button[aria-current=\"step\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n.steps button.done::after{content:\" \u2713\";color:var(--ok)}\n.steps button[aria-current=\"step\"].done::after{color:inherit}\n@media (prefers-color-scheme: dark){.seg button[aria-pressed=\"true\"],.steps button[aria-current=\"step\"],.btn.primary{color:#0E1424}}\n.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 80px}\n.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.95rem}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n.btn.sm{padding:3px 9px;font-size:.85rem}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 14px}\n.card h3{margin-top:0}\n.note{border-left:5px solid var(--accent);background:var(--soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:0 0 12px;max-width:74ch;font-size:.97rem}\n.teacher{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\n.teacher.good{border-color:var(--ok);background:var(--okbg)}\n.teacher.bad{border-color:var(--bad);background:var(--badbg)}\n.teacher b.who{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.12rem}\n.hidden{display:none !important}\n.benchwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}\n.benchwrap canvas{display:block}\n.carriers{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 0}\n.car{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem;min-width:200px}\n.car b{display:block;margin-bottom:3px}\n.car .b6{display:flex;gap:3px;flex-wrap:wrap}\n.car .b6 button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:.82rem;font-family:var(--mono)}\n.car .b6 button:hover{border-color:var(--accent)}\n.car input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent)}\n.viewrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:6px 0 14px}\n.zoombox,.screenbox{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;max-width:100%}\n.zoombox canvas{display:block;border:1px solid var(--line);border-radius:4px;max-width:100%;height:auto}\n.screen{width:300px;max-width:100%;height:220px;border-radius:6px;overflow:hidden;background:#8C9299;position:relative;border:3px solid #444;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}\n.screen canvas{position:absolute;left:0;top:0}\n.tw{overflow-x:auto}\ntable.ob{border-collapse:collapse;font-size:.92rem;min-width:820px}\n.ob th,.ob td{border:1px solid var(--line);padding:4px 6px;text-align:center}\n.ob th{background:var(--soft);font-weight:600}\n.ob input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-family:var(--mono);font-size:.9rem}\n.ob input.ok,.fld input.ok{border-color:var(--ok);background:var(--okbg)}\n.ob input.bad,.fld input.bad{border-color:var(--bad);background:var(--badbg)}\n.fld{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}\n.fld input,.fld select{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:140px}\n.chk{display:flex;gap:9px;align-items:flex-start;margin:4px 0;font-size:.96rem}\n.chk input{margin-top:5px}\n.paperwrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#bbb;padding:8px;display:block;max-width:100%}\n.paperwrap canvas{display:block;background:#FFFDF7;cursor:crosshair;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}\n.gcols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.gcols>div{min-width:0;max-width:100%}\n.gside{flex:1 1 300px;max-width:440px}\n.cursorout{font-family:var(--mono);font-size:.88rem;color:var(--muted);min-height:1.5em}\n.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 26px;max-width:880px}\n.rep h2{font-size:1.4rem;border-bottom:2px solid var(--ink);padding-bottom:4px}\n.rep h3{font-size:1.05rem;margin-top:1.1em}\n.rep table{border-collapse:collapse;font-size:.9rem;margin:6px 0}\n.rep td,.rep th{border:1px solid var(--line);padding:3px 8px;text-align:center}\n.rep img{max-width:100%;height:auto;border:1px solid var(--line);margin:4px 0}\n.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}\n.dlg .box{background:var(--surface);border-radius:10px;padding:18px 20px;max-width:420px;border:1px solid var(--line)}\n@media print{ .top,.btn,.noprint,.dlg{display:none !important} body{background:#fff;color:#000} .wrap{padding:0} .rep{border:0;padding:0} }\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><div class=\"in\">\n  <div class=\"row\">\n    <span class=\"title\">Optics Lab \u00b7 Combination of Lenses (method of magnification)<\/span>\n    <span class=\"seg\" id=\"sysTabs\" role=\"group\" aria-label=\"Lens system\"><\/span>\n    <button class=\"btn sm\" id=\"resetBtn\" type=\"button\">Reset lab<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'method'},'*')\">Which method?<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'exp1'},'*')\">Experiment 1<\/button>\n  <\/div>\n  <div class=\"steps\" id=\"steps\" aria-label=\"Steps\"><\/div>\n<\/div><\/div>\n<main class=\"wrap\"><div id=\"main\"><\/div><\/main>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst clamp = (x, a, b) => Math.max(a, Math.min(b, x));\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst num = s => { const x = parseFloat(String(s).replace('\u2212', '-').replace(',', '.')); return isFinite(x) ? x : NaN; };\nfunction fmt(n, d = 2) { if (!isFinite(n)) return '\u2014'; let r = Math.round(n * 10 ** d) / 10 ** d; if (Object.is(r, -0)) r = 0; return String(r).replace('-', '\u2212'); }\nfunction rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst T = (cls, html) => `<div class=\"teacher ${cls || ''}\"><b class=\"who\">Teacher\u2019s remark<\/b>${html}<\/div>`;\nconst field = (id, label, val, w) => `<label class=\"fld\">${label}<input id=\"${id}\" inputmode=\"decimal\" value=\"${val === undefined || val === null ? '' : val}\"${w ? ` style=\"width:${w}px\"` : ''}><\/label>`;\nfunction ask(msg, ok) { /* own confirm dialog: window.confirm can be blocked inside frames */\n  const d = document.createElement('div'); d.className = 'dlg'; d.innerHTML = `<div class=\"box\" role=\"dialog\" aria-modal=\"true\"><p style=\"margin:0 0 14px\">${msg}<\/p><div class=\"row\"><button class=\"btn primary\" data-y=\"1\" type=\"button\">Yes, reset<\/button><button class=\"btn\" data-y=\"0\" type=\"button\">Cancel<\/button><\/div><\/div>`;\n  d.addEventListener('click', e => { const b = e.target.closest('button'); if (!b && e.target !== d) return; d.remove(); if (b && b.dataset.y === '1') ok(); });\n  document.body.appendChild(d); $('button', d).focus();\n}\n\n/* ======================================================\n   State: two lens systems (hidden true values come from a seed)\n   ====================================================== */\nconst SYS_DEF = { '1': { name: 'Lens system 1', nom: [25, 30], d: 10 }, '2': { name: 'Lens system 2', nom: [28, 28], d: 12 } };\nconst STEPS = ['Aim and theory', 'Part A: f\u2081 and f\u2082', 'Part B: readings', 'Observation table', 'Graphs', 'Principal planes', 'Result', 'Report'];\nconst KEY = 'optics_lab_combination_college_v1';\nconst OSZ = 1;                                                                   /* size of the object section, cm */\nfunction newGraph() { return { xs: '', ys: '', xl: '', yl: '', pts: [], line: null, x1: '', y1: '', x2: '', y2: '', slope: '', icp: '', checked: null }; }\nfunction mkSys(id, r) {\n  const def = SYS_DEF[id], o = () => +((r() * 2 - 1) * 0.12).toFixed(2);\n  return { id, f: def.nom.map(f => +(f * (1 + (r() * 2 - 1) * 0.04)).toFixed(2)), d: def.d, dOff: +((r() * 2 - 1) * 0.1).toFixed(2),\n    A: { cur: 1, pos: { p: 8, l: 8 + def.nom[0], m: 8 + def.nom[0] + 22 }, off: { p: o(), l: o(), m: o() }, rows: { 1: [], 2: [] }, mean: { 1: '', 2: '' }, checked: { 1: null, 2: null } },\n    B: { pos: { o: 4, a: 30, s: 85 }, off: { o: o(), a: o(), b: o(), s: o() }, rows: [], gr: { 1: newGraph(), 2: newGraph() }, dg: { scale: '', marks: {}, checked: null }, res: { src: [], pre: [] } } };\n}\nfunction newState() { const seed = (Math.random() * 2 ** 31) | 0, r = rng(seed); return { v: 1, seed, cur: '1', step: 1, auto: false, sys: { '1': mkSys('1', r), '2': mkSys('2', r) } }; }\nfunction load() { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.v === 1) return j; } catch (e) { /* none */ } return null; }\nlet S = load() || newState(), saveT = null;\nfunction save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* unavailable */ } }, 150); }\nconst SD = () => S.sys[S.cur];\n/* the true separation, and the true values the lab accepts */\nconst dTrue = sd => sd.d + sd.dOff;\nconst accF = sd => { const [a, b] = sd.f, d = dTrue(sd); return a * b / (a + b - d); };\n\n/* ---------- hidden optics ---------- */\nfunction chain(xo, lenses) {\n  let cx = xo, m = 1;\n  for (const L of lenses) {\n    const u = cx - L.x, inv = 1 / L.f + 1 / u; if (Math.abs(inv) < 1e-9) return null;\n    const v = 1 / inv; m *= v / u; cx = L.x + v;\n  }\n  return { xi: cx, m };\n}\nfunction imagingB(sd) {\n  const p = sd.B.pos, o = sd.B.off, xa = p.a + o.a, xb = p.a + sd.d + o.b, xo = p.o + o.o, xs = p.s + o.s;\n  const r = chain(xo, [{ x: xa, f: sd.f[0] }, { x: xb, f: sd.f[1] }]);\n  if (!r || r.xi <= xb + 0.05) return { virtual: true, sigma: 22, m: 0 };\n  const delta = xs - r.xi, v = r.xi - xb; return { virtual: false, xi: r.xi, m: Math.abs(r.m), delta, sigma: 0.5 + 6 * Math.abs(delta) * (25 / Math.max(v, 10)), u: xa - xo, v };\n}\nfunction bestScreenB(sd) { const st = imagingB(sd); return st.virtual ? null : +(st.xi - sd.B.off.s).toFixed(1); }\n/* auto-collimation: pin, lens, plane mirror behind the lens */\nfunction autoImage(sd, mirrorShift) {\n  const A = sd.A, f = sd.f[A.cur - 1], xp = A.pos.p + A.off.p, xl = A.pos.l + A.off.l, xm = A.pos.m + A.off.m + (mirrorShift || 0), u = xl - xp;\n  if (u <= 0.3 || xm - xl <= 0.3) return { bad: true, sigma: 20, dep: 99 };\n  const inv1 = 1 / f - 1 / u; let v2;\n  if (Math.abs(inv1) < 1e-6) v2 = f;\n  else { const v1 = 1 / inv1, xv = xl + v1, xr = 2 * xm - xv, u2 = xr - xl, inv2 = 1 / f - 1 / u2; if (Math.abs(inv2) < 1e-9) return { bad: true, sigma: 20, dep: 99 }; v2 = 1 / inv2; }\n  const xi = xl - v2, dep = xi - xp; return { bad: false, xi, dep, sigma: 0.6 + 2.5 * Math.abs(dep), u, f };\n}\n\n/* ======================================================\n   Graph paper with a negative y region\n   ====================================================== */\nconst PW = 510, PH = 620, SQ = 30, OX = 45, BELOW = 4, OY = PH - 45 - BELOW * SQ, XR = 15, YR = 14;\nconst toP = (g, x, y) => [OX + x / g.xs * SQ, OY - y / g.ys * SQ];\nconst toD ally.<\/p><\/div>\n  <div class=\"card\"><h3>Theory of the method of magnification<\/h3>\n    <p>A lens system behaves like one lens of focal length F, but its object and image distances are measured from its two <b>principal planes<\/b> (H and H\u2032), not from the lenses. For an object at distance u\u2032 from H and an image at v\u2032 from H\u2032, with magnification m = I/O:<\/p>\n    <p class=\"eq\">v\u2032 = F (1 + m) &nbsp;&nbsp; u\u2032 = F (1 + 1/m)<\/p>\n    <p>In the lab we measure <i>u<\/i> from the lens nearest the object and <i>v<\/i> from the lens nearest the screen. They differ from u\u2032 and v\u2032 by constants, so<\/p>\n    <p class=\"eq\">v = F (1 + m) + \u03b2 &nbsp;&nbsp; u = F (1 + 1/m) + \u03b1<\/p>\n    <p>A graph of <i>v<\/i> against (1 + m) is a straight line of <b>slope F<\/b> (we call it f\u2032) with intercept \u03b2. A graph of <i>u<\/i> against (1 + 1/m) has <b>slope F<\/b> (f\u2033) and intercept \u03b1. The intercepts tell us where the principal planes are. Both are negative for a system of two convex lenses, which means the principal planes lie inside the system.<\/p><\/div>\n  <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:72ch\">\n    <li><b>Part A.<\/b> Find the focal length of each lens separately by auto-collimation, using a plane mirror and an index pin.<\/li>\n    <li><b>Part B.<\/b> With the two lenses d apart, use the plastic scale as the object (take a 1 cm section as the object size O). Focus a real image on the graph-paper screen and measure the image size I. Measure u (object to the nearest lens) and v (screen to the nearest lens). Take readings for several object distances, some with m less than 1 and the others with m greater than 1.<\/li>\n    <li>Calculate m = I/O, 1 + m and 1 + 1/m for each reading.<\/li>\n    <li>Plot v against (1 + m) and u against (1 + 1/m). The slopes are f\u2032 and f\u2033; the intercepts are \u03b2 and \u03b1.<\/li>\n    <li>Draw the principal planes to scale on graph paper.<\/li>\n    <li>Compare the mean of f\u2032 and f\u2033 with the theoretical value.<\/li><\/ol><\/div>\n  <div class=\"note\">You have two lens systems (see the buttons at the top). In this lab the lens system has d = ${sd.d} cm.<\/div>`;\n  nextBtn(root, 'Go to Part A');\n}\n\n/* ======================================================\n   Step 2: Part A, auto-collimation\n   ====================================================== */\nfunction step2(root, sd) {\n  const A = sd.A; const lensName = k => `Lens ${k} of ${SYS_DEF[sd.id].name.toLowerCase()}`;\n  root.innerHTML = `<h2>Part A: focal length of each lens by auto-collimation<\/h2>\n  <p>Put the lens in front of a plane mirror. Place the index pin on the other side of the lens. When the pin is at the <b>focal point<\/b>, the light leaves the lens parallel, the mirror sends it straight back, and the lens forms an image of the pin right beside the pin itself. The image then lies in the same plane as the pin, so there is <b>no parallax<\/b> between them. The distance from the pin to the lens is f.<\/p>\n  <div class=\"note\">How to check for parallax: move your head slightly left and right (use the slider under the picture). If the image appears to move relative to the pin, they are not at the same depth. Adjust the pin or the lens until they move together. Then slide the <b>mirror<\/b> a few cm. If the image still stays on the pin, you are at the focal point. If it does not, you had found a false position, and you must look again.<\/div>\n  <div class=\"row\" style=\"margin:6px 0 10px\"><span class=\"seg\" id=\"lensSel\"><button type=\"button\" data-k=\"1\">Lens 1<\/button><button type=\"button\" data-k=\"2\">Lens 2<\/button><\/span><span style=\"font-size:.9rem;color:var(--muted)\">Test one lens at a time. Take three readings for each.<\/span><\/div>\n  <div id=\"bench\"><\/div>\n  <div class=\"card\" id=\"rec\"><\/div>`;\n  const names = { p: 'Index pin carrier', l: 'Lens carrier', m: 'Mirror carrier' }, p = A.pos;\n  let eye = 0, host, viewReady = false;\n  const bench = makeBench($('#bench', root), {\n    keys: ['p', 'l', 'm'], names, p,\n    draw: (ctx, X) => {\n      ['p', 'l', 'm'].slice().sort((a, b) => p[a] - p[b]).forEach(c => {\n        const x = X(p[c]); carrierBase(ctx, x);\n        if (c === 'p') { ctx.fillStyle = '#e8c9a0'; ctx.fillRect(x - 10, 56, 20, 6); ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, 62); ctx.lineTo(x, 112); ctx.stroke(); ctx.fillStyle = '#222'; ctx.beginPath(); ctx.moveTo(x, 54); ctx.lineTo(x - 3, 62); ctx.lineTo(x + 3, 62); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#16213A'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('pin', x, 44); ctx.textAlign = 'left'; }\n        else if (c === 'l') lensGlyph(ctx, x, 9, 'Lens ' + A.cur);\n        else { const g = ctx.createLinearGradient(x - 4, 0, x + 4, 0); g.addColorStop(0, '#9fb4c8'); g.addColorStop(.5, '#eef4fa'); g.addColorStop(1, '#8da3b9'); ctx.fillStyle = g; ctx.fillRect(x - 3, 44, 7, 96); ctx.strokeStyle = '#445'; ctx.lineWidth = 1; ctx.strokeRect(x - 3, 44, 7, 96); ctx.fillStyle = '#16213A'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('mirror', x, 36); ctx.textAlign = 'left'; }\n      });\n    },\n    afterMove: () => { if ($('#rfb', root)) $('#rfb', root).innerHTML = ''; }, onRedraw: () => { if (viewReady) drawView(); }\n  });\n  host = bench.viewsHost;\n  host.innerHTML = `<div class=\"screenbox\"><b>Looking at the pin and its image<\/b>\n    <div class=\"screen\" style=\"margin-top:6px;background:#d9d3c3\"><canvas id=\"pinC\" width=\"300\" height=\"220\"><\/canvas><canvas id=\"imgC\" width=\"300\" height=\"220\"><\/canvas><\/div>\n    <label style=\"display:block;font-size:.9rem;margin-top:6px\">Move your head: <span id=\"eyeo\">centre<\/span><br><input type=\"range\" id=\"eye\" min=\"-1\" max=\"1\" step=\"0.1\" value=\"0\" style=\"widt /button><\/div>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"auto\" ${S.auto ? 'checked' : ''}><span>Skip the scale-reading practice: fill the pointer readings for me<\/span><\/label><div id=\"rfb\"><\/div>\n      <div class=\"tw\"><table class=\"ob\" style=\"min-width:0;margin-top:8px\"><thead><tr><th>No.<\/th><th>Pin P (cm)<\/th><th>Lens L (cm)<\/th><th>f = L \u2212 P (cm)<\/th><\/tr><\/thead><tbody>${rows.map((r, i) => `<tr data-i=\"${i}\"><td>${i + 1}<\/td><td>${r.P}<\/td><td>${r.L}<\/td><td><input data-k=\"f\" inputmode=\"decimal\" value=\"${r.f}\" aria-label=\"f for reading ${i + 1}\"><\/td><\/tr>`).join('') || '<tr><td colspan=\"4\">No readings yet.<\/td><\/tr>'}<\/tbody><\/table><\/div>\n      <div class=\"row\" style=\"margin-top:8px\">${field('mean', `Mean f${k} (cm)`, A.mean[k])}<button class=\"btn primary\" id=\"chk\" type=\"button\" style=\"align-self:flex-end\">Check with the teacher<\/button><\/div><div id=\"cfb\"><\/div>`;\n    $('#auto', rec).addEventListener('change', e => { S.auto = e.target.checked; save(); });\n    $$('tbody input', rec).forEach(inp => inp.addEventListener('input', () => { rows[+inp.closest('tr').dataset.i].f = inp.value; A.checked[k] = null; save(); refreshNav(); }));\n    $('#mean', rec).addEventListener('input', e => { A.mean[k] = e.target.value; A.checked[k] = null; save(); refreshNav(); });\n    $('#add', rec).addEventListener('click', () => {\n      const P = S.auto ? p.p : num($('#rP', rec).value), L = S.auto ? p.l : num($('#rL', rec).value), fb = $('#rfb', rec); const say = h => { fb.innerHTML = h; };\n      if (![P, L].every(isFinite)) return say(T('', 'Enter both pointer readings.'));\n      if (Math.abs(P - p.p) > 0.06 || Math.abs(L - p.l) > 0.06) return say(T('bad', 'A reading does not match its pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'));\n      const st = autoImage(sd); if (st.bad) return say(T('bad', 'No image is visible. The lens must be between L = `<div class=\"row noprint\" style=\"margin-bottom:10px\"><button class=\"btn primary\" id=\"prt\" type=\"button\">Print or save as PDF<\/button><span id=\"pmsg\" style=\"font-size:.9rem;color:var(--muted)\"><\/span><\/div>\n  <div class=\"rep\"><h2>Combination of Lenses<\/h2><h3>Aim<\/h3><p>To find the equivalent focal length of the lens system by the method of magnification.<\/p>\n  <h3>Apparatus<\/h3><p>Lens system, plane mirror, plastic scale, stand, lamp, screen (graph paper), index pin.<\/p><h3>Formula<\/h3><p>f = f\u2081f\u2082/(f\u2081 + f\u2082 \u2212 d), where f\u2081 and f\u2082 are the focal lengths of the lenses and d is the distance between them. v = F(1 + m) + \u03b2 and u = F(1 + 1/m) + \u03b1.<\/p>\n  <h3>Observations<\/h3><p>1) By auto-collimation, f\u2081 = ${fmt(num(A.mean[1]), 2)} cm. 2) By auto-collimation, f\u2082 = ${fmt(num(A.mean[2]), 2)} cm. 3) Size of the object O = ${OSZ} cm. 4) Distance between the two lenses d = ${sd.d} cm.<\/p>\n  <p><b>Auto-collimation, lens 1<\/b><\/p><table><tr><th>No.<\/th><th>P (cm)<\/th><th>L (cm)<\/th><th>f (cm)<\/th><\/tr>${rowsA(1)}<\/table><p><b>Auto-collimation, lens 2<\/b><\/p><table><tr><th>No.<\/th><th>P (cm)<\/th><th>L (cm)<\/th><th>f (cm)<\/th><\/tr>${rowsA(2)}<\/table>\n  <div class=\"tw\"><table><tr><th>Obs. No.<\/th>${COLS.map(c => `<th>${c.l}<\/th>`).join('')}<\/tr>${rowsB}<\/table><\/div>\n  <h3>Graphs<\/h3><div>${paperImg(B.gr[1])} ${paperImg(B.gr[2])}<\/div><h3>Principal planes (to scale)<\/h3>${dimg || '<p>Not drawn yet.<\/p>'}\n  <h3>Calculations<\/h3><p>f\u2032 = ${r.fp || '\u2014'} cm (slope of v against 1 + m, intercept \u03b2 = ${B.gr[1].icp || '\u2014'} cm). f\u2033 = ${r.fpp || '\u2014'} cm (slope of u against 1 + 1/m, intercept \u03b1 = ${B.gr[2].icp || '\u2014'} cm). Average f = ${r.avg || '\u2014'} cm. By formula, f = ${r.th || '\u2014'} cm.<\/p>\n  <h3>Result<\/h3><p>The equivalent focal length of the system is <b>f\u2032 = ${r.fp || '\u2014'} cm<\/b> (graph of v against 1 + m), < }, { k: 'iF', l: '1/F = (1 \u2212 d/f\u2081)/BFL<br>(cm\u207b\u00b9)' }, { k: 'F', l: 'F<br>(cm)' }]\n};\nconst DIG = { u: 1, v: 1, d: 1, bfl: 1, iu: 4, iv: 4, iF: 4, f: 2, F: 2 };\nconst TOLF = { u: () => 0.06, v: () => 0.06, d: () => 0.06, bfl: () => 0.06, iu: x => Math.max(0.0004, 0.01 * Math.abs(x)), iv: x => Math.max(0.0004, 0.01 * Math.abs(x)), iF: x => Math.max(0.0004, 0.02 * Math.abs(x)), f: x => 0.015 * Math.abs(x), F: x => 0.025 * Math.abs(x) };\nconst calcKeys = e => COLS[e].filter(c => !c.r).map(c => c.k);\nfunction expected(sub, r) {\n  if (sub.e === 2) { const u = num(r.I1) - num(r.L2), v = num(r.I2) - num(r.L2); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (v - u) }; }\n  if (sub.e === 3) { const u = num(r.L) - num(r.O), v = num(r.S) - num(r.L); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (u + v) }; }\n  const f1 = num(sub.res.f1), d = num(r.L2) - num(r.L1), bfl = num(r.S) - num(r.L2), iF = (1 - d / f1) / bfl; return { d, bfl, iF, F: 1 / iF };\n}\nfunction rowVals(sub, r) { const ex = expected(sub, r), o = {}; calcKeys(sub.e).forEach(k => { o[k] = isFinite(num(r[k])) ? num(r[k]) : ex[k]; }); return o; }\n\nconst SRC = {\n  2: [['Judging the sharpest image twice (for I\u2081 and for I\u2082), so the two errors add up', 1], ['Index error: the pointers are not exactly under the lens centres', 1], ['The concave lens was too far from I\u2081, so the final image was faint and hard to focus', 1], ['The thickness of the lenses (the formulas are for thin lenses)', 1], ['A concave lens changes the colour of the light and so changes f', 0], ['The warm room lamp changed the focal length of the lens', 0]],\n  3: [['Judging the sharpest image position by eye', 1], ['Index error of the carrier pointers', 1], ['The two lenses were not exactly in contact, so a small gap changed F', 1], ['The f\u2081 and f\u2082 you compare with carry their own errors from earlier experiments', 1], ['The lens pair was heated by the lamp and changed its shape', 0], ['The thickness of the lenses (the formulas are for thin lenses)', 1]],\n  4: [['Judging the sharpest image of a very small image of the distant window', 1], ['d is a difference of two pointer readings, so index errors do not cancel completely', 1], ['BFL is short, so a small reading error is a large fraction of it', 1], ['f\u2081 from Experiment 1 has its own error, and it enters every point of the graph', 1], ['The distant window moved during the experiment', 0], ['The lenses expand when the lamp is on', 0]]\n};\nconst PRE = {\n  2: [['Place the concave lens between the convex lens and I\u2081, closer to I\u2081 than |f|', 1], ['Keep the object and all lens centres at the same height on one axis', 1], ['Do not move the object or the convex lens between phase 1 and phase 2', 1], ['Put the concave lens before the convex lens', 0], ['Focus slowly and judge the sharpest image from both sides', 1], ['Wipe the lens with a wet cloth before each reading', 0]],\n  3: [['Press the two lenses firmly together in one holder', 1], ['Keep the object and the lens centres on one axis', 1], ['Take object distances greater than 1.5 F', 1], ['Take the readings only for a single object distance', 0], ['Use a small aperture, or cover the edge of the lenses', 1], ['Wipe the lenses with a wet cloth before every reading', 0]],\n  4: [['Make sure the window really is far away (so the beam is nearly parallel)', 1], ['Keep both lenses on the same axis', 1], ['Do not let the carriers touch each other', 1], ['Take d larger than f\u2081 + f\u2082 every time', 0], ['Focus the image slowly and judge from both sides', 1], ['Move the lamp closer to heat the lenses evenly', 0]]\n};\n\n/* ---------- Step 1: aim, set-up ---------- */\nconst INFO = {\n  2: {\n    title: 'Experiment 2: focal length of a concave lens (auxiliary lens method)',\n    body: sub => `<div class=\"card\"><h3>Aim<\/h3><p>To determine the focal length of a concave lens using an auxiliary convex lens.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers \u00b7 illuminated cross-wire \u00b7 an auxiliary convex lens \u00b7 the concave lens \u00b7 screen \u00b7 graph paper.<\/p>\n      <div class=\"row\"><label class=\"fld\">Concave lens<select disabled><option>Lens ${sub.id}<\/option><\/select><\/label>\n      <label class=\"fld\">Auxiliary convex lens<select id=\"aux\"><option value=\"A\">Lens A<\/option><option value=\"B\">Lens B<\/option><option value=\"C\">Lens C<\/option><\/select><\/label><\/div><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>A concave lens alone gives only a virtual image. So we let a convex lens form a real image I\u2081 on the screen first. Then we place the concave lens between the convex lens and I\u2081. The rays are now heading for I\u2081, so I\u2081 is a <b>virtual object<\/b> for the concave lens, at distance <i>u<\/i> = I\u2081 \u2212 L\u2082. The concave lens moves the image farther to I\u2082, at <i>v<\/i> = I\u2082 \u2212 L\u2082.<\/p>\n      <p class=\"eq\">1/v \u2212 1/u = 1/f &nbsp;\u21d2&nbsp; |f| = uv/(v \u2212 u)<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">With u positive (virtual object) and v positive (real image), f comes out negative for a concave lens. We quote its magnitude |f|. A real final image forms only if u is smaller than |f|, so the concave lens must be placed close to I\u2081.<\/p>\n      <p>The graph of 1/v against 1/u is a straight line of slope +1. It cuts the x-axis at 1/|f|.<\/p><\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>With the concave lens out of the beam, focus the image I\u2081 of the object on the screen. Note O, L\u2081 and I\u2081.<\/li><li>Put the concave lens in, between the convex lens and I\u2081. Move the screen to focus again to get I\u2082. Note L\u2082 and I\u2082.<\/li><li>Repeat for at least five different positions.<\/li><li>Calculate u, v and |f|, plot the graph and find |f| from it.<\/li><\/ol><\/div>`,\n    readIntro: `<p>Each reading has two phases. In phase 1 the concave lens is <b>out<\/b> of the beam and you find the image I\u2081. In phase 2 you switch the concave lens <b>in<\/b>, place it before I\u2081, and refocus to find I\u2082. Do not move the object or the convex lens between the two phases.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and |f| for every row. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and |f| to 2 decimal places.'\n  },\n  3: {\n    title: 'Experiment 3: two thin lenses in contact',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To determine the equivalent focal length of two thin lenses in contact and to verify <span class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers \u00b7 illuminated cross-wire \u00b7 Lens ${a} (${typeOf(a)}) and Lens ${b} (${typeOf(b)}) mounted together in one holder \u00b7 screen \u00b7 graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>Two thin lenses in contact act as one thin lens. The light from the object meets the first lens, and the image it would form is the object for the second. Adding the two lens equations gives<\/p>\n      <p class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082, &nbsp; P = P\u2081 + P\u2082<\/p>\n      <p>Here f is positive for a convex lens and negative for a concave lens. We measure F by the u\u2013v method, with distances taken from the lens pair, and compare it with the value from the f\u2081 and f\u2082 you found earlier.<\/p><\/div>\n      <div class=\"note\">Use your own earlier results for f\u2081 and f\u2082: Experiment 1 for the convex lenses and Experiment 2 for the concave lenses. If you did not measure a lens yet, the result page will tell you.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Fix the lens pair on its carrier. Place the object beyond 1.5 F (estimate F from f\u2081 and f\u2082).<\/li><li>Focus the image on the screen and read the three pointers. Repeat for five object distances.<\/li><li>Fill the table and calculate F for each reading.<\/li><li>Plot 1/v against 1/u, read the intercepts and find F.<\/li><li>Compare with 1/F = 1/f\u2081 + 1/f\u2082.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The two lenses sit together on the lens carrier. Put the object far enough away (more than about 1.5 F) and focus the image on the screen. Read the three pointers and record. Take at least five readings with different object distances.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and F for each row, as in Experiment 1. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and F to 2 decimal places.'\n  },\n  4: {\n    title: 'Experiment 4: two thin lenses separated by a distance',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To study how the equivalent focal length F of two thin lenses depends on their separation d, and to verify <span class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082)<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and two lens carriers \u00b7 Lens ${a} (${typeOf(a)}) as lens 1 and Lens ${b} (${typeOf(b)}) as lens 2 \u00b7 screen \u00b7 a far-away window as the object \u00b7 graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>For a distant object the light is almost parallel. It focuses at the back focal length BFL behind lens 2. For two thin lenses separated by d,<\/p>\n      <p class=\"eq\">BFL = F (1 \u2212 d/f\u2081) &nbsp;&nbsp; so &nbsp;&nbsp; 1/F = (1 \u2212 d/f\u2081) / BFL<\/p>\n      <p>and the formula to verify is <span class=\"eq\">1/F = (1/f\u2081 + 1/f\u2082) \u2212 d/(f\u2081f\u2082)<\/span>. So a graph of 1/F against d is a straight line. Its intercept (at d = 0) is 1/f\u2081 + 1/f\u2082, and its slope is \u22121/(f\u2081f\u2082). From the slope you can find f\u2082.<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">F is measured from the principal planes, not from lens 2. That is why we measure BFL and then convert.<\/p><\/div>\n      <div class=\"note\">You need f\u2081 (the lens 1 value you measured in Experiment 1). The table page asks for it.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Place lens 1 and lens 2 on the rail at a separation d (keep d between about 4 and 12 cm).<\/li><li>Focus the image of the distant window on the screen and read the three pointers.<\/li><li>Repeat for at least five values of d.<\/li><li>Calculate d, BFL, 1/F and F. Plot 1/F against d.<\/li><li>From the slope find f\u2082, and compare with its value from the earlier experiments.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The object is a window far outside the lab, so the light arrives almost parallel. Set lens 1 and lens 2 a few centimetres apart, and focus the image of the window on the screen. Read the three pointers. Take at least five readings with different separations d (about 4 to 12 cm).<\/p>`,\n    tableIntro: 'First enter f\u2081, the focal length of lens 1 that you measured. Then work out d, BFL, 1/F and F for each row. Give d and BFL to 0.1 cm, 1/F to 4 decimal places and F to 2 decimal places.'\n  }\n};\nfunction step1(root, sub) {\n  root.innerHTML = `<h2>${INFO[sub.e].title}<\/h2>` + INFO[sub.e].body(sub);\n  if (sub.e === 2) { const sel = $('#aux', root); sel.value = sub.aux; sel.disabled = sub.rows.length > 0; sel.addEventListener('change', () => { sub.aux = sel.value; save(); }); }\n  nextBtn(root, 'Go to the bench');\n}\n\n/* ---------- Step 2: readings ---------- */\nfunction field(id, label, val) { return `<label class=\"fld\">${label}<input id=\"${id}\" inputmode=\"decimal\" value=\"${val || ''}\"><\/label>`; }\nconst ptrOK = (t, a) => isFinite(t) && Math.abs(t - a) <= 0.06;\nfunction step2(root, sub) {\n  const e = sub.e, p = sub.pos;\n  root.innerHTML = `<h2>Take readings<\/h2>${INFO[e].readIntro}<div id=\"bench\"><\/div><div class=\"card\" id=\"rec\"><\/div>`;\n  mountBench($('#bench', root), sub);\n  const rec = $('#rec', root);\n  const blank = () => Object.fromEntries(calcKeys(e).map(k => [k, '']));\n  const note = html => { $('#rfb', rec).innerHTML = html; };\n  function auto() { return `<label class=\"chk\"><input type=\"checkbox\" id=\"auto\" ${S.auto ? 'checked' : ''}><span>Skip the scale-reading practice: fill the pointer readings for me<\/span><\/label>`; }\n  function hookAuto() { $('#auto', rec).addEventListener('change', ev => { S.auto = ev.target.checked; save(); }); }\n  function val(id, actual) { return S.auto ? actual : num($('#' + id, rec).value); }\n  function addRow(fields, extra) { sub.rows.push(Object.assign({ checked: null }, fields, blank(), extra || {})); save(); refreshNav(); }\n  const count = () => `<p style=\"margin:8px 0 0;font-size:.93rem;color:var(--muted)\">Readings recorded so far: <b>${sub.rows.length}<\/b> of at least 5.<\/p>`;\n\n  function drawRec() {\n    if (e === 3) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rL', 'Lens-pair pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const O = val('rO', p.o), L = val('rL', p.a), Sx = val('rS', p.s);\n        if (![O, L, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(O, p.o) || !ptrOK(L, p.a) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No image can form on the screen with the object this close. Move the object farther away.'));\n        if (sub.rows.some(r => Math.abs(num(r.O) - O) < .05 && Math.abs(num(r.L) - L) < .05 && Math.abs(num(r.S) - Sx) < .05)) return note(T('bad', 'You have already recorded this setting. Change the object distance.'));\n        addRow({ O: String(O), L: String(L), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else if (e === 4) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rA', 'Lens 1 pointer (cm)')}${field('rB', 'Lens 2 pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const A = val('rA', p.a), B = val('rB', p.b), Sx = val('rS', p.s);\n        if (![A, B, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(A, p.a) || !ptrOK(B, p.b) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No real image forms on the screen with this separation. Try a smaller d.'));\n        if (sub.rows.some(r => Math.abs(num(r.L2) - num(r.L1) - (B - A)) < .05)) return note(T('bad', 'You already have a reading with this separation. Change d.'));\n        addRow({ L1: String(A), L2: String(B), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else {\n      const ph = sub.stage.phase;\n      if (ph === 1) {\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 1: concave lens OUT of the beam<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rA', 'Convex lens pointer (cm)')}${field('rI', 'Screen pointer for I\u2081 (cm)')}<button class=\"btn primary\" id=\"lock\" type=\"button\" style=\"align-self:flex-end\">Lock phase 1<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#lock', rec).addEventListener('click', () => {\n          const O = val('rO', p.o), A = val('rA', p.a), I = val('rI', p.s);\n          if (sub.inpath) return note(T('bad', 'Take the concave lens out of the beam first (use the switch above the carriers).'));\n          if (![O, A, I].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n          if (!ptrOK(O, p.o) || !ptrOK(A, p.a) || !ptrOK(I, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub); if (st.virtual) return note(T('bad', 'The convex lens makes no real image with the object this close. Move the object farther away.'));\n          sub.stage = { phase: 2, O, L1: A, I1: I, tO: p.o, tA: p.a, d1: +st.delta.toFixed(2) }; save(); drawRec();\n          note(T('good', 'Phase 1 locked. Now switch the concave lens IN, place it before I\u2081 (closer to I\u2081 than its focal length), and refocus the screen.'));\n        });\n      } else {\n        const g = sub.stage;\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 2: concave lens IN the beam<\/h3><p style=\"margin:0 0 8px;font-size:.95rem\">Locked from phase 1: O = ${g.O}, L\u2081 = ${g.L1}, I\u2081 = ${g.I1}<\/p><div class=\"row\">${field('rB', 'Concave lens pointer (cm)')}${field('rI2', 'Screen pointer for I\u2082 (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\">Add to the observation table<\/button><button class=\"btn\" id=\"redo\" type=\"button\" style=\"align-self:flex-end\">Start phase 1 again<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#redo', rec).addEventListener('click', () => { sub.stage = { phase: 1 }; save(); drawRec(); });\n        $('#add', rec).addEventListener('click', () => {\n          const B = val('rB', p.b), I2 = val('rI2', p.s);\n          if (!sub.inpath) return note(T('bad', 'Switch the concave lens IN the beam first.'));\n          if (Math.abs(p.o - g.tO) > 0.05 || Math.abs(p.a - g.tA) > 0.05) return note(T('bad', 'You moved the object or the convex lens after phase 1. Press \u201cStart phase 1 again\u201d.'));\n          if (![B, I2].every(isFinite)) return note(T('', 'Enter both pointer readings.'));\n          if (!ptrOK(B, p.b) || !ptrOK(I2, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub);\n          if (st.virtual) return note(T('bad', 'No real image forms. The concave lens is too far from I\u2081 (more than its focal length). Move it closer to I\u2081.'));\n          if (g.I1 - B < 0.3) return note(T('bad', 'The concave lens must be placed before I\u2081 (to the left of it), so that I\u2081 is a virtual object for it.'));\n          if (I2 - g.I1 < 0.3) return note(T('bad', 'The new image should be farther away than I\u2081. Refocus the screen.'));\n          addRow({ O: String(g.O), L1: String(g.L1), I1: String(g.I1), L2: String(B), I2: String(I2) }, { dtrue: +Math.max(Math.abs(g.d1), Math.abs(st.delta)).toFixed(2) });\n          sub.stage = { phase: 1 }; save(); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded. For the next one, take the concave lens out of the beam and change the object distance.`));\n        });\n      }\n    }\n  }\n  drawRec(); nextBtn(root, 'Go to the observation table');\n}\n\n/* ---------- Step 3: observation table ---------- */\nfunction step3(root, sub) {\n  const e = sub.e, cols = COLS[e], ck = calcKeys(e);\n  root.innerHTML = `<h2>Observation table<\/h2><p>${INFO[e].tableIntro}<\/p>\n    ${e === 4 ? `<div class=\"row\" style=\"margin-bottom:8px\"><label class=\"fld\">f\u2081 of lens 1 (cm)<input id=\"f1\" inputmode=\"decimal\" value=\"${sub.res.f1 || ''}\"><\/label><button class=\"btn sm\" id=\"use1\" type=\"button\" style=\"align-self:flex-end\">Use my result from Experiment 1<\/button><\/div><div id=\"f1note\"><\/div>` : ''}\n    <div class=\"tw\"><table class=\"ob\"><thead><tr><th>No.<\/th>${cols.map(c => `<th>${c.l}<\/th>`).join('')}<\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" id=\"chk\" type=\"button\">Check my calculations<\/button><button class=\"btn\" id=\"assist\" type=\"button\">Fill the calculated columns for me<\/button><button class=\"btn\" id=\"del\" type=\"button\">Delete the last row<\/button><\/div>\n    <div id=\"tfb\"><\/div><div id=\"mean\" class=\"note\" style=\"margin-top:10px\"><\/div><div id=\"ray\" style=\"margin-top:12px\"><\/div>`;\n  const tb = $('#tb', root), mk = ck[ck.length - 1];\n  const ray = e === 3 ? mountRay($('#ray', root), () => sub.rows) : null;\n  function meanBox() {\n    const arr = sub.rows.map(r => num(r[mk])).filter(isFinite);\n    $('#mean', root).innerHTML = arr.length ? `Mean of the ${e === 4 ? 'F' : e === 3 ? 'F' : '|f|'} values you entered: <b>${fmt(arr.reduce((a, b) => a + b, 0) / arr.length, 2)} cm<\/b> (from ${arr.length} reading${arr.length > 1 ? 's' : ''}).${e === 4 ? ' (For this experiment F changes with d, so the mean is not meaningful. The graph is what matters.)' : ''}` : 'The mean of your values will appear here.';\n  }\n  function drawRows() {\n    tb.innerHTML = sub.rows.length ? sub.rows.map((r, i) => `<tr data-i=\"${i}\"><td>${i + 1}<\/td>${cols.map(c => c.r ? `<td>${r[c.k]}<\/td>` : `<td><input data-k=\"${c.k}\" inputmode=\"decimal\" value=\"${r[c.k]}\" aria-label=\"${c.k} for reading ${i + 1}\"><\/td>`).join('')}<\/tr>`).join('') : `<tr><td colspan=\"${cols.length + 1}\">No readings yet. Go back and take some.<\/td><\/tr>`;\n    $$('input', tb).forEach(inp => inp.addEventListener('input', () => { const r = sub.rows[+inp.closest('tr').dataset.i]; r[inp.dataset.k] = inp.value; r.checked = null; inp.classList.remove('ok', 'bad'); save(); meanBox(); refreshNav(); }));\n    meanBox(); if (ray) ray.refresh();\n  }\n  if (e === 4) {\n    $('#f1', root).addEventListener('input', ev => { sub.res.f1 = ev.target.value; sub.rows.forEach(r => { r.checked = null; }); save(); });\n    $('#use1', root).addEventListener('click', () => { const v = earlierF(pairIds(sub.id)[0]); if (isFinite(v)) { sub.res.f1 = String(v); $('#f1', root).value = v; save(); $('#f1note', root).innerHTML = ''; } else $('#f1note', root).innerHTML = T('', 'I could not find a saved result for that lens from Experiment 1. Type your own value.'); });\n  }\n  $('#chk', root).addEventListener('click', () => {\n    const fb = $('#tfb', root);\n    if (e === 4 && !isFinite(num(sub.res.f1))) { fb.innerHTML = T('bad', 'Enter f\u2081 at the top first.'); return; }\n    let bad = 0, empty = 0; const msgs = [];\n    sub.rows.forEach((r, i) => {\n      const ex = expected(sub, r), tr = tb.children[i], okk = {};\n      ck.forEach(k => { const inp = $(`[data-k=${k}]`, tr); inp.classList.remove('ok', 'bad'); const t = num(r[k]); if (!isFinite(t)) { empty++; inp.classList.add('bad'); return; } okk[k] = Math.abs(t - ex[k]) <= TOLF[k](ex[k]); if (okk[k]) inp.classList.add('ok'); else { bad++; inp.classList.add('bad'); } });\n      r.checked = ck.every(k => okk[k]);\n      if (!r.checked) { const first = ck.find(k => okk[k] === false); if (first) msgs.push(`Row ${i + 1}: check <b>${first}<\/b> again.`); }\n    });\n    save(); refreshNav();\n    if (!sub.rows.length) fb.innerHTML = T('', 'You have no readings yet.');\n    else if (empty) fb.innerHTML = T('', `${empty} box${empty > 1 ? 'es are' : ' is'} still empty. Fill them in, then check again.`);\n    else if (bad) fb.innerHTML = T('bad', msgs.join('<br>') || 'Some entries are wrong.');\n    else fb.innerHTML = T('good', 'All your calculations are correct.');\n  });\n  $('#assist', root).addEventListener('click', () => {\n    if (e === 4 && !isFinite(num(sub.res.f1))) { $('#tfb', root).innerHTML = T('bad', 'Enter f\u2081 at the top first.'); return; }\n    sub.rows.forEach(r => { const ex = expected(sub, r); ck.forEach(k => { r[k] = fmt(ex[k], DIG[k]); }); r.checked = null; }); save(); drawRows(); refreshNav(); $('#tfb', root).innerHTML = T('', 'The columns are filled. Press \u201cCheck my calculations\u201d to mark them as verified.');\n  });\n  $('#del', root).addEventListener('click', () => { sub.rows.pop(); save(); drawRows(); refreshNav(); });\n  drawRows(); nextBtn(root, 'Go to the graph');\n}\n\n/* ---------- Step 4: graph ---------- */\nconst GSPEC = {\n  2: { name: '1/v against 1/u', xh: '1/u (cm\u207b\u00b9)', yh: '1/v (cm\u207b\u00b9)', xsc: [0.005, 0.01, 0.02, 0.05], ysc: [0.005, 0.01, 0.02, 0.05], data: v => [v.iu, v.iv] },\n  3: { name: '1/v against 1/u', xh: '1/u (cm\u207b\u00b9)', yh: '1/v (cm\u207b\u00b9)', xsc: [0.005, 0.01, 0.02, 0.05], ysc: [0.005, 0.01, 0.02, 0.05], data: v => [v.iu, v.iv] },\n  4: { name: '1/F against d', xh: 'd (cm)', yh: '1/F (cm\u207b\u00b9)', xsc: [1, 2, 2.5, 5], ysc: [0.001, 0.002, 0.005, 0.01, 0.02], data: v => [v.d, v.iF] }\n};\nfunction step4(root, sub) {\n  const e = sub.e, sp = GSPEC[e], g = graphOf(sub, 'g');\n  root.innerHTML = `<h2>Graph: ${sp.name}<\/h2><p>Plot on the graph paper by clicking where each point belongs. Choose the scale yourself, label the axes, plot every point, then place the ruler line.<\/p>\n  <div class=\"gcols\"><div><div class=\"paperwrap\"><canvas id=\"paper\" width=\"${PW}\" height=\"${PH}\" aria-label=\"Graph paper\"><\/canvas><\/div><div class=\"cursorout\" id=\"cur\">Mo
