<title>Combination of Lenses: theory and virtual lab</title>
<style>

.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.frames{flex:1 1 auto;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
.hint{font-size:.85rem;color:var(--muted)}
.frames .prog{position:absolute;inset:0;overflow:auto;background:var(--bg)}
.frames .prog[hidden]{display:none}
.prog .in{max-width:900px;margin:0 auto;padding:22px 16px 60px}
.prog h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 6px}
.prog h3{font-family:var(--serif);font-size:1.1rem;margin:22px 0 8px}

.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--ok)}

.prow b{min-width:7.5em}
.chip{font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted)}
.chip.on{border-color:var(--ok);color:var(--ok);font-weight:600}
.prow .go{margin-left:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:4px 12px;cursor:pointer;font:inherit;font-size:.9rem}
.prow .go:hover{border-color:var(--accent)}
@media (max-width:700px){.bar .in{padding:6px 10px}.bar h1{font-size:1rem}.tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:3px}.tabs button{flex:0 0 auto;white-space:nowrap}}
</style>
</head>

    <button type="button" role="tab" data-t="college" aria-selected="false">5. Lab: Combination of Lenses</button>
    <button type="button" role="tab" data-t="exp234" aria-selected="false">6. Labs 2 to 4, extensions</button>
    <button type="button" role="tab" data-t="progress" aria-selected="false">7. My progress</button>
  </nav>
</div></header>
<div class="frames" id="frames"></div>

= 'seg';\n  opts.forEach(([val, label]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.dataset.v = val; b.addEventListener('click', () => { set(val); on(val); }); s.appendChild(b); });\n  function set(v) { $$('button', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); }\n  set(value); parent.appendChild(s); return { set, el: s };\n}\n\n/* ---------- scene frame ---------- */\nlet idx = 0, cur = null, raf = null, T = 0;\nfunction frame(o) {\n  const stage = $('#stage');\n  stage.innerHTML = `<article class=\"scene\"><p class=\"kicker\">Chapter ${idx + 1} of ${scenes.length}<\/p><h2>${o.title}<\/h2><div class=\"narr\">${o.narr}<\/div>\n    <div class=\"cvwrap\" data-r=\"cv\"><\/div><div class=\"ctrls\" data-r=\"ctrls\"><\/div><div class=\"readout\" data-r=\"ro\" aria-live=\"polite\"><\/div>\n    <div class=\"tasks\" data-r=\"tasks\"><\/div><div class=\"found\" data-r=\"found\" aria-live=\"polite\"><\/div>\n    ${o.teaser ? `<p class=\"teaser\"><b>Next question:<\/b> ${o.teaser}<\/p>` : ''}<\/article>`;\n  const f = { cv: $('[data-r=cv]', stage), ctrls: $('[data-r=ctrls]', stage), ro: $('[data-r=ro]', stage), tasks: $('[data-r=tasks]', stage), found: $('[data-r=found]', stage), solved: {} };\n  (o.tasks || []).forEach((t, i) => { const d = document.createElement('div'); d.className = 'task'; d.innerHTML = `<span class=\"tk\">\u25cb<\/span><span><b>Try this:<\/b> ${t.text}<\/span>`; f.tasks.appendChild(d); t.el = d; });\n  f.solve = i => {\n    const t = o.tasks[i]; if (f.solved[i]) return; f.solved[i] = true;\n    t.el.classList.add('ok'); $('.tk', t.el).textContent = '\u2713';\n    const d = document.createElement('div'); d.className = 'f'; d.innerHTML = `<b class=\"t\">${t.foundTitle}<\/b>${t.found}`; f.found.appendChild(d);\n    if (o.tasks.every((_, k) => f.solved[k])) markDone(idx);\n  };\n  if (!o.tasks || !o.tasks.length) markDone(idx);\n  return f;\n}\nconst doneSet = new Set();\nfunction markDone(i) { doneSet.add(i); renderDots(); }\n\n/* ======================================================\n   Chapter 1: light bends\n   ====================================================== */\nfunction ch1() {\n  const f = frame({\n    title: 'How does light bend?',\n    narr: '<p>Light travels in straight lines, until it meets a boundary between two transparent materials. Then its speed changes, and its path bends. This is <b>refraction<\/b>, and everything a lens does comes from it.<\/p><p>Below, a ray goes from air into glass. Change the angle and the glass and watch what the ray does.<\/p>',\n    tasks: [{ text: 'Keep the angle of incidence near 60\u00b0 and find a glass that bends the ray by at least 28\u00b0 (that is, i \u2212 r \u2265 28\u00b0).',\n      foundTitle: 'The glass matters.',\n      found: '<p>A larger refractive index n bends light more. The rule is <span class=\"eq\">sin i = n sin r<\/span> (Snell\u2019s law). Remember that n matters: it comes back in the next chapter, when we shape the glass into a lens.<\/p>' }],\n    teaser: 'Bending depends on the angle at which the ray meets the surface. So what if the surface were <b>curved<\/b>, so that every ray met it at just the right angle?'\n  });\n  const { ctx, dpr } = createCanvas(f.cv, 760, 340);\n  const S = { i: 40, n: 1.5 };\n  const g = document.createElement('div'); g.className = 'grp'; f.ctrls.appendChild(g);\n  slider(f.ctrls, { label: 'Angle of incidence i', min: 0, max: 85, step: 1, value: S.i, unit: '\u00b0', on: v => { S.i = v; draw(); } });\n  slider(f.ctrls, { label: 'Refractive index of the glass n', min: 1, max: 2, step: 0.05, value: S.n, on: v => { S.n = v; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = P.bg; ctx.fillRect(0, 0, 760, 340);\n    ctx.fillStyle = P.a; ctx.globalAlpha = .13; ctx.fillRect(0, 170, 760, 170); ctx.globalAlpha = 1;\n    const Ox = 380, Oy = 170, L = 175, i = S.i * Math.PI / 180, r = Math.asin(Math.sin(i) / S.n);\n    ctx.strokeStyle = P.muted; ctx.lineWidth = 1.2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(Ox, 10); ctx.lineTo(Ox, 330); ctx.stroke(); ctx.setLineDash([]);\n    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, Oy); ctx.lineTo(760, Oy); ctx.stroke();\n    const A = [Ox - L * Math.sin(i), Oy - L * Math.cos(i)], B = [Ox + L * Math.sin(r), Oy + L * Math.cos(r)];\n    ctx.strokeStyle = P.a; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(Ox, Oy); ctx.stroke();\n    ctx.strokeStyle = P.b; ctx.beginPath(); ctx.moveTo(Ox, Oy); ctx.lineTo(B[0], B[1]); ctx.stroke();\n    ctx.globalAlpha = .25; ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(Ox, Oy); ctx.lineTo(Ox + L * Math.sin(i), Oy - L * Math.cos(i)); ctx.stroke(); ctx.globalAlpha = 1;\n    ctx.strokeStyle = P.a; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(Ox, Oy, 50, -Math.PI / 2 - i, -Math.PI / 2, false); ctx.stroke();\n    ctx.strokeStyle = P.b; ctx.beginPath(); ctx.arc(Ox, Oy, 50, Math.PI / 2 - r, Math.PI / 2, false); ctx.stroke();\n    txt(ctx, 'i', Ox - 62 * Math.sin(i / 2) - 4, Oy - 62 * Math.cos(i / 2), P.a, 15, 'center'); txt(ctx, 'r', Ox + 64 * Math.sin(r / 2), Oy + 64 * Math.cos(r / 2) + 6, P.b, 15, 'center');\n    txt(ctx, 'air, n = 1', 14, 28, P.muted, 14); txt(ctx, 'glass, n = ' + S.n.toFixed(2), 14, 330, P.muted, 14); txt(ctx, 'normal', Ox + 8, 24, P.muted, 12);\n    photons(ctx, [A, [Ox, Oy], B], T, P.ink, 90, 40);\n    setRO(`<div>i = <span class=\"hl\">${fmt(S.i, 0)}\u00b0<\/span>, r = <span class=\"hl\">${fmt(r * 180 / Math.PI, 1)}\u00b0<\/span>. The ray bends by <span class=\"hl\">${fmt(S.i - r * 180 / Math.PI, 1)}\u00b0<\/span> towards the normal.<\/div><div>sin i = ${fmt(Math.sin(i), 3)}, n sin r = ${fmt(S.n * Math.sin(r), 3)}<\/div>`);\n    if (Math.abs(S.i - 60) <= 3 && S.i - r * 180 / Math.PI >= 28) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 2: a lens is shaped glass\n   ====================================================== */\nfunction ch2() {\n  const f = frame({\n    title: 'How does a piece of glass aim light?',\n    narr: '<p>Take a thin slab of glass and give both faces a curve of radius R. A ray far from the middle meets the surface at a steeper angle, so it bends more. A ray through the middle meets the glass almost flat and barely bends. The result is the one we want: <b>parallel rays all meet at one point<\/b>, the focus.<\/p><p>Every ray below is traced exactly through the two curved faces with Snell\u2019s law. Change R and n and see what happens to the focal length f.<\/p>',\n    tasks: [{ text: 'Make the lens focus the beam at about 20 cm (between 19 and 21 cm).',\n      foundTitle: 'Curvature and material set f.',\n      found: '<p>A more strongly curved face (smaller R) or a larger n gives a shorter focal length. For two faces with equal curvature, <span class=\"eq\">f = R / 2(n \u2212 1)<\/span>. In general, <span class=\"eq\">1/f = (n \u2212 1)(1/R<sub>1<\/sub> \u2212 1/R<sub>2<\/sub>)<\/span>. One lens, one fixed f. Keep that in mind.<\/p>' }],\n    teaser: 'We now have a lens with focal length f. Where does it put the <b>image<\/b> of an object?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -35, 95, W / 130);\n  const S = { R: 30, n: 1.5 }, hs = [-3, -2, -1, 1, 2, 3];\n  slider(f.ctrls, { label: 'Radius of curvature R', min: 15, max: 50, step: 1, value: S.R, unit: 'cm', on: x => { S.R = x; draw(); } });\n  slider(f.ctrls, { label: 'Refractive index n', min: 1.3, max: 1.9, step: 0.05, value: S.n, on: x => { S.n = x; draw(); } });\n  function draw() {\n    const P = pal(), L = thickLens(S.R, 2); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    const par = L.ray(0.2, S.n, -35, 95), fm = par ? par.xc : null;\n    hs.forEach(h => { const r = L.ray(h, S.n, -35, 95); if (r) { poly(ctx, v, r.pts, P.a, 1.5); photons(ctx, toPx(v, r.pts), T, P.a, 80, 52); } });\n    ctx.restore();\n    ctx.beginPath(); const N = 40;\n    for (let k = 0; k <= N; k++) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C1[0] - Math.sqrt(S.R * S.R - y * y); k ? ctx.lineTo(v.X(x), v.Y(y)) : ctx.moveTo(v.X(x), v.Y(y)); }\n    for (let k = N; k >= 0; k--) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C2[0] + Math.sqrt(S.R * S.R - y * y); ctx.lineTo(v.X(x), v.Y(y)); }\n    ctx.closePath(); ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = P.a; ctx.fill(); ctx.restore(); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke();\n    if (fm !== null && fm > 0 && fm < 95) { dotAt(ctx, v, fm, 0, P.img, 5); txt(ctx, 'focus', v.X(fm), v.Y(0) + 24, P.img, 13, 'center'); seg(ctx, v, 0, -9, fm, -9, P.muted, 1.2); txt(ctx, 'f = ' + fmt(fm) + ' cm', v.X(fm / 2), v.Y(-9) - 6, P.muted, 12, 'center'); }\n    const ft = S.R / (2 * (S.n - 1));\n    setRO(`<div>Measured focal length: <span class=\"hl\">${fm === null ? '\u2014' : fmt(fm) + ' cm'}<\/span><\/div><div>Formula f = R / 2(n \u2212 1) = ${fmt(S.R, 0)} / ${fmt(2 * (S.n - 1), 2)} = ${fmt(ft)} cm (a little different because the lens has some thickness)<\/div>`);\n    if (fm !== null && fm >= 19 && fm <= 21) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 3: one lens and an object\n   ====================================================== */\nfunction ch3() {\n  const f = frame({\n    title: 'What does one lens do to an object?',\n    narr: '<p>Now we treat the lens as a thin lens of focal length <b>f = +20 cm<\/b>, and ask where the image of an object forms. Light leaves the top of the arrow in every direction. Three rays are easy to draw: one parallel to the axis (it passes through F\u2032), one through the centre (it goes straight), and one aimed through F (it leaves parallel).<\/p><p>Drag the object arrow, or use the slider. Watch the image move, flip and change size.<\/p>',\n    tasks: [{ text: 'Place the object so the image is exactly the same size as the object (m = \u22121).',\n      foundTitle: 'The same-size image sits at 2f.',\n      found: '<p>With the object at u = \u221240 cm (twice f), the image is at v = +40 cm. The link between object distance, image distance and focal length is the <b>lens formula<\/b>: <span class=\"eq\">1/v \u2212 1/u = 1/f<\/span>, and the magnification is <span class=\"eq\">m = v/u<\/span>. Here 1/v = 1/20 \u2212 1/40, so v = 40 cm and m = \u22121.<\/p>' }],\n    teaser: 'One lens seems to do everything: it forms images of any size, at any distance. So <b>why would anyone need a second lens<\/b>?'\n  });\n  const W = 760, H = 300, { cv, ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -100, 100, 9), F = 20, h = 4;\n  const S = { d: 60 };\n  const sl = slider(f.ctrls, { label: 'Object distance', min: 5, max: 95, step: 1, value: S.d, unit: 'cm', on: x => { S.d = x; draw(); } });\n  let drag = false; const wx = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W / v.sx + v.xmin; };\n  cv.style.touchAction = matchMedia('(max-width:700px)').matches ? 'auto' : 'pan-y'; cv.style.cursor = 'ew-resize';\n  cv.addEventListener('pointerdown', e => { if (Math.abs(wx(e) + S.d) * v.sx < 40) { drag = true; cv.setPointerCapture(e.pointerId); } });\n  cv.addEventListener('pointermove', e => { if (drag) { S.d = clamp(Math.round(-wx(e)), 5, 95); sl.set(S.d); draw(); } });\n  cv.addEventListener('pointerup', () => { drag = false; }); cv.addEventListener('pointercancel', () => { drag = false; });\n  function draw() {\n    const P = pal(), d = S.d, u = -d, vv = imageDist(u, F), m = isFinite(vv) ? vv / u : Infinity;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    tick(ctx, v, P, -20, 'F'); tick(ctx, v, P, 20, 'F\u2032'); tick(ctx, v, P, -40, '2F'); tick(ctx, v, P, 40, '2F\u2032');\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    const lenses = [{ x: 0, f: F }], rays = [[0, P.a], [-h / d, P.b]]; if (Math.abs(d - F) > .05) rays.push([-h / (d - F), P.c]);\n    rays.forEach(([s, col]) => { const t = trace(-d, h, s, lenses, 100); poly(ctx, v, t.pts, col, 1.7); photons(ctx, toPx(v, t.pts), T, col, 80, 56); if (isFinite(vv) && vv < 0) seg(ctx, v, 0, t.pts[1][1], vv, m * h, col, 1.2, [5, 4]); });\n    vArrow(ctx, v, -d, h, P.ink, null, 'object', true);\n    if (isFinite(vv) && Math.abs(vv) < 120 && Math.abs(m * h) * 9 < H / 2 - 4) vArrow(ctx, v, vv, m * h, P.img, vv < 0 ? [5, 4] : null, 'image', m * h > 0);\n    ctx.restore(); lensSym(ctx, v, P, 0, true, 125, 'f = +20 cm');\n    setRO(isFinite(vv)\n      ? `<div>u = <span class=\"hl\">${fmt(u, 0)}<\/span> cm, v = <span class=\"hl\">${sgn(vv)}<\/span> cm, m = <span class=\"hl\">${sgn(m, 2)}<\/span><\/div><div>The image is ${vv > 0 ? 'real' : 'virtual'}, ${m < 0 ? 'inverted' : 'erect'} and ${Math.abs(m) > 1.03 ? 'magnified' : Math.abs(m) < .97 ? 'smaller' : 'the same size'}.<\/div>`\n      : `<div>The object is at F, so the rays leave parallel and the image is at infinity.<\/div>`);\n    if (isFinite(m) && Math.abs(m + 1) <= 0.06) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 4: one lens is not enough\n   ====================================================== */\nfunction ch4() {\n  const f = frame({\n    title: 'Is one lens enough?',\n    narr: '<p>The three-ray picture is an idealisation: it assumes rays close to the axis. A real lens is a piece of glass with real curved faces, and wide beams misbehave.<\/p><p>Here every ray is traced exactly through a thick glass lens (n = 1.5, R = 30 cm). Make the beam wider.<\/p>',\n    tasks: [{ text: 'Widen the beam until the outer rays cross the axis more than 5 cm closer to the lens than the central rays.',\n      foundTitle: 'One lens has no single focus for a wide beam.',\n      found: '<p>This is <b>spherical aberration<\/b>: rays far from the axis are bent too strongly. A second effect, <b>chromatic aberration<\/b>, comes from the glass bending blue light more than red. And a single lens has only <b>one fixed focal length<\/b> and cannot give a very large magnification in a short length.<\/p><p>A second lens (convex and concave together, of different glasses) can cancel these errors, and it lets us change the effective focal length. But first we must learn how two lenses work together.<\/p>' }],\n    teaser: 'How does light behave when it meets a <b>second lens<\/b> after the first?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -55, 75, W / 130), L = thickLens(30, 6);\n  const S = { hm: 3 };\n  slider(f.ctrls, { label: 'Widest ray height', min: 2, max: 12, step: 1, value: S.hm, unit: 'cm', on: x => { S.hm = x; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    for (let h = -S.hm; h <= S.hm + 1e-9; h += 1) { const r = L.ray(h === 0 ? 0 : h, 1.5, -55, 75); if (r) { poly(ctx, v, r.pts, P.a, 1.4); if (h % 2 === 0) photons(ctx, toPx(v, r.pts), T, P.a, 80, 60); } }\n    ctx.restore();\n    ctx.beginPath(); const N = 40;\n    for (let k = 0; k <= N; k++) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C1[0] - Math.sqrt(900 - y * y); k ? ctx.lineTo(v.X(x), v.Y(y)) : ctx.moveTo(v.X(x), v.Y(y)); }\n    for (let k = N; k >= 0; k--) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C2[0] + Math.sqrt(900 - y * y); ctx.lineTo(v.X(x), v.Y(y)); }\n    ctx.closePath(); ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = P.a; ctx.fill(); ctx.restore(); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke();\n    const par = L.ray(0.4, 1.5, -55, 75).xc, mg = L.ray(S.hm, 1.5, -55, 75), gap = mg ? par - mg.xc : 0;\n    dotAt(ctx, v, par, 0, P.img, 5); txt(ctx, 'central rays', v.X(par), v.Y(0) + 26, P.img, 12, 'center');\n    if (S.hm >= 3 && mg) { dotAt(ctx, v, mg.xc, 0, P.c, 5); txt(ctx, 'outer rays', v.X(mg.xc), v.Y(0) - 12, P.c, 12, 'center'); }\n    setRO(`<div>Central rays meet at x = <span class=\"hl\">${fmt(par)}<\/span> cm. The outer rays (${S.hm} cm from the axis) cross the axis at x = <span class=\"hl\">${mg ? fmt(mg.xc) : '\u2014'}<\/span> cm. Gap: <span class=\"hl\">${fmt(gap)} cm<\/span>.<\/div>`);\n    if (gap > 5) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 5: the chain\n   ====================================================== */\nfunction ch5() {\n  const f = frame({\n    title: 'What happens when light meets a second lens?',\n    narr: '<p>Light does not know about \u201cimages\u201d. It just keeps travelling. So we handle two lenses in two steps:<\/p><p><b>Step 1.<\/b> Ignore L<sub>2<\/sub> and find the image I<sub>1<\/sub> made by L<sub>1<\/sub>.<br><b>Step 2.<\/b> Treat I<sub>1<\/sub> as the <i>object<\/i> for L<sub>2<\/sub> and find the final image I<sub>2<\/sub>.<\/p><p>Press the step buttons to see it happen. L<sub>1<\/sub> has f<sub>1<\/sub> = +20 cm and the object is 60 cm in front of it.<\/p>',\n    tasks: [{ text: 'In step 2, slide L\u2082 closer to L\u2081 than the image I\u2081 (so that d is less than v\u2081).',\n      foundTitle: 'A virtual object.',\n      found: '<p>L<sub>2<\/sub> now catches the rays <i>before<\/i> they meet, so I<sub>1<\/sub> lies behind L<sub>2<\/sub>. It is a <b>virtual object<\/b> and its distance u<sub>2<\/sub> = v<sub>1<\/sub> \u2212 d is positive. The lens formula still works with that sign. The total magnification is <span class=\"eq\">m = m<sub>1<\/sub> \u00d7 m<sub>2<\/sub><\/span>.<\/p>' }],\n    teaser: 'The sums are messy when the lenses are far apart. What if the lenses <b>touch<\/b>? Does it get simpler?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -75, 175, 10), F1 = 20, U = 60, h = 2;\n  const S = { step: 1, d: 60, f2: 30 };\n  const grp = document.createElement('span'); grp.className = 'grp'; f.ctrls.appendChild(grp);\n  const stepSeg = segment(grp, [['1', 'Step 1: L\u2081 alone'], ['2', 'Step 2: add L\u2082']], '1', val => { S.step = +val; draw(); });\n  slider(f.ctrls, { label: 'Position of L\u2082 (d)', min: 5, max: 100, step: 1, value: S.d, unit: 'cm', on: x => { S.d = x; if (S.step === 1) { S.step = 2; stepSeg.set('2'); } draw(); } });\n  slider(f.ctrls, { label: 'f\u2082 of L\u2082', min: 15, max: 60, step: 5, value: S.f2, unit: 'cm', on: x => { S.f2 = x; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    const two = S.step === 2, lenses = two ? [{ x: 0, f: F1 }, { x: S.d, f: S.f2 }] : [{ x: 0, f: F1 }];\n    const tA = trace(-U, h, 0, lenses, 175), tB = trace(-U, h, -h / U, lenses, 175);\n    const v1 = imageDist(-U, F1), m1 = v1 / -U, u2 = v1 - S.d;\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    [[tA, P.a], [tB, P.b]].forEach(([t, c]) => { poly(ctx, v, t.pts, c, 1.7); photons(ctx, toPx(v, t.pts), T, c, 80, 56); });\n    vArrow(ctx, v, -U, h, P.ink, null, 'object', true);\n    let v2 = NaN, m2 = NaN;\n    if (!two) vArrow(ctx, v, v1, m1 * h, P.img, null, 'I\u2081', false);\n    else {\n      vArrow(ctx, v, v1, m1 * h, P.muted, [5, 4], 'I\u2081 = object for L\u2082', false);\n      const sA = tA.exit.s, sB = tB.exit.s;\n      if (Math.abs(sA - sB) > 1e-9) {\n        const xi = (tB.exit.y - tA.exit.y + sA * tA.exit.x - sB * tB.exit.x) / (sA - sB), yi = tA.exit.y + sA * (xi - tA.exit.x);\n        const real = xi >= S.d - 1e-6; if (!real) { seg(ctx, v, S.d, tA.exit.y, xi, yi, P.a, 1.2, [5, 4]); seg(ctx, v, S.d, tB.exit.y, xi, yi, P.b, 1.2, [5, 4]); }\n        if (xi > v.xmin && xi < v.xmax && Math.abs(yi) * 10 < H / 2) vArrow(ctx, v, xi, yi, P.img, real ? null : [5, 4], 'I\u2082', yi > 0);\n      }\n      v2 = imageDist(u2, S.f2); m2 = isFinite(v2) ? v2 / u2 : NaN;\n    }\n    ctx.restore();\n    lensSym(ctx, v, P, 0, true, 120, 'L\u2081', 0, .55); if (two) lensSym(ctx, v, P, S.d, true, 120, 'L\u2082', 0, .55);\n    let html = `<div><span class=\"hl\">Step 1.<\/span> u\u2081 = \u221260 cm, v\u2081 = ${sgn(v1)} cm, m\u2081 = ${sgn(m1, 2)}. I\u2081 is real and inverted.<\/div>`;\n    if (two) {\n      html += `<div><span class=\"hl\">Step 2.<\/span> u\u2082 = v\u2081 \u2212 d = ${sgn(u2)} cm: ${u2 < 0 ? 'a real object' : 'a virtual object'}. ` + (isFinite(v2) && isFinite(m2) ? `v\u2082 = ${sgn(v2)} cm, m\u2082 = ${sgn(m2, 2)}.<\/div><div>Total magnification m = m\u2081 \u00d7 m\u2082 = <span class=\"hl\">${sgn(m1 * m2, 2)}<\/span>. The final image is ${v2 > 0 ? 'real' : 'virtual'}, ${m1 * m2 < 0 ? 'inverted' : 'erect'}.<\/div>` : 'L\u2082 sends the light out parallel.<\/div>');\n    } else html += '<div>Now press \u201cStep 2: add L\u2082\u201d, or move L\u2082.<\/div>';\n    setRO(html);\n    if (two && S.d < v1 - 0.5) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Beam bench (chapters 6, 7, 8)\n   ====================================================== */\nfunction beamBench(f, cfg) {\n  const W = 760, H = 300, XMIN = -50, XMAX = 190, YB = 4;\n  const { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, XMIN, XMAX, 10);\n  const S = Object.assign({ t1: 'convex', m1: 20, t2: 'convex', m2: 30, d: 0 }, cfg.state);\n  const ctl = {};\n  if (cfg.types) {\n    const g1 = document.createElement('span'); g1.className = 'grp'; g1.innerHTML = '<b>L<sub>1<\/sub><\/b>'; f.ctrls.appendChild(g1);\n    ctl.s1 = segment(g1, [['convex', 'Convex'], ['concave', 'Concave']], S.t1, val => { S.t1 = val; draw(); });\n  }\n  if (cfg.f1) ctl.f1 = slider(f.ctrls, { label: '|f<sub>1<\/sub>|', min: 10, max: 60, step: 5, value: S.m1, unit: 'cm', aria: 'Focal length of lens 1', on: x => { S.m1 = x; draw(); } });\n  if (cfg.types) {\n    const g2 = document.createElement('span'); g2.className = 'grp'; g2.innerHTML = '<b>L<sub>2<\/sub><\/b>'; f.ctrls.appendChild(g2);\n    ctl.s2 = segment(g2, [['convex', 'Convex'], ['concave', 'Concave']], S.t2, val => { S.t2 = val; draw(); });\n  }\n  if (cfg.f2) ctl.f2 = slider(f.ctrls, { label: '|f<sub>2<\/sub>|', min: 10, max: 60, step: 5, value: S.m2, unit: 'cm', aria: 'Focal length of lens 2', on: x => { S.m2 = x; draw(); } });\n  if (cfg.d) ctl.d = slider(f.ctrls, { label: 'Separation d', min: 0, max: 120, step: 1, value: S.d, unit: 'cm', on: x => { S.d = x; draw(); } });\n  let chart = null;\n  if (cfg.chart) { const host = document.createElement('div'); host.className = 'cvwrap'; host.style.marginTop = '10px'; f.cv.parentNode.insertBefore(host, f.ctrls.nextSibling); chart = createCanvas(host, 760, 190); }\n\n  function geom() {\n    const f1 = S.t1 === 'convex' ? S.m1 : -S.m1, f2 = S.t2 === 'convex' ? S.m2 : -S.m2, d = S.d, lenses = [{ x: 0, f: f1 }, { x: d, f: f2 }];\n    const t1 = trace(XMIN, YB, 0, lenses, XMAX), t2 = trace(XMIN, -YB, 0, lenses, XMAX), e = t1.exit;\n    let xf = null, xH = null, Fm = null;\n    if (Math.abs(e.s) > 1e-9) { xf = e.x - e.y / e.s; xH = e.x + (YB - e.y) / e.s; Fm = xf - xH; }\n    return { f1, f2, d, t1, t2, e, xf, xH, F: Fm, slope: e.s };\n  }\n  function drawChart(g) {\n    if (!chart) return; const c = chart.ctx, P = pal(); c.setTransform(chart.dpr, 0, 0, chart.dpr, 0, 0);\n    c.fillStyle = P.bg; c.fillRect(0, 0, 760, 190);\n    const px0 = 56, px1 = 730, py0 = 20, py1 = 150, pw = px1 - px0, ph = py1 - py0, f1 = g.f1, f2 = g.f2;\n    const pw_ = d => { const t = trace(XMIN, YB, 0, [{ x: 0, f: f1 }, { x: d, f: f2 }], XMAX); return -t.exit.s / YB; };\n    const pts = []; let lo = 1e9, hi = -1e9; for (let d = 0; d <= 120; d += 2) { const p = pw_(d); pts.push([d, p]); lo = Math.min(lo, p); hi = Math.max(hi, p); }\n    lo = Math.min(lo, 0) - 0.005; hi = Math.max(hi, 0) + 0.005;\n    const X = d => px0 + d / 120 * pw, Y = p => py1 - (p - lo) / (hi - lo) * ph;\n    c.strokeStyle = P.grid; c.lineWidth = 1; c.beginPath(); for (let d = 0; d <= 120; d += 20) { c.moveTo(X(d), py0); c.lineTo(X(d), py1); } c.stroke();\n    c.strokeStyle = P.muted; c.lineWidth = 1.2; c.beginPath(); c.moveTo(px0, Y(0)); c.lineTo(px1, Y(0)); c.stroke();\n    c.strokeStyle = P.a; c.lineWidth = 2.4; c.beginPath(); pts.forEach((p, i) => { i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])); }); c.stroke();\n    const pc = pw_(g.d); c.fillStyle = P.img; c.beginPath(); c.arc(X(g.d), Y(pc), 6, 0, 6.3); c.fill();\n    c.fillStyle = P.ink; c.font = '12px system-ui, sans-serif'; c.textAlign = 'center'; for (let d = 0; d <= 120; d += 20) c.fillText(d + '', X(d), py1 + 16);\n    c.fillText('separation d (cm)', (px0 + px1) / 2, py1 + 34); c.textAlign = 'left'; c.fillStyle = P.muted; c.fillText('1/F  (1 per cm)', 6, 14);\n    c.textAlign = 'right'; c.fillText('0', px0 - 6, Y(0) + 4);\n  }\n  function draw() {\n    const g = geom(), P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    tick(ctx, v, P, -Math.abs(g.f1), 'F\u2081', true); tick(ctx, v, P, Math.abs(g.f1), 'F\u2081\u2032', true); tick(ctx, v, P, g.d - Math.abs(g.f2), 'F\u2082', false); tick(ctx, v, P, g.d + Math.abs(g.f2), 'F\u2082\u2032', false);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    [[g.t1, P.a], [g.t2, P.b]].forEach(([t, c]) => { poly(ctx, v, t.pts, c, 1.8); photons(ctx, toPx(v, t.pts), T, c, 80, 52); });\n    if (g.xf !== null) {\n      const real = g.xf >= g.d - 1e-6;\n      if (!real) { seg(ctx, v, g.d, g.e.y, g.xf, 0, P.a, 1.2, [5, 4]); seg(ctx, v, g.d, g.t2.exit.y, g.xf, 0, P.b, 1.2, [5, 4]); }\n      if (g.xf > XMIN && g.xf < XMAX) { dotAt(ctx, v, g.xf, 0, P.img, 5); txt(ctx, real ? 'focus' : 'virtual focus', v.X(g.xf), v.Y(0) + 34, P.img, 13, 'center'); }\n      if (cfg.showH) {\n        if (g.xH < g.d - 1e-6) seg(ctx, v, g.d, g.e.y, g.xH, YB, P.a, 1.1, [2, 3]);\n        seg(ctx, v, g.xH, -12, g.xH, 12, P.muted, 1.4, [4, 4]); txt(ctx, 'H\u2032', v.X(g.xH), v.Y(12) - 6, P.muted, 13, 'center');\n        seg(ctx, v, g.xH, -10, g.xf, -10, P.muted, 1.3); txt(ctx, 'F = ' + fmt(g.F) + ' cm', v.X((g.xH + g.xf) / 2), v.Y(-10) - 6, P.muted, 12, 'center');\n      }\n    } else txt(ctx, 'The beam leaves parallel', W - 14, 22, P.muted, 13, 'right');\n    ctx.restore();\n    if (g.d < 0.5) { lensSym(ctx, v, P, 0, g.f1 > 0, 110, 'L\u2081', -9, .55); lensSym(ctx, v, P, 0, g.f2 > 0, 110, 'L\u2082', 9, .55); }\n    else { lensSym(ctx, v, P, 0, g.f1 > 0, 110, 'L\u2081', 0, .55); lensSym(ctx, v, P, g.d, g.f2 > 0, 110, 'L\u2082', 0, .55); }\n    txt(ctx, 'parallel beam from a far-away object \u2192', 14, H - 10, P.muted, 12);\n    drawChart(g);\n    let html;\n    if (g.xf === null) html = `<div>The beam leaves <span class=\"hl\">parallel<\/span>. Its width changes by a factor of <span class=\"hl\">${fmt(Math.abs(g.e.y / YB), 2)}<\/span>.<\/div>`;\n    else html = `<div>Measured from the rays: <span class=\"hl\">F = ${sgn(g.F)} cm<\/span> (from H\u2032), back focal length ${sgn(g.xf - g.d)} cm from L\u2082. The pair is ${g.F > 0 ? 'converging' : 'diverging'}.<\/div>`;\n    if (cfg.powers) { const p1 = 100 / g.f1, p2 = 100 / g.f2; html += `<div>Powers: P\u2081 = ${sgn(p1, 2)} D, P\u2082 = ${sgn(p2, 2)} D, P\u2081 + P\u2082 = ${sgn(p1 + p2, 2)} D. Measured 1/F = ${g.F === null ? '0' : sgn(100 / g.F, 2)} D.<\/div>`; }\n    setRO(html);\n    cfg.onUpdate && cfg.onUpdate(g, S);\n  }\n  return { draw };\n}\n\nfunction ch6() {\n  const f = frame({\n    title: 'What if the two lenses touch?',\n    narr: '<p>Put two lenses in contact and send in a beam of parallel light, as if from a very distant object. The beam focuses at some point, and the distance from the lenses to that point is the focal length F of the <b>pair<\/b>. The diagram measures F directly from the rays. It does not use any formula.<\/p><p>Change the two lenses and compare the numbers. The panel also lists each lens\u2019s <b>power<\/b>, P = 1/f, in dioptres (f in metres).<\/p>',\n    tasks: [{ text: 'Choose the two lenses so that the pair focuses the beam at exactly 10 cm (F between 9.2 and 10.8 cm).',\n      foundTitle: 'Powers add.',\n      found: '<p>Two +20 cm lenses (P = +5 D each) give a pair with F = 10 cm (P = +10 D). In general, for lenses in contact, <span class=\"eq\">P = P<sub>1<\/sub> + P<sub>2<\/sub><\/span>, which means <span class=\"eq\">1/F = 1/f<sub>1<\/sub> + 1/f<sub>2<\/sub><\/span>. A concave lens has negative power, so it subtracts.<\/p>' }],\n    teaser: 'Touching lenses just add their powers. What happens if we <b>pull them apart<\/b>?'\n  });\n  const bb = beamBench(f, { types: true, f1: true, f2: true, d: false, powers: true, state: { m1: 20, m2: 30, d: 0 },\n    onUpdate: g => { if (g.d < 0.5 && g.F !== null && g.F >= 9.2 && g.F <= 10.8) f.solve(0); } });\n  return { draw: bb.draw };\n}\n\nfunction ch7() {\n  const f = frame({\n    title: 'What if we pull them apart?',\n    narr: '<p>Keep two convex lenses, f<sub>1<\/sub> = +20 cm and f<sub>2<\/sub> = +30 cm, and slide L<sub>2<\/sub> away. The focal length of the pair is measured from the rays, from the dotted plane H\u2032 (the <b>principal plane<\/b> where the incoming ray and the outgoing ray, extended, cross).<\/p><p>The chart below plots 1/F, the strength of the pair, against the separation d. The orange dot shows where you are now.<\/p>',\n    tasks: [{ text: 'Find the separation d at which the pair\u2019s focal length is 15 cm (between 14.4 and 15.6).',\n      foundTitle: 'The strength falls in a straight line as d grows.',\n      found: '<p>At d = 10 cm, F = 15 cm. The line on the chart has a simple rule: <span class=\"eq\">1/F = 1/f<sub>1<\/sub> + 1/f<sub>2<\/sub> \u2212 d/(f<sub>1<\/sub>f<sub>2<\/sub>)<\/span>. At d = 0 it reduces to the contact rule. Changing d changes F, which is exactly how a zoom lens changes its focal length.<\/p>' }],\n    teaser: 'Look at the chart: the line crosses <b>zero<\/b> at some d. What does a pair with no strength do to light?'\n  });\n  const bb = beamBench(f, { types: false, f1: false, f2: false, d: true, showH: true, chart: true, state: { t1: 'convex', m1: 20, t2: 'convex', m2: 30, d: 0 },\n    onUpdate: g => { if (g.F !== null && g.F >= 14.4 && g.F <= 15.6) f.solve(0); } });\n  return { draw: bb.draw };\n}\n\nfunction ch8() {\n  const f = frame({\n    title: 'Are there special distances?',\n    narr: '<p>Yes. The chart in the last chapter crossed zero. Where the strength of the pair is zero, F is infinite: a parallel beam goes in and a <b>parallel beam comes out<\/b>. Two ways to reach it are below. Play with all the controls.<\/p>',\n    tasks: [\n      { text: 'Make the beam leave parallel while the lenses are apart (d bigger than 1 cm). Try two convex lenses first.',\n        foundTitle: 'The afocal pair.',\n        found: '<p>For two convex lenses, the beam leaves parallel when <span class=\"eq\">d = f<sub>1<\/sub> + f<sub>2<\/sub><\/span>: L<sub>1<\/sub>\u2019s focus coincides with L<sub>2<\/sub>\u2019s focus. The beam\u2019s width changes by the ratio f<sub>2<\/sub>/f<sub>1<\/sub>. This is the astronomical telescope and the laser beam expander. With a concave L<sub>2<\/sub>, the same idea with d = f<sub>1<\/sub> \u2212 |f<sub>2<\/sub>| gives the Galilean telescope.<\/p>' },\n      { text: 'Make the two lenses cancel each other: touching (d = 0), a convex and a concave lens of the same |f|, so the beam passes unbent.',\n        foundTitle: 'Opposite lenses cancel.',\n        found: '<p>With P<sub>1<\/sub> = +P and P<sub>2<\/sub> = \u2212P, the powers add to zero: <span class=\"eq\">P = P<sub>1<\/sub> + P<sub>2<\/sub> = 0<\/span>. The pair is like a plain sheet of glass. Real combinations use partial cancellation: a convex and a concave lens of different glasses together cancel colour errors (the achromatic doublet) while the pair still converges.<\/p>' }\n    ],\n    teaser: 'You now have every piece. Let\u2019s <b>put the whole story together<\/b>.'\n  });\n  const bb = beamBench(f, { types: true, f1: true, f2: true, d: true, showH: true, powers: true, state: { t1: 'convex', m1: 30, t2: 'convex', m2: 20, d: 20 },\n    onUpdate: (g, S) => {\n      if (g.d > 1 && Math.abs(g.slope) < 0.004) f.solve(0);\n      if (g.d < 0.5 && S.t1 !== S.t2 && Math.abs(g.slope) < 0.004) f.solve(1);\n    } });\n  return { draw: bb.draw };\n}\n\n/* ======================================================\n   Chapter 9: recap\n   ====================================================== */\nfunction ch9() {\n  const f = frame({\n    title: 'The whole story in one page',\n    narr: '<p>Here is the thread from start to finish. Each line is something you saw yourself. Tap a line to go back to that chapter.<\/p>'\n  });\n  const items = [\n    ['Light bends when it enters glass.', 'sin i = n sin r. A larger n bends more.', 0],\n    ['Curved glass aims the bending: a lens.', '1/f = (n \u2212 1)(1/R\u2081 \u2212 1/R\u2082)', 1],\n    ['One lens forms an image.', '1/v \u2212 1/u = 1/f, m = v/u', 2],\n    ['One lens is not enough.', 'Aberrations; one fixed f; limited magnification.', 3],\n    ['Two lenses form a chain.', 'I\u2081 is the object for L\u2082, and m = m\u2081 \u00d7 m\u2082.', 4],\n    ['Lenses in contact: powers add.', 'P = P\u2081 + P\u2082, so 1/F = 1/f\u2081 + 1/f\u2082', 5],\n    ['Pull them apart: F changes with d.', '1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082)', 6],\n    ['Special distances.', 'd = f\u2081 + f\u2082 gives an afocal pair; opposite lenses can cancel.', 7]\n  ];\n  const box = document.createElement('div'); box.className = 'recap';\n  items.forEach(([a, b, k]) => { const bt = document.createElement('button'); bt.type = 'button'; bt.innerHTML = `<b>${k + 1}. ${a}<\/b><span>${b}<\/span>`; bt.addEventListener('click', () => go(k)); box.appendChild(bt); });\n  f.found.appendChild(box);\n  const p = document.createElement('p'); p.innerHTML = '<b>What comes next:<\/b> in the lab you will measure the focal length of a lens combination yourself, and compare it with these formulas.'; f.found.appendChild(p);\n  const lab = document.createElement('button'); lab.type = 'button'; lab.className = 'btn primary'; lab.textContent = 'Go to the lab: Experiment 1'; lab.style.marginRight = '10px'; lab.addEventListener('click', () => parent.postMessage({ go: 'exp1' }, '*')); f.found.appendChild(lab);\n  const r = document.createElement('button'); r.type = 'button'; r.className = 'btn'; r.textContent = 'Start the story again'; r.addEventListener('click', () => go(0)); f.found.appendChild(r);\n  return { draw() {} };\n}\n\n/* ======================================================\n   Navigation\n   ====================================================== */\nconst scenes = [ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8, ch9];\nfunction renderDots() {\n  $('#dots').innerHTML = scenes.map((_, i) => `<button type=\"button\" data-i=\"${i}\" class=\"${doneSet.has(i) && i !== idx ? 'done' : ''}\" ${i === idx ? 'aria-current=\"step\"' : ''} aria-label=\"Chapter ${i + 1}\">${i + 1}<\/button>`).join('');\n  $$('#dots button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));\n}\nfunction go(i) {\n  idx = clamp(i, 0, scenes.length - 1); cur = scenes[idx]();\n  $('#back').disabled = idx === 0; $('#next').textContent = idx === scenes.length - 1 ? 'Back to the start' : 'Next chapter'; $('#next').dataset.last = idx === scenes.length - 1;\n  renderDots(); cur.draw(); window.scrollTo(0, 0);\n}\n$('#back').addEventListener('click', () => go(idx - 1));\n$('#next').addEventListener('click', () => go(idx === scenes.length - 1 ? 0 : idx + 1));\ndocument.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });\nfunction loop(ts) { T = ts / 1000; if (cur) cur.draw(); raf = requestAnimationFrame(loop); }\nif (!reduce) raf = requestAnimationFrame(loop);\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cur && cur.draw());\ngo(0);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "method": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Which method, and when?<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16213A; --muted:#55627C; --line:#D2DAE6; --soft:#E9EFFA;\n  --accent:#1F5FD6; --ok:#12805C; --okbg:#E2F4EB; --warn:#8A5A00; --warnbg:#FFF3D6;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0E1424; --surface:#151F36; --ink:#E8EDF8; --muted:#A5B2CB; --line:#2C3A58; --soft:#1B2B4D; --accent:#7BA9FF; --ok:#4FCF98; --okbg:#12332A; --warn:#F5C451; --warnbg:#3A3015; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.7rem,4.5vw,2.4rem)} h2{font-size:1.5rem;margin-top:1.8em} h3{font-size:1.1rem;margin-top:1.1em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\n.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}\n.lead{color:var(--muted);font-size:1.08rem;max-width:62ch}\n.goals{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}\n.goals button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}\n.goals button[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.goals button[aria-pressed=\"true\"]{color:#0E1424}}\n.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px}\n.card.rec{border-color:var(--ok);box-shadow:0 0 0 2px var(--okbg)}\n.card h3{margin:0 0 4px;font-size:1.08rem}\n.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 9px;margin-right:6px;color:var(--muted)}\n.tag.ok{border-color:var(--ok);color:var(--ok);font-weight:650}\n.card dl{margin:8px 0 10px;font-size:.93rem}\n.card dt{font-weight:650;margin-top:5px}\n.card dd{margin:0;color:var(--muted)}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);color:var(--ink)}\n.go{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 12px;cursor:pointer;font-size:.9rem}\n.go:hover{border-color:var(--accent)}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;font-size:.92rem;width:100%;min-width:760px;background:var(--surface)}\nth,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}\nth{background:var(--soft)}\n.note{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\nul{max-width:72ch;padding-left:1.3em}\nli{margin-bottom:.4em}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n  <h1>Which method, and when?<\/h1>\n  <p class=\"lead\">Every experiment in this lab finds a focal length, but each uses a different method. The best choice depends on <b>what<\/b> you want to find and <b>which error<\/b> you most want to avoid. Pick your goal below.<\/p>\n\n  <h2 style=\"margin-top:1em\">1. Pick what you want to find<\/h2>\n  <div class=\"goals\" id=\"goals\" role=\"group\" aria-label=\"What do you want to find?\"><\/div>\n  <div class=\"cards\" id=\"cards\" aria-live=\"polite\"><\/div>\n\n  <h2>2. All the methods compared<\/h2>\n  <p>\u201cMain error\u201d says where the method is weakest. \u201cAccuracy\u201d is a rough guide for a bench of this kind: the order matters more than any single number.<\/p>\n  <div class=\"tw\"><table id=\"cmp\"><\/table><\/div>\n\n  <h2>3. Two sign conventions, one law<\/h2>\n  <p>The theory story uses the Cartesian convention. The labs use \u201creal distances are positive\u201d. They describe the same physics. Keep to one inside a single problem.<\/p>\n  <div class=\"tw\"><table>\n    <tr><th><\/th><th>Real distances positive (the labs)<\/th><th>Cartesian (the theory story)<\/th><\/tr>\n    <tr><td>Lens formula<\/td><td class=\"eq\">1/f = 1/u + 1/v<\/td><td class=\"eq\">1/v \u2212 1/u = 1/f<\/td><\/tr>\n    <tr><td>Object distance<\/td><td>u is positive for a real object<\/td><td>u is negative for a real object<\/td><\/tr>\n    <tr><td>Image distance<\/td><td>v is positive for a real image<\/td><td>v is positive for a real image<\/td><\/tr>\n    <tr><td>Convex lens f<\/td><td>positive<\/td><td>positive<\/td><\/tr>\n    <tr><td>Concave lens f<\/td><td>negative<\/td><td>negative<\/td><\/tr>\n    <tr><td>Magnification<\/td><td class=\"eq\">m = I/O (the size, positive)<\/td><td class=\"eq\">m = v/u (negative if inverted)<\/td><\/tr>\n    <tr><td>Two lenses separated by d<\/td><td class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082)<\/td><td class=\"eq\">1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082)<\/td><\/tr>\n  <\/table><\/div>\n\n  <h2>4. Common claims, corrected<\/h2>\n  <ul>\n    <li><b>\u201cThe displacement method is error-free.\u201d<\/b> No method is. The displacement method removes the error from the position of the lens pointer (it cancels in d), but you still judge two sharp images, and D still carries the pointer errors of the object and the screen.<\/li>\n    <li><b>\u201cCombination of lenses is a separate method.\u201d<\/b> It is a <i>set-up<\/i>, not a method. You can apply the u\u2013v, displacement, magnification or distant-object method to a pair of lenses. What changes is the theory behind it.<\/li>\n    <li><b>\u201cI can measure u and v from the lenses for any lens system.\u201d<\/b> For two lenses in contact, this is a good approximation. For lenses separated by d, u and v belong to the <i>principal planes<\/i>, which lie a few centimetres away from the lenses. Measuring from the lenses gives a systematic error. The <b>method of magnification<\/b> avoids it: the slope gives F, and the intercepts tell you where the planes are.<\/li>\n    <li><b>\u201cA graph removes all errors.\u201d<\/b> A graph averages out <i>random<\/i> scatter and shows a bad point at once. It cannot remove a <i>systematic<\/i> error such as an index error.<\/li>\n    <li><b>\u201cThe formula needs a thin lens.\u201d<\/b> Yes, and that is another reason to prefer methods that find F directly (like the magnification method) when the lens is thick.<\/li>\n    <li><b>\u201cPlane-mirror and u\u2013v give the same f.\u201d<\/b> They should agree within experimental error, but they have different weak points. The plane-mirror method needs a no-parallax judgement, and it can mislead you with a <b>false position<\/b> (when the pin is where its image falls on the mirror). Always move the mirror a little to check.<\/li>\n  <\/ul>\n  <div class=\"note\">There are more than six methods. This lab covers nine set-ups: the distant object, u\u2013v, its graphs, displacement, plane mirror, auxiliary lens, lenses in contact, lenses separated (BFL), and the method of magnification.<\/div>\n<\/main>\n\n<script>\n(() => {\n'use strict';\nconst METHODS = {\n  dist:  { n: 'Distant object (rough f)', how: 'Focus a far-away object on a screen. The image forms about one focal length behind the lens.', f: 'f \u2248 lens-to-screen distance', m: 'Lens and screen positions', e: 'The object is not at infinity; judging the sharpest image. Good for \u00b110%.', a: 'Rough', tab: 'exp1', lab: 'Experiment 1, step 2' },\n  uv:    { n: 'u\u2013v method', how: 'Fix the lens. Place the object at several distances, focus the image on the screen, and read u and v.', f: '1/f = 1/u + 1/v', m: 'u and v (three pointers)', e: 'Judging the sharpest image once per reading; the lens pointer index error enters both u and v.', a: 'Fair', tab: 'exp1', lab: 'Experiment 1' },\n  uvg:   { n: 'Graphical forms of u\u2013v', how: 'Plot v against u (the curve cuts v = u at 2f) or 1/v against 1/u (a straight line with intercepts 1/f).', f: 'Intercept = 1/f; u = v = 2f', m: 'The same readings as u\u2013v', e: 'Averages out random scatter; cannot remove a systematic error.', a: 'Better than a single reading', tab: 'exp1', lab: 'Experiment 1, graphs' },\n  disp:  { n: 'Displacement method', how: 'Fix the object and the screen D apart (D greater than 4f). Find the two lens positions that give a sharp image, d apart.', f: 'f = (D\u00b2 \u2212 d\u00b2)/4D', m: 'D and d', e: 'Two sharp-image judgements per reading. The lens-pointer index error cancels in d.', a: 'Good', tab: 'exp1b', lab: 'Experiment 1B' },\n  mirror:{ n: 'Plane-mirror (auto-collimation) method', how: 'Put a plane mirror behind the lens. Move the pin until its image sits on it with no parallax. Check by moving the mirror.', f: 'f = pin-to-lens distance', m: 'Pin and lens pointers', e: 'Parallax judgement; the false position when the image falls on the mirror.', a: 'Good, and quick', tab: 'exp1b', lab: 'Experiment 1B' },\n  aux:   { n: 'Auxiliary-lens method (concave lens)', how: 'A convex lens makes a real image I\u2081. A concave lens placed before I\u2081 moves the image to I\u2082. I\u2081 is a virtual object for the concave lens.', f: '|f| = uv/(v \u2212 u)', m: 'I\u2081, I\u2082 and the concave-lens position', e: 'Two focusing judgements; the concave lens must be closer to I\u2081 than |f|.', a: 'Fair', tab: 'exp234', lab: 'Experiment 2' },\n  contact:{ n: 'Two lenses in contact', how: 'Treat the pair as one thin lens and use u\u2013v (or its graph).', f: '1/F = 1/f\u2081 + 1/f\u2082, P = P\u2081 + P\u2082', m: 'u and v from the pair', e: 'The lenses are not exactly in contact; the f\u2081 and f\u2082 you compare with have errors.', a: 'Fair', tab: 'exp234', lab: 'Experiment 3' },\n  bfl:   { n: 'Separated lenses: distant object and BFL', how: 'Measure the back focal length BFL for several d, then convert it to F.', f: '1/F = (1 \u2212 d/f\u2081)/BFL', m: 'd and BFL', e: 'BFL is short, so a small error is a big fraction; f\u2081 enters every point.', a: 'Fair', tab: 'exp234', lab: 'Experiment 4' },\n  mag:   { n: 'Method of magnification (college method)', how: 'Fix d. Measure u, v and the image size I at several object distances. Plot v against (1 + m) and u against (1 + 1/m).', f: 'Slope = F; intercepts \u03b2, \u03b1 give the principal planes', m: 'u, v, I (and O)', e: 'Measuring the image size to about 1 mm. Needs f\u2081 and f\u2082 only for comparison.', a: 'Good, and it finds the planes too', tab: 'college', lab: 'Combination of Lenses' }\n};\nconst GOALS = [\n  { k: 'convex', t: 'Focal length of a convex lens', why: 'Three good routes. Pick by what you care about.', list: [['mirror', 'Quickest'], ['uvg', 'Standard'], ['disp', 'Most reliable']] },\n  { k: 'concave', t: 'Focal length of a concave lens', why: 'A concave lens alone gives only a virtual image, so you need help from a convex lens.', list: [['aux', 'The practical way']] },\n  { k: 'contact', t: 'F of two lenses in contact', why: 'Treat the pair as one thin lens.', list: [['contact', 'Simplest'], ['uvg', 'With a graph']] },\n  { k: 'sep', t: 'F of two lenses separated by d', why: 'The principal planes matter here. The method of magnification finds F and the planes together.', list: [['mag', 'Best: finds F and the planes'], ['bfl', 'Shows how F changes with d']] },\n  { k: 'mag', t: 'How magnification behaves', why: 'Magnification is size of image divided by size of object. Plot it against the distances.', list: [['mag', 'The magnification method']] },\n  { k: 'rough', t: 'A rough value, quickly', why: 'Use it to decide where to place the object before the careful measurement.', list: [['dist', 'The first step']] }\n];\nconst CMP = ['dist', 'uv', 'uvg', 'disp', 'mirror', 'aux', 'contact', 'bfl', 'mag'];\nconst go = t => parent.postMessage({ go: t }, '*');\nconst goals = document.getElementById('goals'), cards = document.getElementById('cards');\nfunction show(k) {\n  const g = GOALS.find(x => x.k === k);\n  Array.prototype.forEach.call(goals.children, b => b.setAttribute('aria-pressed', b.dataset.k === k));\n  cards.innerHTML = '<div style=\"grid-column:1/-1;max-width:70ch;margin-bottom:2px\"><b>' + g.t + '.<\/b> ' + g.why + '<\/div>' + g.list.map(([id, tag], i) => {\n    const m = METHODS[id];\n    return '<div class=\"card' + (i === 0 && g.list.length > 1 ? '' : '') + '\"><span class=\"tag ok\">' + tag + '<\/span><h3>' + m.n + '<\/h3><dl><dt>How<\/dt><dd>' + m.how + '<\/dd><dt>Formula<\/dt><dd class=\"eq\">' + m.f + '<\/dd><dt>You measure<\/dt><dd>' + m.m + '<\/dd><dt>Main weakness<\/dt><dd>' + m.e + '<\/dd><\/dl><button class=\"go\" type=\"button\" data-go=\"' + m.tab + '\">Try it: ' + m.lab + '<\/button><\/div>';\n  }).join('');\n  Array.prototype.forEach.call(cards.querySelectorAll('.go'), b => b.addEventListener('click', () => go(b.dataset.go)));\n}\nGOALS.forEach(g => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = g.k; b.textContent = g.t; b.addEventListener('click', () => show(g.k)); goals.appendChild(b); });\ndocument.getElementById('cmp').innerHTML = '<tr><th>Method<\/th><th>What it finds<\/th><th>Key formula<\/th><th>Main error<\/th><th>Accuracy<\/th><th>In this lab<\/th><\/tr>' + CMP.map(id => { const m = METHODS[id]; return '<tr><td><b>' + m.n + '<\/b><\/td><td>' + m.how.split('.')[0] + '.<\/td><td class=\"eq\">' + m.f + '<\/td><td>' + m.e + '<\/td><td>' + m.a + '<\/td><td><button class=\"go\" type=\"button\" data-go=\"' + m.tab + '\">' + m.lab + '<\/button><\/td><\/tr>'; }).join('');\nArray.prototype.forEach.call(document.querySelectorAll('#cmp .go'), b => b.addEventListener('click', () => go(b.dataset.go)));\nshow('sep');\n})();\n<\/script>\n<\/body>\n<\/html>\n", "exp1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: Experiment 1, focal length of a convex lens<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16213A; --muted:#55627C; --line:#D2DAE6; --soft:#E9EFFA;\n  --accent:#1F5FD6; --ok:#12805C; --okbg:#E2F4EB; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0E1424; --surface:#151F36; --ink:#E8EDF8; --muted:#A5B2CB; --line:#2C3A58; --soft:#1B2B4D;\n    --accent:#7BA9FF; --ok:#4FCF98; --okbg:#12332A; --bad:#FF8A80; --badbg:#3A1E1B; --warn:#F5C451; --warnbg:#3A3015; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.6rem,4vw,2.3rem)} h2{font-size:1.6rem} h3{font-size:1.15rem;margin-top:1.3em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,input,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\nsub,sup{line-height:0}\n.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}\n.top .in{max-width:1040px;margin:0 auto;padding:8px 16px}\n.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.title{font-family:var(--serif);font-size:1.05rem;font-weight:700}\n.lensTabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.lensTabs button{border:0;background:var(--surface);padding:5px 14px;cursor:pointer}\n.lensTabs button+button{border-left:1px solid var(--line)}\n.lensTabs button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.lensTabs button[aria-pressed=\"true\"],.seg button[aria-pressed=\"true\"]{color:#0E1424}}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}\n.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer}\n.steps button[aria-current=\"step\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.steps button[aria-current=\"step\"]{color:#0E1424}}\n.steps button.done::after{content:\" \u2713\";color:var(--ok)}\n.steps button[aria-current=\"step\"].done::after{color:inherit}\n.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}\n.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.95rem}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.btn.primary{color:#0E1424}}\n.btn.sm{padding:3px 9px;font-size:.85rem}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 14px}\n.card h3{margin-top:0}\n.note{border-left:5px solid var(--accent);background:var(--soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:0 0 12px;max-width:74ch;font-size:.97rem}\n.teacher{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\n.teacher.good{border-color:var(--ok);background:var(--okbg)}\n.teacher.bad{border-color:var(--bad);background:var(--badbg)}\n.teacher b.who{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}\n.hidden{display:none !important}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.12rem}\n\n/* bench */\n.benchwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#e9e4d8,#d8d1c0)}\n.benchwrap canvas{display:block}\n.carriers{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0}\n.car{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem}\n.car b{display:block;margin-bottom:3px}\n.car .b6{display:flex;gap:3px}\n.car .b6 button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:.82rem;font-family:var(--mono)}\n.car .b6 button:hover{border-color:var(--accent)}\n.viewrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:6px 0 14px}\n.zoombox,.screenbox{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}\n.zoombox canvas{display:block;border:1px solid var(--line);border-radius:4px;max-width:100%}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:6px}\n.seg button{border:0;background:var(--bg);font-size:.85rem;padding:4px 11px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n.screen{width:300px;height:220px;border-radius:6px;overflow:hidden;background:#8C9299;position:relative;border:3px solid #444;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}\n.screen canvas{position:absolute;left:0;top:0}\n\n/* tables */\n.tw{overflow-x:auto}\ntable.ob{border-collapse:collapse;font-size:.93rem;min-width:760px}\n.ob th,.ob td{border:1px solid var(--line);padding:4px 6px;text-align:center}\n.ob th{background:var(--soft);font-weight:600}\n.ob input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-family:var(--mono);font-size:.9rem}\n.ob input.ok{border-color:var(--ok);background:var(--okbg)}\n.ob input.bad{border-color:var(--bad);background:var(--badbg)}\n.fld{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}\n.fld input,.fld select{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:150px}\n.fld input.ok{border-color:var(--ok);background:var(--okbg)} .fld input.bad{border-color:var(--bad);background:var(--badbg)}\n.chk{display:flex;gap:9px;align-items:flex-start;margin:4px 0;font-size:.96rem}\n.chk input{margin-top:5px}\n\n/* graph */\n.paperwrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#bbb;padding:8px;display:inline-block;max-width:100%}\n.paperwrap canvas{display:block;background:#FFFDF7;cursor:crosshair;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}\n.gcols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.gcols>div{min-width:0;max-width:100%}\n.paperwrap{display:block}\n.gside{flex:1 1 280px;max-width:420px}\n.cursorout{font-family:var(--mono);font-size:.88rem;color:var(--muted);min-height:1.5em}\n\n/* report */\n.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 26px;max-width:860px}\n.rep h2{font-size:1.4rem;border-bottom:2px solid var(--ink);padding-bottom:4px}\n.rep h3{font-size:1.05rem;margin-top:1.1em}\n.rep table{border-collapse:collapse;font-size:.9rem;margin:6px 0}\n.rep td,.rep th{border:1px solid var(--line);padding:3px 8px;text-align:center}\n.rep img{max-width:100%;height:auto;border:1px solid var(--line);margin:4px 0}\n.cvwrap2 canvas{display:block;width:100%;max-width:700px;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}\n.modal-ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}\n.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.4)}\n.modal p{margin:0 0 14px}\n.paperwrap canvas{width:100%;max-width:510px;height:auto}\n.gcols>div:first-child{flex:1 1 320px;max-width:530px}\n.zoombox canvas{height:auto}\n@media (max-width:700px){.top{position:static}.steps{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.steps button{flex:0 0 auto;white-space:nowrap}.wrap{padding:16px 12px 70px}.row{gap:8px 10px}}\n@media print{\n  .top,.btn,.noprint{display:none !important}\n  body{background:#fff;color:#000} .wrap{padding:0} .rep{border:0;padding:0}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><div class=\"in\">\n  <div class=\"row\">\n    <span class=\"title\">Optics Lab \u00b7 Experiment 1: focal length of a convex lens<\/span>\n    <span class=\"lensTabs\" id=\"lensTabs\" role=\"group\" aria-label=\"Choose the lens\"><\/span>\n    <button class=\"btn sm\" id=\"resetBtn\" type=\"button\">Reset lab<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'exp1b'},'*')\">Other methods (1B)<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'college'},'*')\">Combination of Lenses<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'exp234'},'*')\">Experiments 2 to 4<\/button>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'method'},'*')\">Which method?<\/button>\n  <\/div>\n  <div class=\"steps\" id=\"steps\" aria-label=\"Steps\"><\/div>\n<\/div><\/div>\n<main class=\"wrap\"><div id=\"main\"><\/div><\/main>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst clamp = (x, a, b) => Math.max(a, Math.min(b, x));\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst num = s => { const x = parseFloat(String(s).replace('\u2212', '-').replace(',', '.')); return isFinite(x) ? x : NaN; };\nfunction fmt(n, d = 2) { if (!isFinite(n)) return '\u2014'; let r = Math.round(n * 10 ** d) / 10 ** d; if (Object.is(r, -0)) r = 0; return String(r).replace('-', '\u2212'); }\nfunction rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\n\n/* ======================================================\n   State (hidden true values come from a seed)\n   ====================================================== */\nconst LENSES = [{ id: 'A', nominal: 10 }, { id: 'B', nominal: 15 }, { id: 'C', nominal: 20 }];\nconst KEY = 'optics_lab_exp1_v1';\nconst STEPS = ['Aim and apparatus', 'Rough focal length', 'Take readings', 'Observation table', 'Graphs', 'Result', 'Report'];\nfunction newGraph(kind) { return kind === 1 ? { xs: '', ys: '', xl: '', yl: '', pts: [], curve: false, diag: false, read: '', checked: null, f: '' } : { xs: '', ys: '', xl: '', yl: '', pts: [], line: null, ix: '', iy: '', checked: null, f: '' }; }\nfunction newState() {\n  const seed = (Math.random() * 2 ** 31) | 0, r = rng(seed), lens = {};\n  LENSES.forEach(L => {\n    const o = () => +((r() * 2 - 1) * 0.25).toFixed(2);\n    lens[L.id] = { id: L.id, nominal: L.nominal, f: +(L.nominal * (1 + (r() * 2 - 1) * 0.05)).toFixed(2), off: { o: o(), l: o(), s: o() },\n      pos: { o: 6, l: 30, s: 70 }, rough: { L: '', S: '', f: '', ok: false }, rows: [], g1: newGraph(1), g2: newGraph(2), res: { mean: '', fg1: '', fg2: '', ff: '', err: '', submitted: false, src: [], pre: [] }, viva: {} };\n  });\n  try { const sb = JSON.parse(localStorage.getItem('optics_lab_exp1b_v1')); if (sb && sb.lens) ['A', 'B', 'C'].forEach(id => { if (sb.lens[id]) lens[id].f = sb.lens[id].f; }); } catch (e) { /* none */ }\n  return { v: 1, seed, lens, cur: 'A', step: 1, auto: false };\n}\nfunction load() { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.v === 1) return j; } catch (e) { /* none */ } return null; }\nlet S = load() || newState(), saveT = null;\nfunction save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }, 150); }\nconst LN = () => S.lens[S.cur];\n\n/* ---------- derived physics (hidden from the student) ---------- */\nfunction imageState(lens, mode) {\n  const p = lens.pos, off = lens.off, xl = p.l + off.l, xs = p.s + off.s;\n  let u, v, m;\n  if (mode === 'rough') { u = Infinity; v = lens.f; m = 0.07; }\n  else { u = xl - (p.o + off.o); if (u <= lens.f * 1.002) return { virtual: true, u, delta: 99, sigma: 22, m: 0 }; v = 1 / (1 / lens.f - 1 / u); m = v / u; }\n  const delta = xs - (xl + v), sigma = 0.5 + 6 * Math.abs(delta) * (25 / Math.max(v, 10));\n  return { virtual: false, u, v, m, delta, sigma };\n}\nfunction bestScreenPointer(lens) { const st = imageState(lens, 'full'); return st.virtual ? null : +(lens.pos.l + lens.off.l + st.v - lens.off.s).toFixed(1); }\nfunction rowVals(r) {\n  const O = num(r.O), L = num(r.L), Sx = num(r.S);\n  const u = isFinite(num(r.u)) ? num(r.u) : L - O, v = isFinite(num(r.v)) ? num(r.v) : Sx - L;\n  const iu = isFinite(num(r.iu)) ? num(r.iu) : 1 / u, iv = isFinite(num(r.iv)) ? num(r.iv) : 1 / v;\n  const f = isFinite(num(r.f)) ? num(r.f) : u * v / (u + v);\n  return { u, v, iu, iv, f };\n}\n\n/* ======================================================\n   Optical bench (realistic side view, scale readings, screen view)\n   ====================================================== */\nfunction mountBench(host, mode) {\n  const lens = LN(), rough = mode === 'rough';\n  host.innerHTML = `<div class=\"benchwrap\"><canvas><\/canvas><\/div>\n    <div class=\ L = l.pos.l; Sx = l.pos.s; } else { O = num($('#ro', root).value); L = num($('#rl', root).value); Sx = num($('#rs', root).value); }\n    if (![O, L, Sx].every(isFinite)) { fb.innerHTML = T('', 'Enter all three pointer readings.'); return; }\n    if (Math.abs(O - l.pos.o) > 0.06 || Math.abs(L - l.pos.l) > 0.06 || Math.abs(Sx - l.pos.s) > 0.06) { fb.innerHTML = T('bad', 'One or more of your readings does not match the pointer. Open \u201cRead the scale\u201d for that carrier and read it to the nearest millimetre.'); return; }\n    const st = imageState(l, 'full');\n    if (st.virtual) { fb.innerHTML = T('bad', 'No image can form on the screen with the object this close. Move the object farther from the lens (more than f).'); return; }\n    if (l.rows.some(r => Math.abs(num(r.O) - O) < 0.05 && Math.abs(num(r.L) - L) < 0.05 && Math.abs(num(r.S) - Sx) < 0.05)) { fb.innerHTML = T('bad', 'You have already recorded this setting. Change the object distance for a new reading.'); return; }\n    l.rows.push({ O: String(O), L: String(L), S: String(Sx), u: '', v: '', iu: '', iv: '', f: '', checked: null, dtrue: +st.delta.toFixed(2), utrue: +st.u.toFixed(2) });\n    save(); $('#cnt', root).textContent = l.rows.length; refreshNav();\n    fb.innerHTML = T('good', `Reading ${l.rows.length} recorded. ${l.rows.length < 5 ? 'Now change the object distance and take the next one.' : 'You have enough readings. You can take a few more or go to the observation table.'}`);\n    $('.card h3', $('#rfb', root).parentNode).textContent = 'Record reading ' + (l.rows.length + 1);\n    if (!S.auto) ['ro', 'rl', 'rs'].forEach(id => { $('#' + id, root).value = ''; });\n  });\n  nextBtn(root, 'Go to the observation table');\n}\n\n/* ======================================================\n   Step 4: observation table\n   ====================================================== */\nfunction checkRow(r) {\n  const O = num(r.O), L = num(r.L), Sx = num(r.S), eu = L - O, ev = Sx - L, eiu = 1 / eu, eiv = 1 / ev, ef = eu * ev / (eu + ev), res = {};\n  res.u = Math.abs(num(r.u) - eu) <= 0.06; res.v = Math.abs(num(r.v) - ev) <= 0.06;\n  res.iu = Math.abs(num(r.iu) - eiu) <= Math.max(0.0004, 0.01 * eiu); res.iv = Math.abs(num(r.iv) - eiv) <= Math.max(0.0004, 0.01 * eiv);\n  res.f = Math.abs(num(r.f) - ef) <= 0.012 * ef; return { res, exp: { u: eu, v: ev, iu: eiu, iv: eiv, f: ef } };\n}\nfunction step4(root) {\n  const l = LN();\n  root.innerHTML = `<h2>Observation table: Lens ${l.id}<\/h2>\n  <p>The three pointer readings come from your bench work. Now work out <i>u<\/i>, <i>v<\/i>, <i>1/u<\/i>, <i>1/v<\/i> and <i>f<\/i> for every row yourself. Use 1/f = 1/u + 1/v, so f = uv/(u + v). Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and f to 2 decimal places.<\/p>\n  <div class=\"tw\"><table class=\"ob\"><thead><tr><th>No.<\/th><th>Object<br>reading O (cm)<\/th><th>Lens<br>reading L (cm)<\/th><th>Screen<br>reading S (cm)<\/th><th>u = L \u2212 O<br>(cm)<\/th><th>v = S \u2212 L<br>(cm)<\/th><th>1/u<br>(cm\u207b\u00b9)<\/th><th>1/v<br>(cm\u207b\u00b9)<\/th><th>f = uv/(u+v)<br>(cm)<\/th><th><\/th><\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div>\n  <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" id=\"chk\" type=\"button\">Check my calculations<\/button><button class=\"btn\" id=\"assist\" type=\"button\">Fill the calculated columns for me<\/button>\n    <button class=\"btn\" id=\"del\" type=\"button\">Delete the last row<\/button><\/div>\n  <div id=\"tfb\"><\/div><div id=\"mean\" class=\"note\" style=\"margin-top:10px\"><\/div><div id=\"ray\" style=\"margin-top:12px\"><\/div>`;\n  const tb = $('#tb', root);\n  const ray = mountRay($('#ray', root), () => l.rows);\n  function drawRows() {\n    tb.innerHTML = l.rows.map((r, i) => `<tr data-i=\"${i}\"><td>${i + 1}<\/td><td>${r.O}<\/td><td>${r.L}<\/td><td>${r.S}<\/td>` + ['u', 'v', 'iu', 'iv', 'f'].map(k => `<td><input data-k=\"${k}\" inputmode=\"decimal\" value=\"${r[k]}\" aria-label=\"${k} for reading ${i + 1}\"><\/td>`).join('') + '<td><\/td><\/tr>').join('') || '<tr><td colspan=\"10\">No readings yet. Go back and take some.<\/td><\/tr>';\n    $$('input', tb).forEach(inp => inp.addEventListener('input', () => { const r = l.rows[+inp.closest('tr').dataset.i]; r[inp.dataset.k] = inp.value; r.checked = null; inp.classList.remove('ok', 'bad'); save(); meanBox(); refreshNav(); }));\n    meanBox(); ray.refresh();\n  }\n  function meanBox() {\n    const fs = l.rows.map(r => num(r.f)).filter(isFinite);\n    $('#mean', root).innerHTML = fs.length ? `Mean of the f values you entered: <b>${fmt(fs.reduce((a, b) => a + b, 0) / fs.length, 2)} cm<\/b> (from ${fs.length} reading${fs.length > 1 ? 's' : ''}).` : 'The mean of your f values will appear here.';\n  }\n  $('#chk', root).addEventListener('click', () => {\n    let bad = 0, empty = 0; const msgs = [];\n    l.rows.forEach((r, i) => {\n      const { res, exp } = checkRow(r), tr = tb.children[i];\n      ['u', 'v', 'iu', 'iv', 'f'].forEach(k => { const inp = $(`[data-k=${k}]`, tr); inp.classList.remove('ok', 'bad'); if (!isFinite(num(r[k]))) { empty++; inp.classList.add('bad'); return; } if (res[k]) inp.classList.add('ok'); else { bad++; inp.classList.add('bad'); } });\n      r.checked = ['u', 'v', 'iu', 'iv', 'f'].every(k => res[k]);\n      if (!r.checked) { const first = ['u', 'v', 'iu', 'iv', 'f'].find(k => !res[k] && isFinite(num(r[k]))); if (first) msgs.push(`Row ${i + 1}: check <b>${first === 'iu' ? '1/u' : first === 'iv' ? '1/v' : first}<\/b> again.`); }\n    });\n    save(); refreshNav();\n    const fb = $('#tfb', root);\n    if (!l.rows.length) fb.innerHTML = T('', 'You have no readings yet.');\n    else if (empty) fb.innerHTML = T('', `${empty} box${empty > 1 ? 'es are' : ' is'} still empty. Fill them in, then check again.`);\n    else if (bad) fb.innerHTML = T('bad', msgs.join('<br>') || 'Some entries are wrong.');\n    else fb.innerHTML = T('good', 'All your calculations are correct. Compare the f values = a[1] + (x1 - a[0]) * dy / dx; ctx.moveTo(...P(x0, y0)); ctx.lineTo(...P(x1, y1)); ctx.stroke(); }\n    [a, b].forEach(h => { const q = P(h[0], h[1]); ctx.fillStyle = 'rgba(31,95,214,.2)'; ctx.strokeStyle = '#1F5FD6'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(q[0], q[1], 8, 0, 6.3); ctx.fill(); ctx.stroke(); });\n  }\n  g.pts.forEach((p, i) => { const q = P(p[0], p[1]); ctx.strokeStyle = (opts.flags && opts.flags[i]) ? '#c0392b' : '#1b2a6b'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(q[0] - 4, q[1] - 4); ctx.lineTo(q[0] + 4, q[1] + 4); ctx.moveTo(q[0] + 4, q[1] - 4); ctx.lineTo(q[0] - 4, q[1] + 4); ctx.stroke(); if (opts.flags && opts.flags[i]) { ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, 6.3); ctx.stroke(); } });\n  if (opts.mark) { const q = P(opts.mark[0], opts.mark[1]); ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(q[0], q[1], 7, 0, 6.3); ctx.stroke(); }\n}\nfunction curvePts(pts) {\n  const p = pts.slice().sort((a, b) => a[0] - b[0]), out = [];\n  for (let i = 0; i < p.length - 1; i++) { const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)]; for (let t = 0; t < 1; t += 0.05) { const t2 = t * t, t3 = t2 * t; out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); } }\n  out.push(p[p.length - 1]); return out;\n}\nfunction curveCross(pts) { const c = curvePts(pts); for (let i = 1; i < c.length; i++) { const a = c[i - 1][1] - c[i - 1][0], b = c[i][1] - c[i][0]; if (a === 0) return c[i - 1]; if (a * b < 0) { const t = a / (a - b); return [c[i - 1][0] + t * (c[i][0] - c[i - 1][0]), c[i - 1][1] + t * (c[i][1] - c[i - 1][1])]; } } return null; }\nfunction lsLine(pts) { const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0), sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0), m = (n * sx ysis: Lens ${l.id}<\/h2>\n  <div class=\"card\"><h3>Your values of f<\/h3><div class=\"row\">\n    <label class=\"fld\">Mean f from the table (cm)<input id=\"fm\" inputmode=\"decimal\" value=\"${l.res.mean}\"><\/label>\n    <label class=\"fld\">f from graph 1 (cm)<input id=\"f1\" inputmode=\"decimal\" value=\"${l.res.fg1 || l.g1.f}\"><\/label>\n    <label class=\"fld\">f from graph 2 (cm)<input id=\"f2\" inputmode=\"decimal\" value=\"${l.res.fg2 || l.g2.f}\"><\/label>\n    <label class=\"fld\">Final f (cm)<input id=\"ff\" inputmode=\"decimal\" value=\"${l.res.ff}\"><\/label><\/div>\n    <p style=\"margin:8px 0 0;font-size:.9rem;color:var(--muted)\">Your final value is the one you trust most, or the mean of the three. Use the same precision as your readings.<\/p><\/div>\n  <div id=\"stats\"><\/div><div class=\"card\"><h3>Sources of error: tick the ones that apply to this experiment<\/h3><div id=\"src\"><\/div><\/div>\n  <div class=\"card\"><h3>Precautions: tick the correct ones<\/h3><div id=\"pre\"><\/div><\/div>\n  <button class=\"btn primary\" id=\"sub\" type=\"button\">Submit the result<\/button><div id=\"rfb\"><\/div>`;\n  const mk = (id, arr, key) => { $('#' + id, root).innerHTML = arr.map(([t], i) => `<label class=\"chk\"><input type=\"checkbox\" data-i=\"${i}\" ${l.res[key].includes(i) ? 'checked' : ''}><span>${t}<\/span><\/label>`).join(''); $$('#' + id + ' input', root).forEach(c => c.addEventListener('change', () => { const i = +c.dataset.i, a = l.res[key]; if (c.checked) { if (!a.includes(i)) a.push(i); } else l.res[key] = a.filter(x => x !== i); save(); })); };\n  mk('src', SRC, 'src'); mk('pre', PRE, 'pre');\n  $('#stats', root).innerHTML = statsCard(fs, 'cm', 'f');\n  ['fm', 'f1', 'f2', 'ff'].forEach(id => $('#' + id, root).addEventListener('input', e => { const k = { fm: 'mean', f1: 'fg1', f2: 'fg2', ff: 'ff' }[id]; l.res[k] = e.target.value; save(); }));\n  $('#sub', root).addEventListener('click', () => {\n    const fm = num($('#fm', root).value), f1 = num($('#f1', root).value), f2 = num($('#f2', root).value), ff = num($('#ff', root).value), fb = $('#rfb', root);\n    l.res.mean = $('#fm', root).value; l.res.fg1 = $('#f1', root).value; l.res.fg2 = $('#f2', root).value; l.res.ff = $('#ff', root).value;\n    if (![fm, f1, f2, ff].every(isFinite)) { fb.innerHTML = T('', 'Fill in all four values of f first.'); return; }\n    if (isFinite(mean) && Math.abs(fm - mean) > 0.02 * mean) { fb.innerHTML = T('bad', `The mean of the f values in your table is ${fmt(mean, 2)} cm. Check your average.`); return; }\n    const err = Math.abs(ff - l.f) / l.f * 100; l.res.err = err.toFixed(1); l.res.submitted = true; save(); refreshNav();\n    const ok = l.res.src.filter(i => SRC[i][1]).length, badS = l.res.src.filter(i => !SRC[i][1]).length, okP = l.res.pre.filter(i => PRE[i][1]).length, badP = l.res.pre.filter(i => !PRE[i][1]).length;\n    const worst = l.rows.map((r, i) => [i, Math.abs(r.dtrue)]).filter(p => p[1] > 0.45).map(p => `reading ${p[0] + 1} (screen about ${fmt(p[1], 1)} cm from the best focus)`);\n    let html = `The lab\u2019s accepted value for Lens ${l.id} is <b>${fmt(l.f, 2)} cm<\/b>. Your final value is <b>${fmt(ff, 2)} cm<\/b>, a difference of <b>${fmt(err, 1)}%<\/b>.<br>`;\n    html += err <= 3 ? 'That is an excellent result for this method.' : err <= 6 ? 'That is a good result. The remaining difference is within what this method gives.' : 'The difference is larger than expected. Look at the readings below and at your graphs for the cause.';\n    html += `<br>From the table you got ${fmt(fm, 2)} cm, from graph 1 ${fmt(f1, 2)} cm and from graph 2 ${fmt(f2, 2)} cm.`;\n    if (worst.length) html += `<br>The screen was noticeably out of focus in ${worst.join(', ')}. That is a typical cause of a scattered f.`;\n    html += `<br>Sources of error: you chose ${ok} correct and ${badS} wrong. Precautions: ${okP} correct and ${badP} wrong.`;\n    if (badS || badP) html += ' (Temperature, bright lamps and wet cloths are not the issue here, and averaging does not remove a systematic error.)';\n    html += '<br>One hidden source: every pointer sits a little off its true plane (index error), so u and v are slightly off for everybody. Real labs measure this with a rod of known length.';\n    fb.innerHTML = T(err <= 6 ? 'good' : 'bad', html);\n  });\n  if (l.res.submitted) $('#sub', root).textContent = 'Submit the result again';\n  nextBtn(root, 'Go to the lab report');\n}\n\n/* ======================================================\n   Step 7: report\n   ====================================================== */\nfunction graphImg(l, which) {\n  const g = which === 1 ? l.g1 : l.g2; if (!g.pts.length) return '';\n  const c = document.createElement('canvas'); c.width = PW; c.height = PH; drawPaper(c.getContext('2d'), g, which, {}); return `<img alt=\"Graph ${which}\" src=\"${c.toDataURL('image/png')}\" width=\"${PW}\">`;\n}\nfunction step7(root) {\n  const lensesUsed = LENSES.filter(L => S.lens[L.id].rows.length);\n  if (!lensesUsed.length) { root.innerHTML = '<h2>Lab report<\/h2><p>You have not taken any readings yet. Take readings for at least one lens to see your report.<\/p>'; nextBtn(root); return; }\n  const sec = (l) => {\n    const rows = l.rows.map((r, i) => `<tr><td>${i + 1}<\/td><td>${r.O}<\/td><td>${r.L}<\/td><td>${r.S}<\/td><td>${r.u}<\/td><td>${r.v}<\/td><td>${r.iu}<\/td><td>${r.iv}<\/td><td>${r.f}<\/td><\/tr>`).join('');\n    const fs = l.rows.map(r => num(r.f)).filter(isFinite), mean = fs.length ? fs.reduce((a, b) => a + b, 0) / fs.length : NaN;\n    return `<h3>Lens ${l.id}<\/h3>\n      <p><b>Rough focal length:<\/b> ${l.rough.f ? l.rough.f + ' cm' : 'not measured'}<\/p>\n      <div class=\"tw\"><table><tr><th>No.<\/th><th>O (cm)<\/th><th>L (cm)<\/th><th>S (cm)<\/th><th>u (cm)<\/th><th>v (cm)<\/th><th>1/u (cm\u207b\u00b9)<\/th><th>1/v (cm\u207b\u00b9)<\/th><th>f (cm)<\/th><\/tr>${rows}<\/table><\/div>\n      <p><b>Mean f from the table<\/b> = ${fmt(mean, 2)} cm. <b>From graph
