aved result for Lens ${id}. Type your own value, or finish that experiment first.`); };\n  if ($('#u1', root)) $('#u1', root).addEventListener('click', () => usePrev(ia, 'p1', 'p1'));\n  if ($('#u2', root)) $('#u2', root).addEventListener('click', () => usePrev(e === 4 ? ib : ib, 'p2', 'p2'));\n  $('#sub', root).addEventListener('click', () => {\n    const fb = $('#rfb', root); let html = '', good = true;\n    const sc = SRC[e], pc = PRE[e], sOK = r.src.filter(i => sc[i][1]).length, sBad = r.src.filter(i => !sc[i][1]).length, pOK = r.pre.filter(i => pc[i][1]).length, pBad = r.pre.filter(i => !pc[i][1]).length;\n    const arr = sub.rows.map(q => num(q[mk])).filter(isFinite), mean = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN;\n    if (e === 2) {\n      const fm = num($('#fm', root).value), fg = num($('#fg', root).value), ff = num($('#ff', root).value);\n      r.mean = $('#fm', root).value; r.fg = $('#fg', root).value; r.ff = $('#ff', root).value;\n      if (![fm, fg, ff].every(isFinite)) { fb.innerHTML = T('', 'Fill in all three values first.'); return; }\n      if (isFinite(mean) && Math.abs(fm - mean) > 0.02 * mean) { fb.innerHTML = T('bad', `The mean of the |f| values in your table is ${fmt(mean, 2)} cm. Check your average.`); return; }\n      const tv = trueValue(sub), err = Math.abs(ff - tv) / tv * 100; r.err = err.toFixed(1); good = err <= 8;\n      html = `The accepted value for the concave Lens ${sub.id} is <b>${fmt(tv, 2)} cm<\/b> (magnitude). Your final value is <b>${fmt(ff, 2)} cm<\/b>, a difference of <b>${fmt(err, 1)}%<\/b>.<br>${err <= 4 ? 'That is an excellent result for this method.' : err <= 8 ? 'That is a good result. This method has two focusing steps, so errors add up.' : 'The difference is large. Because two sharp-image judgements go into every reading, look at the readings for which the image was hard to focus.'}<br>From the table ${fmt(fm, 2)} cm and from the graph ${fmt(fg, 2)} cm.`;\n    } else if (e === 3) {\n      const p1 = num($('#p1', root).value), p2 = num($('#p2', root).value), fm = num($('#fm', root).value), fg = num($('#fg', root).value), ff = num($('#ff', root).value);\n      r.p1 = $('#p1', root).value; r.p2 = $('#p2', root).value; r.mean = $('#fm', root).value; r.fg = $('#fg', root).value; r.ff = $('#ff', root).value;\n      if (![p1, p2, fm, fg, ff].every(isFinite)) { fb.innerHTML = T('', 'Fill in f\u2081, f\u2082 and all three values of F first.'); return; }\n      if (typeOf(ia) !== (p1 > 0 ? 'convex' : 'concave') || typeOf(ib) !== (p2 > 0 ? 'convex' : 'concave')) { fb.innerHTML = T('bad', 'Check the signs: f is positive for a convex lens and negative for a concave lens.'); return; }\n      if (isFinite(mean) && Math.abs(fm - mean) > 0.02 * mean) { fb.innerHTML = T('bad', `The mean of the F values in your table is ${fmt(mean, 2)} cm. Check your average.`); return; }\n      const pred = 1 / (1 / p1 + 1 / p2), diff = Math.abs(ff - pred) / Math.abs(pred) * 100, tv = trueValue(sub), err = Math.abs(ff - tv) / tv * 100; r.err = err.toFixed(1); good = diff <= 8;\n      html = `From your own f\u2081 = ${fmt(p1, 2)} cm and f\u2082 = ${fmt(p2, 2)} cm, the formula predicts <b>F = ${fmt(pred, 2)} cm<\/b> (P\u2081 + P\u2082 = ${fmt(100 / p1, 2)} + ${fmt(100 / p2, 2)} = ${fmt(100 / p1 + 100 / p2, 2)} D). You measured <b>${fmt(ff, 2)} cm<\/b>, a difference of <b>${fmt(diff, 1)}%<\/b>.<br>${diff <= 5 ? '1/F = 1/f\u2081 + 1/f\u2082 is verified within experimental error.' : diff <= 8 ? 'The formula holds, within the larger errors of a combined measurement.' : 'The difference is bigger than expected. The errors in f\u2081 and f\u2082 add to the error in F. Check them.'}<br>The accepted value of F for this pair is ${fmt(tv, 2)} cm, so your measurement is ${fmt(err, 1)}% from it.`;\n    } else {\n      const f1 = num(sub.res.f1), f2g = num($('#fm', root).value), f2e = num($('#p2', root).value);\n      r.mean = $('#fm', root).value; r.p2 = $('#p2', root).value;\n      if (![f2g, f2e].every(isFinite)) { fb.innerHTML = T('', 'Fill in both values of f\u2082 first.'); return; }\n      if (typeOf(pairIds(sub.id)[1]) !== (f2g > 0 ? 'convex' : 'concave')) { fb.innerHTML = T('bad', 'Check the sign of f\u2082 from the slope. f\u2082 is positive for a convex lens and negative for a concave lens.'); return; }\n      const tv = trueValue(sub), diff = Math.abs(f2g - f2e) / Math.abs(f2e) * 100, err = Math.abs(f2g - tv) / Math.abs(tv) * 100; r.err = err.toFixed(1); good = diff <= 12;\n      const devs = sub.rows.map(q => { const v = rowVals(sub, q), pr = 1 / f1 + 1 / f2e - v.d / (f1 * f2e); return Math.abs(v.iF - pr) / Math.abs(pr) * 100; }).filter(isFinite), mx = devs.length ? Math.max(...devs) : NaN;\n      html = `From the slope you found f\u2082 = ${fmt(f2g, 2)} cm. From your earlier experiment it is ${fmt(f2e, 2)} cm, a difference of <b>${fmt(diff, 1)}%<\/b>.<br>If you use f\u2081 = ${fmt(f1, 2)} cm and f\u2082 = ${fmt(f2e, 2)} cm in 1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082), no measured point is more than <b>${fmt(mx, 1)}%<\/b> away from the prediction.<br>${mx <= 6 ? 'The formula describes your data well: F changes with d exactly as predicted.' : 'The scatter is larger than expected. BFL is short here, so small focusing errors matter.'}<br>The accepted value of f\u2082 is ${fmt(tv, 2)} cm, so your slope result is ${fmt(err, 1)}% from it.`;\n    }\n    html += `<br>Sources of error: ${sOK} correct and ${sBad} wrong. Precautions: ${pOK} correct and ${pBad} wrong.`;\n    if (sBad || pBad) html += ' (Warm lamps, wet cloths and invented effects are not the issue here.)';\n    r.submitted = true; save(); refreshNav(); fb.innerHTML = T(good ? 'good' : 'bad', html);\n  });\n  nextBtn(root, 'Go to the lab report');\n}\n\n/* ---------- Step 6: report ---------- */\nfunction step6(root, sub) {\n  const e = sub.e;\n  if (!sub.rows.length) { root.innerHTML = '<h2>Lab report<\/h2><p>You have not taken any readings for this setting yet.<\/p>'; nextBtn(root); return; }\n  const cols = COLS[e], g = graphOf(sub, 'g'); let img = '';\n  if (g.pts.length) { const c = document.createElement('canvas'); c.width = PW; c.height = PH; drawPaper(c.getContext('2d'), g, 2, {}); img = `<img alt=\"Graph\" src=\"${c.toDataURL('image/png')}\" width=\"${PW}\">`; }\n  const rows = sub.rows.map((r, i) => `<tr><td>${i + 1}<\/td>${cols.map(c => `<td>${r[c.k]}<\/td>`).join('')}<\/tr>`).join('');\n  const r = sub.res, sc = SRC[e], pc = PRE[e];\n  const aim = { 2: 'To determine the focal length of a concave lens using an auxiliary convex lens.', 3: 'To determine the equivalent focal length of two thin lenses in contact and verify 1/F = 1/f\u2081 + 1/f\u2082.', 4: 'To study how the equivalent focal length of two thin lenses depends on their separation and verify 1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082).' }[e];\n  const th = { 2: '1/v \u2212 1/u = 1/f with u the virtual-object distance (I\u2081 \u2212 L\u2082) and v the final image distance (I\u2082 \u2212 L\u2082); |f| = uv/(v \u2212 u).', 3: '1/F = 1/f\u2081 + 1/f\u2082 for thin lenses in contact; P = P\u2081 + P\u2082.', 4: 'BFL = F(1 \u2212 d/f\u2081) and 1/F = 1/f\u2081 + 1/f\u2082 \u2212 d/(f\u2081f\u2082); the graph of 1/F against d is a straight line with intercept 1/f\u2081 + 1/f\u2082 and slope \u22121/(f\u2081f\u2082).' }[e];\n  const result = e === 2 ? `|f| of the concave Lens ${sub.id} = <b>${r.ff || '\u2014'} cm<\/b>${r.submitted ? ` (${r.err}% from the accepted value)` : ''}` : e === 3 ? `F of the pair ${sub.id.replace('+', ' + ')} = <b>${r.ff || '\u2014'} cm<\/b>; predicted from f\u2081 = ${r.p1 || '\u2014'} cm and f\u2082 = ${r.p2 || '\u2014'} cm` : `f\u2082 from the slope = <b>${r.mean || g.f || '\u2014'} cm<\/b>; from the earlier experiment = ${r.p2 || '\u2014'} cm; f\u2081 = ${r.f1 || '\u2014'} cm`;\n  root.innerHTML = `<div class=\"row noprint\" style=\"margin-bottom:10px\"><button class=\"btn primary\" id=\"prt\" type=\"button\">Print or save as PDF<\/button><button class=\"btn\" id=\"dl\" type=\"button\">Download report as a file<\/button><span id=\"rmsg\" style=\"font-size:.9rem;color:var(--muted)\"><\/span><\/div>\n    <div class=\"rep\"><h2>${INFO[e].title}<\/h2><h3>Aim<\/h3><p>${aim}<\/p><h3>Theory<\/h3><p>${th}<\/p>\n    <h3>Observation table (${e === 2 ? 'Lens ' + sub.id + ', auxiliary Lens ' + sub.aux : sub.id.replace('+', ' + ')})<\/h3><div class=\"tw\"><table><tr><th>No.<\/th>${cols.map(c => `<th>${c.l}<\/th>`).join('')}<\/tr>${rows}<\/table><\/div>\n    <h3>Graph<\/h3><div>${img || '<p>No graph plotted yet.<\/p>'}<\/div><h3>Result<\/h3><p>${result}.<\/p>${e === 4 ? '' : '<p>' + statsLine(sub.rows.map(q => num(q[calcKeys(e)[calcKeys(e).length - 1]])).filter(isFinite), e === 2 ? '|f|' : 'F') + '<\/p>'}\n    <h3>Sources of error<\/h3><p>${r.src.length ? r.src.map(i => sc[i][0]).join('; ') : 'not filled in'}.<\/p><h3>Precautions<\/h3><p>${r.pre.length ? r.pre.map(i => pc[i][0]).join('; ') : 'not filled in'}.<\/p><\/div>`;\n  hookReport(root); nextBtn(root);\n}\nconst STEP_FNS = [null, step1, step2, step3, step4, step5, step6];\n\n\n\n/* ======================================================\n   Shared helpers: confirm dialog, report, ray diagram, error analysis\n   ====================================================== */\nfunction askConfirm(msg, yes, onYes) {\n  const prev = document.activeElement, ov = document.createElement('div'); ov.className = 'modal-ov';\n  ov.innerHTML = '<div class=\"modal\" role=\"alertdialog\" aria-modal=\"true\" aria-label=\"Please confirm\"><p>' + msg + '<\/p><div class=\"row\"><button class=\"btn primary\" type=\"button\" data-y=\"1\">' + yes + '<\/button><button class=\"btn\" type=\"button\" data-y=\"0\">Cancel<\/button><\/div><\/div>';\n  const key = ev => { if (ev.key === 'Escape') close(); };\n  const close = () => { ov.remove(); document.removeEventListener('keydown', key); if (prev && prev.focus) prev.focus(); };\n  ov.addEventListener('click', ev => { if (ev.target === ov) close(); });\n  ov.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const y = b.dataset.y === '1'; close(); if (y) onYes(); }));\n  document.addEventListener('keydown', key); document.body.appendChild(ov); ov.querySelector('[data-y=\"0\"]').focus();\n}\nfunction hookReport(root) {\n  const msg = $('#rmsg', root);\n  $('#prt', root).addEventListener('click', () => { try { window.print(); } catch (e) { msg.textContent = 'Printing is blocked here. Use \"Download report as a file\" and print that file.'; } });\n  $('#dl', root).addEventListener('click', () => {\n    try {\n      const c = $('.rep', root).cloneNode(true), vv = c.querySelector('#viva');\n      if (vv) { if (vv.previousElementSibling) vv.previousElementSibling.remove(); vv.remove(); }\n      const html = '<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Lab report<\/title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:20px auto;padding:0 16px;color:#111;line-height:1.5}table{border-collapse:collapse;font-size:.9rem;margin:6px 0}td,th{border:1px solid #bbb;padding:3px 8px;text-align:center}img{max-width:100%;height:auto;border:1px solid #ccc}h2{border-bottom:2px solid #111;padding-bottom:4px}h3{margin:1.1em 0 .3em}<\/style><\/head><body>' + c.innerHTML + '<\/body><\/html>';\n      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'lens-lab-report.html';\n      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n      msg.textContent = 'Report downloaded.';\n    } catch (e) { msg.textContent = 'Download is blocked here. Open the lab in a normal browser tab.'; }\n  });\n}\nfunction rayUV(r) { const O = num(r.O), L = num(r.L), Sx = num(r.S); return { u: L - O, v: Sx - L }; }\nfunction drawRay(cv, u, v) {\n  const dpr = Math.min(window.devicePixelRatio || 1
