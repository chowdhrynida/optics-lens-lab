\/h2>\n  <p>Look for what the numbers are telling you before you decide on a result. The workbench adds error bars and a weighted fit.<\/p>\n  <div class=\"sysrow\"><span class=\"seg\" id=\"asys\" role=\"group\" aria-label=\"Set-up\">${['X', 'Y', 'XY'].map(k => `<button type=\"button\" data-s=\"${k}\" aria-pressed=\"${k === sys}\">${SYS[k]}<\/button>`).join('')}<\/span>\n    <button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'errors'},'*')\">Open the error workbench<\/button><\/div>\n  <div class=\"card\"><h3>What the readings say: ${SYS[sys]}<\/h3>\n    ${!su && !sd ? '<p style=\"margin:0;color:var(--muted)\">No readings for this set-up yet. Go back to the bench.<\/p>' : ''}\n    ${su ? `<p style=\"margin:0 0 6px\"><b>u–v method<\/b> (${su.n} readings): mean f = <b>${fmt(su.m, 2)} cm<\/b>, scatter ${fmt(su.sd, 2)} cm, standard error ${fmt(su.sem, 2)} cm.${tr ? ` Trend of f with u: <b>${fmt(tr.b, 3)} ± ${fmt(tr.se, 3)} cm per cm<\/b> (${fmt(Math.abs(tr.z), 1)}σ).` : ''}<\/p>` : ''}\n    ${sd ? `<p style=\"margin:0 0 6px\"><b>Displacement method<\/b> (${sd.n} readings): mean f = <b>${fmt(sd.m, 2)} cm<\/b>, scatter ${isFinite(sd.sd) ? fmt(sd.sd, 2) : '—'} cm${isFinite(sd.sem) ? `, standard error ${fmt(sd.sem, 2)} cm` : ''}.<\/p>` : ''}\n    ${su && sd && isFinite(sd.sem) ? `<p style=\"margin:0 0 6px\">Difference between the two methods: <b>${fmt(su.m - sd.m, 2)} cm<\/b>, which is <b>${fmt(Math.abs(su.m - sd.m) / Math.hypot(su.sem || 0, sd.sem), 1)}σ<\/b> of the combined standard error.<\/p>` : ''}\n    <details class=\"how\" style=\"margin-top:8px\"><summary>Show the numbers reading by reading<\/summary><div class=\"tw\"><table class=\"ob\" style=\"min-width:320px;margin-top:8px\"><thead><tr><th>Method<\/th><th>u or D<\/th><th>v or d<\/th><th>f (cm)<\/th><\/tr><\/thead><tbody>${d.uv.map(x => `<tr><td>u–v<\/td><td>${fmt(x.u, 1)}<\/td><td>${fmt(x.v, 1)}<\/td><td>${fmt(x.f, 2)}<\/td><\/tr>`).join('')}${d.dis.map(x => `<tr><td>displ.<\/td><td>${fmt(x.D, 1)}<\/td><td>${fmt(x.d, 1)}<\/td><td>${fmt(x.f, 2)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/details><\/div>\n  <div class=\"card\"><h3>Need a nudge?<\/h3><div class=\"row\"><button class=\"btn sm\" id=\"hint\" type=\"button\" ${S.hints >= 3 ? 'disabled' : ''}>Ask the mentor for a hint (${S.hints} of 3 used)<\/button><\/div><div id=\"hints\">${HINTS.slice(0, S.hints).map((h, i) => T_('', `<b>Hint ${i + 1}.<\/b> ${h}`)).join('')}<\/div><\/div>\n  <div id=\"graphhost\"><\/div>\n  <div class=\"card\"><h3>Your results<\/h3><p style=\"font-size:.93rem;color:var(--muted)\">One value with an uncertainty for each set-up, from the method (or methods) you trust. The uncertainty must include both random scatter and any systematic error you cannot remove.<\/p>\n    ${['X', 'Y', 'XY'].map(k => { const r = S.res[k]; return `<div class=\"row\" style=\"margin:6px 0\" data-r=\"${k}\"><b style=\"min-width:6em\">${SYS[k]}<\/b><label class=\"fld\">Method<select data-k=\"m\"><option value=\"\">—<\/option>${[['uv', 'u–v'], ['dis', 'Displacement'], ['both', 'Both'], ['other', 'Other']].map(([v, t]) => `<option value=\"${v}\" ${r.m === v ? 'selected' : ''}>${t}<\/option>`).join('')}<\/select><\/label><label class=\"fld\">f (cm)<input data-k=\"f\" inputmode=\"decimal\" value=\"${esc(r.f)}\"><\/label><label class=\"fld\">Δf (cm)<input data-k=\"df\" inputmode=\"decimal\" value=\"${esc(r.df)}\"><\/label><\/div>`; }).join('')}<\/div>\n  <div id=\"comb\"><\/div>`;\n  $$('#asys button', root).forEach(b => b.addEventListener('click', () => { S.asys = b.dataset.s; save(); render(); }));\n  $('#hint', root).addEventListener('click', () => { if (S.hints < 3) { S.hints++; save(); render(); } });\n  $$('[data-r]', root).forEach(row => $$('[data-k]', row).forEach(el => el.addEventListener('input', () => { S.res[row.dataset.r][el.dataset.k] = el.value; save(); refreshNav(); comb(); const nb = $('[data-n=\"1\"]', root.lastElementChild); if (nb) nb.disabled = !resOk(); })));\n  function comb() {\n    const el = $('#comb', root), T = TR(); if (!resOk()) { el.innerHTML = ''; return; }\n    const fx = num(S.res.X.f), dx = num(S.res.X.df), fy = num(S.res.Y.f), dy = num(S.res.Y.df), fe = num(S.res.XY.f), de = num(S.res.XY.df), g = T.g, dg = 0.1, Q = fx + fy - g;\n    const pred = fx * fy / Q, dpr = Math.sqrt((fy * (fy - g) / Q ** 2 * dx) ** 2 + (fx * (fx - g) / Q ** 2 * dy) ** 2 + (fx * fy / Q ** 2 * dg) ** 2), z = (fe - pred) / Math.hypot(de, dpr);\n    const shorter = fe < Math.min(fx, fy), P4 = PRED.p4, mine = S.pred.p4;\n    el.innerHTML = `<div class=\"card\"><h3>Does the pair obey the combination formula?<\/h3>\n      <p>From your X and Y results and g = ${fmt(g, 1)} cm: <b>f<sub>eq<\/sub> = f<sub>X<\/sub>f<sub>Y<\/sub>/(f<sub>X<\/sub> + f<sub>Y<\/sub> − g) = ${fmt(pred, 2)} ± ${sig(dpr, 2)} cm<\/b>. You measured <b>${fmt(fe, 2)} ± ${sig(de, 2)} cm<\/b>. The difference is ${fmt(Math.abs(z), 1)}σ.<\/p>\n      ${Math.abs(z) <= 2.5 ? T_('good', 'Your measured value and the formula agree within their uncertainties.') : T_('bad', 'They disagree by more than your errors allow. Either one of the three measurements has a systematic error, or an uncertainty is too small. Which of the three would you re-measure, and by which method?')}\n      <p style=\"margin-top:10px\">Prediction 4: you said f<sub>eq<\/sub> would be <b>${PLAIN[mine]}<\/b>. Your measurement says it is <b>${shorter ? 'shorter than both' : 'not shorter than both'}<\/b>: ${mine === P4.ans && shorter ? 'you were right.' : mine === P4.ans ? 'your prediction was right in principle, so check this measurement.' : 'worth thinking about why.'} ${P4.why}<\/p><\/div>`;\n  }\n  mountGraph($('#graphhost', root));\n  comb(); nextBtn(root, 'Review and submit', resOk(), 'Enter a value and an uncertainty (above zero) for all three set-ups.');\n}\n\n/* ======================================================\n   Step 7: result, marking and reveal\n   ====================================================== */\nfunction noiseFree(sys) {\n  const T = TR(), fRef = sys === 'X' ? T.fX : sys === 'Y' ? T.fY : T.feq, out = {};\n  { const o = 5, l = +(5 + 2.3 * fRef).toFixed(1), st = system(sys, { o, l, s: 0 }); if (st.real) { const s = st.xi - T.oS, u = l - o, v = s - l; if (u > 0 && v > 0) out.uv = u * v / (u + v); } }\n  { const o = 3, s = Math.min(97, 3 + 4.8 * fRef), roots = sharpLensReadings(sys, o, s); if (roots.length >= 2) { const D = s - o, dd = Math.abs(roots[roots.length - 1] - roots[0]); out.dis = (D * D - dd * dd) / (4 * D); } }\n  return out;\n}\nfunction mark() {\n  const T = TR(), items = [], trueF = { X: T.fX, Y: T.fY, XY: T.feq };\n  let acc = 0, real = 0; const lines = [];\n  ['X', 'Y', 'XY'].forEach(k => {\n    const f = num(S.res[k].f), df = num(S.res[k].df), t = trueF[k], err = Math.abs(f - t), rel = err / t, rdf = df / f;\n    const a = rel <= .01 ? 13 : rel <= .02 ? 10 : rel <= .04 ? 7 : rel <= .08 ? 3 : 0, honest = err <= 2.5 * df, sensible = rdf <= .06 && rdf >= .002, r = honest && sensible ? 5 : honest ? 3 : sensible ? 1 : 0;\n    acc += a; real += r; lines.push({ k, f, df, t, err, rel, a, r, honest, sensible });\n  });\n  items.push({ n: 'Accuracy of the three results', p: acc, m: 39 }); items.push({ n: 'Honest, sensible uncertainties', p: real, m: 15 });\n  const both = ['X', 'Y', 'XY'].some(k => S.data[k].uv.length >= 3 && S.data[k].dis.length >= 3), words = /systematic|offset|zero|cancel|principal|centre|center|parallax|index|bias/i.test(S.reflect);\n  items.push({ n: 'Two methods compared, and the comparison understood', p: (both ? 6 : 0) + (words ? 4 : 0), m: 10 });\n  const fx = num(S.res.X.f), fy = num(S.res.Y.f), dx = num(S.res.X.df), dy = num(S.res.Y.df), fe = num(S.res.XY.f), de = num(S.res.XY.df), Q = fx + fy - T.g, pred = fx * fy / Q, dpr = Math.sqrt((fy * (fy - T.g) / Q ** 2 * dx) ** 2 + (fx * (fx - T.g) / Q ** 2 * dy) ** 2 + (fx * fy / Q ** 2 * .1) ** 2), zc = Math.abs(fe - pred) / Math.hypot(de, dpr);\n  items.push({ n: 'Combination formula checked against the pair', p: 5 + (zc <= 2.5 ? 5 : 0), m: 10 });\n  const right = ['p1', 'p2', 'p3', 'p4'].filter(k => S.pred[k] === PRED[k].ans).length;\n  items.push({ n: 'Predict, observe, explain (completed, and predictions right)', p: 3 + 4 + Math.round(right / 4 * 3), m: 10 });\n  items.push({ n: 'Method plan with a reason', p: S.plan.why.trim().length >= 40 ? 5 : 2, m: 5 });\n  const gdone = Object.keys(S.gr || {}).some(k => S.gr[k].ok), gerr = Object.keys(S.gr || {}).some(k => S.gr[k].ok && Object.keys(S.gr[k].err || {}).length >= 3);\n  items.push({ n: 'Hand-plotted graph with steepest and flattest lines', p: (gdone ? 4 : 0) + (gerr ? 2 : 0), m: 6 });\n  items.push({ n: 'Reflection', p: S.reflect.trim().length >= 80 ? 5 : S.reflect.trim().length >= 30 ? 3 : 0, m: 5 });\n  return { total: items.reduce((s, i) => s + i.p, 0), max: items.reduce((s, i) => s + i.m, 0), items, lines, zc, pred, right };\n}\nfunction exportFile() {\n  const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('optics_lab_') === 0) { try { data[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* skip */ } } }\n  const name = (data.optics_lab_student_v1 && data.optics_lab_student_v1.name) || 'student', blob = new Blob([JSON.stringify({ app: 'combination-of-lenses', ver: 2, exported: new Date().toISOString(), name, data }, null, 1)], { type: 'application/json' });\n  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lens-lab-' + name.replace(/[^\\w]+/g, '-').toLowerCase() + '-' + S.kit + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n}\nfunction step7(root) {\n  const T = TR();\n  root.innerHTML = `<h2>${S.submitted ? 'Your result and the answer key' : 'Review and submit'}<\/h2>\n  <div class=\"card\"><h3>Your three results<\/h3><div class=\"tw\"><table class=\"ob\" style=\"min-width:420px\"><thead><tr><th>Set-up<\/th><th>Method<\/th><th>f ± Δf (cm)<\/th><\/tr><\/thead><tbody>${['X', 'Y', 'XY'].map(k => `<tr><td>${SYS[k]}<\/td><td>${({ uv: 'u–v', dis: 'Displacement', both: 'Both', other: 'Other', '': '—' })[S.res[k].m]}<\/td><td>${esc(S.res[k].f)} ± ${esc(S.res[k].df)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/div>\n  <div class=\"card\"><h3>Reflection<\/h3><label class=\"fld\">Which result do you trust most, and why? Which systematic error did you find or suspect, and what did you do about it?<textarea id=\"refl\" ${S.submitted ? 'disabled' : ''} style=\"min-height:110px\">${esc(S.reflect)}<\/textarea><\/label>\n    ${S.submitted ? '' : `<div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" id=\"sub\" type=\"button\" ${S.reflect.trim().length >= 30 ? '' : 'disabled'}>Submit for marking<\/button><span style=\"font-size:.9rem;color:var(--muted)\">At least 30 characters. Submitting reveals the answer key, and cannot be undone.<\/span><\/div>`}<\/div><div id=\"rev\"><\/div>`;\n  const refl = $('#refl', root); if (refl && !S.submitted) refl.addEventListener('input', e => { S.reflect = e.target.value; save(); const b = $('#sub', root); if (b) b.disabled = S.reflect.trim().length < 30; });\n  const sub = $('#sub', root); if (sub) sub.addEventListener('click', () => askConfirm('Submit your results? The answer key will be shown and your answers can no longer be changed.', 'Submit', () => { S.submitted = true; S.score = mark(); S.tEnd = Date.now(); save(); refreshNav(); render(); window.scrollTo(0, 0); }));\n  if (S.submitted) {\n    const m = S.score || mark(); S.score = m; save();\n    const nf = { X: noiseFree('X'), Y: noiseFree('Y'), XY: noiseFree('XY') }, tF = { X: T.fX, Y: T.fY, XY: T.feq };\n    $('#rev', root).innerHTML = `<div class=\"card\"><h3>Score<\/h3><div class=\"score\">${m.total} <span style=\"font-size:1.1rem;color:var(--muted)\">/ ${m.max}<\/span><\/div>\n      <table class=\"rub\" style=\"margin-top:8px\"><thead><tr><th>What was marked<\/th><th>Marks<\/th><\/tr><\/thead><tbody>${m.items.map(i => `<tr><td>${i.n}<\/td><td class=\"n\">${i.p} / ${i.m}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>\n    <div class=\"card\"><h3>The answer key<\/h3><div class=\"tw\"><table class=\"rub\" style=\"min-width:560px\"><thead><tr><th>Set-up<\/th><th>True f (cm)<\/th><th>Your f ± Δf<\/th><th>Off by<\/th><th>Verdict<\/th><\/tr><\/thead><tbody>${m.lines.map(l => `<tr><td>${SYS[l.k]}<\/td><td class=\"n\">${fmt(l.t, 2)}<\/td><td class=\"n\">${fmt(l.f, 2)} ± ${sig(l.df, 2)}<\/td><td class=\"n\">${fmt(l.err, 2)} cm (${fmt(l.rel * 100, 1)}%)<\/td><td>${l.honest ? 'Error bar covers the truth' : 'Error bar too small for the miss'}${l.sensible ? '' : '; error bar unrealistic in size'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/div>\n    <div class=\"card\"><h3>The hidden faults in your kit<\/h3>\n      <p>Pointer readings were off from the true positions by: object scale <b>${fmt(T.oO, 2)} cm<\/b>, lens centre <b>${fmt(T.oL, 2)} cm<\/b>, screen scale <b>${fmt(T.oS, 2)} cm<\/b>. The screen looks equally sharp over about <b>±${fmt(T.fb, 2)} cm<\/b>.<\/p>\n      <p>If you had read the pointers perfectly and focused perfectly, each method would still have given:<\/p>\n      <div class=\"tw\"><table class=\"rub\" style=\"min-width:520px\"><thead><tr><th>Set-up<\/th><th>True f<\/th><th>u–v method<\/th><th>Displacement method<\/th><\/tr><\/thead><tbody>${['X', 'Y', 'XY'].map(k => `<tr><td>${SYS[k]}<\/td><td class=\"n\">${fmt(tF[k], 2)}<\/td><td class=\"n\">${nf[k].uv ? fmt(nf[k].uv, 2) + ' (' + fmt((nf[k].uv / tF[k] - 1) * 100, 1) + '%)' : '—'}<\/td><td class=\"n\">${nf[k].dis ? fmt(nf[k].dis, 2) + ' (' + fmt((nf[k].dis / tF[k] - 1) * 100, 1) + '%)' : '—'}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>\n      <p style=\"margin-top:8px\">That gap is <b>systematic error<\/b>: it does not shrink by taking more readings. The displacement method uses only D and d, and the lens offset cancels in d. For the pair, the u–v method measures from the front lens instead of from the principal planes, so it cannot give f<sub>eq<\/sub> directly.<\/p><\/div>\n    <div class=\"row noprint\"><button class=\"btn primary\" id=\"exp\" type=\"button\">Download my file for the mentor<\/button><button class=\"btn\" id=\"rep\" type=\"button\" onclick=\"window.print()\">Print this page<\/button><\/div>`;\n    $('#exp', root).addEventListener('click', exportFile);\n  }\n  nextBtn(root);\n}\n\n/* ======================================================\n   Render and start\n   ====================================================== */\nconst STEPFN = [null, step1, step2, step3, step4, step5, step6, step7];\nfunction render() {\n  while (S.step > 1 && !reach(S.step)) S.step--;\n  refreshNav(); const main = $('#main'); main.innerHTML = ''; STEPFN[S.step](main);\n}\n$('#resetBtn').addEventListener('click', () => askConfirm('Get a brand-new kit? Your current readings, predictions and results in the Challenge will be erased.', 'New kit', () => { S = newState(); save(); render(); window.scrollTo(0, 0); }));\nrender();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n","mentor":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: Mentor view<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F1F6F6; --surface:#FFFFFF; --ink:#10242E; --muted:#4A6068; --line:#CBDADC; --soft:#E1F0F0;\n  --accent:#0A7C8A; --ok:#1B7F4A; --okbg:#E1F4E8; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6; --amber:#B9770E;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0A1A21; --surface:#10272F; --ink:#E6F1F2; --muted:#9DB6BB; --line:#274149; --soft:#14323B;\n    --accent:#5FD3DB; --ok:#52D08F; --okbg:#123626; --bad:#FF8A80; --badbg:#3A1E1B; --warn:#F5C451; --warnbg:#3A3015; --amber:#F2B84B; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.6rem,4vw,2.3rem)} h2{font-size:1.6rem} h3{font-size:1.15rem;margin-top:1.3em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\nsub,sup{line-height:0}\n.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}\n.top .in{max-width:1040px;margin:0 auto;padding:8px 16px}\n.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.title{font-family:var(--serif);font-size:1.05rem;font-weight:700}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}\n.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer}\n.steps button[aria-current=\"step\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.steps button[aria-current=\"step\"]{color:#0A1A21}}\n.steps button.done::after{content:\" ✓\";color:var(--ok)}\n.steps button[aria-current=\"step\"].done::after{color:inherit}\n.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}\n.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.95rem}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.btn.primary{color:#0A1A21}}\n.btn.sm{padding:3px 9px;font-size:.85rem}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 14px}\n.card h3{margin-top:0}\n.note{border-left:5px solid var(--accent);background:var(--soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:0 0 12px;max-width:74ch;font-size:.97rem}\n.teacher{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\n.teacher.good{border-color:var(--ok);background:var(--okbg)}\n.teacher.bad{border-color:var(--bad);background:var(--badbg)}\n.teacher b.who{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}\n.hidden{display:none !important}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.12rem}\n.fld{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}\n.fld input,.fld select,.fld textarea{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:150px}\n.fld textarea{width:100%;min-width:260px;max-width:620px;min-height:74px;resize:vertical}\n.fld input.ok{border-color:var(--ok);background:var(--okbg)} .fld input.bad{border-color:var(--bad);background:var(--badbg)}\n.chk{display:flex;gap:9px;align-items:flex-start;margin:4px 0;font-size:.96rem}\n.chk input{margin-top:5px}\n.tw{overflow-x:auto}\ntable.ob{border-collapse:collapse;font-size:.93rem;min-width:560px}\n.ob th,.ob td{border:1px solid var(--line);padding:4px 6px;text-align:center}\n.ob th{background:var(--soft);font-weight:600}\n.ob input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-family:var(--mono);font-size:.9rem}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:6px;flex-wrap:wrap}\n.seg button{border:0;background:var(--bg);font-size:.88rem;padding:5px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.seg button[aria-pressed=\"true\"]{color:#0A1A21}}\n.chip{display:inline-block;font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted)}\n.chip.on{border-color:var(--ok);color:var(--ok);font-weight:600}\n.chip.warnc{border-color:var(--warn);color:var(--warn);font-weight:600}\n.kpi{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}\n.kpi div{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;min-width:120px}\n.kpi b{display:block;font-family:var(--serif);font-size:1.25rem}\n.kpi span{font-size:.82rem;color:var(--muted)}\n.cvwrap canvas{display:block;width:100%;max-width:720px;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}\n.modal-ov{position:fixed;inset:0;background:rgba(5,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}\n.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.4)}\n.modal p{margin:0 0 14px}\ndetails.how{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 14px;margin:0 0 14px}\ndetails.how summary{cursor:pointer;font-weight:600}\n@media (max-width:700px){.top{position:static}.wrap{padding:16px 12px 70px}.row{gap:8px 10px}}\n@media print{.top,.btn,.noprint{display:none !important} body{background:#fff;color:#000} .wrap{padding:0}}\n\n/* notebook-style tables */\ntable.ob{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.ob th,.ob td{border:0;border-bottom:1px solid #C6D6EC;padding:5px 8px}\n.ob th{background:transparent;font-family:var(--serif);color:var(--accent);border-bottom:2px solid var(--accent)}\n.ob td:first-child,.ob th:first-child{border-right:2px solid #E7B5B1}\n.ob input{border-width:0 0 1.5px;border-style:dashed;border-radius:0;background:transparent}\n.ob input:focus{background:var(--soft);outline-offset:0}\n@media (prefers-color-scheme: dark){.ob th,.ob td{border-bottom-color:#2A4452}.ob td:first-child,.ob th:first-child{border-right-color:#6A3B3B}}\n/* bench: darkroom in dark mode, scrollable at real size on phones */\n@media (prefers-color-scheme: dark){.benchwrap canvas{filter:brightness(.68) contrast(1.06)}}\n@media (max-width:760px){.benchwrap canvas{min-width:720px}}\n\n.benchwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#e9e4d8,#d8d1c0)}\n.benchwrap canvas{display:block}\n.carriers{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0}\n.car{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem}\n.car b{display:block;margin-bottom:3px}\n.car .b6{display:flex;gap:3px}\n.car .b6 button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:.82rem;font-family:var(--mono)}\n.car .b6 button:hover{border-color:var(--accent)}\n.viewrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin:6px 0 14px}\n.zoombox,.screenbox{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}\n.zoombox canvas{display:block;border:1px solid var(--line);border-radius:4px;max-width:100%;height:auto}\n.screen{width:300px;height:220px;border-radius:6px;overflow:hidden;background:#8C9299;position:relative;border:3px solid #444;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}\n.screen canvas{position:absolute;left:0;top:0}\n.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;max-width:70ch}\n.opt input{margin-top:5px}\n.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}\n.q{margin:0 0 18px}.q>b{display:block;margin-bottom:4px}\n.lock{border:1px dashed var(--line);border-radius:8px;padding:14px 16px;color:var(--muted);background:var(--surface)}\n.sysrow{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin:0 0 10px}\n.score{font-family:var(--serif);font-size:2.4rem;font-weight:700}\n.rub{border-collapse:collapse;font-size:.93rem;width:100%;max-width:780px}\n.rub td,.rub th{border:1px solid var(--line);padding:5px 9px;text-align:left}\n.rub th{background:var(--soft)}\n.rub td.n{text-align:right;font-family:var(--mono);white-space:nowrap}\n@media (max-width:700px){.steps{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.steps button{flex:0 0 auto;white-space:nowrap}}\n.gcols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.gside{flex:1 1 320px;min-width:280px}\n.paperwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#FFFDF7;max-width:100%}\n.paperwrap canvas{display:block;max-width:none;touch-action:none;cursor:crosshair}\n.cursorout{font-size:.85rem;color:var(--muted);margin-top:4px}\n.eb input{width:78px}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n<h2>Mentor view<\/h2>\n<p>Review a student’s work in one place: progress in every lab, the Challenge (plan, predictions, explanations, results against the answer key) and the error analysis they saved. Students download a file from the end of the Challenge or from <b>My progress<\/b>, and you load it here.<\/p>\n<div class=\"card noprint\"><h3>Load student files<\/h3>\n<div class=\"row\"><label class=\"btn primary\" style=\"cursor:pointer\">Choose files (.json)<input id=\"files\" type=\"file\" accept=\".json,application/json\" multiple style=\"position:absolute;left:-9999px\"><\/label>\n<button class=\"btn\" id=\"mine\" type=\"button\">Add this browser’s own data<\/button>\n<button class=\"btn\" id=\"csv\" type=\"button\">Download class summary (CSV)<\/button><button class=\"btn\" id=\"clr\" type=\"button\">Clear list<\/button><\/div>\n<div id=\"msg\" style=\"margin-top:8px\"><\/div><\/div>\n<div id=\"list\"><\/div>\n<div id=\"detail\"><\/div>\n<\/main>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst num = s => { const x = parseFloat(String(s).replace('−', '-').replace(',', '.')); return isFinite(x) ? x : NaN; };\nfunction fmt(n, d = 2) { if (!isFinite(n)) return '—'; let r = Math.round(n * 10 ** d) / 10 ** d; if (Object.is(r, -0)) r = 0; return String(r).replace('-', '−'); }\nfunction esc(s) { return String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c])); }\nfunction OPT_summarise(ld) {\n  const allOk = a => a.length >= 5 && a.every(r => r.checked === true);\n  const s1 = ld('optics_lab_exp1_v1'), s2 = ld('optics_lab_exp234_v1'), sc = ld('optics_lab_combination_college_v1'), sb = ld('optics_lab_exp1b_v1'), ch = ld('optics_lab_challenge_v1'), er = ld('optics_lab_errors_v1');\n  const groups = [\n    { t: 'Experiment 1: focal length of a convex lens (u–v method)', tab: 'exp1', items: ['A', 'B', 'C'].map(id => {\n      const l = s1 && s1.lens && s1.lens[id];\n      return { name: 'Lens ' + id, chips: l ? [['Rough f', !!(l.rough && l.rough.ok)], ['5+ readings', l.rows.length >= 5], ['Table checked', allOk(l.rows)], ['Both graphs', !!(l.g1.checked && l.g1.checked.ok && l.g2.checked && l.g2.checked.ok)], ['Result', !!l.res.submitted]] : null, err: l && l.res.submitted ? l.res.err : null };\n    }) },\n    { t: 'Experiment 2: concave lens (auxiliary lens method)', tab: 'exp234', items: [['2', 'D'], ['2', 'E']] },\n    { t: 'Experiment 3: lenses in contact', tab: 'exp234', items: [['3', 'A+B'], ['3', 'B+C'], ['3', 'A+E'], ['3', 'A+D']] },\n    { t: 'Experiment 4: lenses separated by a distance', tab: 'exp234', items: [['4', 'C+B'], ['4', 'C+E']] }\n  ];\n  groups.slice(1).forEach(g => { g.items = g.items.map(([e, id]) => {\n    const sub = s2 && s2.subs && s2.sub   next.disabled = idx === STEPS.length - 1; next.textContent = idx < 0 ? STEPS[0].n + ' →' : idx === STEPS.length - 1 ? 'The end' : STEPS[idx + 1].n + ' →'; next.dataset.go = idx < 0 ? STEPS[0].t : (STEPS[idx + 1] || STEPS[idx]).t;
  const cur = tabsEl.querySelector('[aria-selected="true"]'); if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { /* ignore */ } }
}
function homeHtml() {
  const st = stepStates(), phases = []; STEPS.forEach((s, i) => { let p = phases.find(x => x.n === s.ph); if (!p) { p = { n: s.ph, items: [] }; phases.push(p); } p.items.push(Object.assign({ i }, s)); });

<button class="start" type="button" data-go="theory">Start with the theory</button>
${phases.map(p => `<section class="phase" data-ph="${PHKEY[p.n]}"><h3>${p.n}<span>${PHDESC[p.n] || ''}</span></h3><div class="cards">${p.items.map(s => `<button type="button" data-go="${s.t}"><b>${s.i + 1}. ${s.n}${st[s.t] === 'done' ? ' ✓' : ''}</b><span>${s.d}</span></button>`).join('')}</div></section>`).join('')}</div>`;
}
function exportFile() {
  const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('optics_lab_') === 0) { try { data[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* skip */ } } }
  const name = stuName() || 'student', ch = data.optics_lab_challenge_v1, blob = new Blob([JSON.stringify({ app: 'combination-of-lenses', ver: 2, exported: new Date().toISOString(), name, data }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lens-lab-' + name.replace(/[^\w]+/g, '-').toLowerCase() + (ch ? '-' + ch.kit : '') + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function renderProgress(el) {
  const sm = OPT_summarise(ld), total = sm.total, done = sm.done, ch = ld('optics_lab_challenge_v1');
  let html = '<div class="in"><h2>My progress</h2><p>This page reads what you have saved in this browser. It shows every lens, lens pair and the Challenge, and how far you have got with each.</p>' +
    `<div class="nm"><label>Your name<input id="pname" value="${stuName().replace(/"/g, '&quot;')}"></label><button class="btn primary" id="pexp" type="button">Download my file for the mentor</button></div>` +
    '<div><b>' + done + ' of ' + total + '</b> parts finished' + (ch ? ' · Challenge kit <b>' + ch.kit + '</b>' : '') + '</div><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><i style="width:' + (done / total * 100) + '%"></i></div>';
  sm.groups.forEach(g => {
    html += '<h3>' + g.t + '</h3>';
    g.items.forEach(it => {
      html += '<div class="prow"><b>' + it.name + '</b>';
      if (it.chips) html += it.chips.map(c => '<span class="chip' + (c[1] ? ' on' : '') + '">' + (c[1] ? '✓ ' : '○ ') + c[0] + '</span>').join('') + (it.err !== null && it.err !== undefined ? '<span class="chip on">' + it.err + '% from accepted value</span>' : '') + (it.score ? '<span class="chip on">Score ' + it.score + '</span>' : '');
      else html += '<span class="chip">Not started</span>';
      html += '<button class="go" type="button" data-go="' + g.tab + '">Open</button></div>';
    });
  });
  html += '<p style="margin-top:16px">Progress is stored only in this browser on this device. Download your file before you clear the browser or change device. Use the Reset button inside a lab to start again.</p></div>';

  el.querySelector('#pexp').addEventListener('click', exportFile);
  el.querySelector('#pname').addEventListener('input', e => sv('optics_lab_student_v1', { name: e.target.value }));
}
const PANELS = { home: 1, progress: 1 };
function tint(t) {
  const f = made[t], tab = tabsEl.querySelector('[data-t="' + t + '"]'); if (!f || !f.contentDocument || !tab) return;
  try { const c = getComputedStyle(tab).getPropertyValue('--c').trim(); if (c) f.contentDocument.documentElement.style.setProperty('--accent', c); } catch (e) { /* ignore */ }
}
function show(t) {
  if (!Object.prototype.hasOwnProperty.call(DOCS, t) && !PANELS[t]) return;
  if (t === 'home' || !made[t]) {
    if (t === 'progress') { const d = document.createElement('div'); d.className = 'prog'; frames.appendChild(d); made[t] = d; }
    else if (t === 'home') { if (made.home) made.home.remove(); const d = document.createElement('div'); d.className = 'pan'; d.innerHTML = homeHtml(); Array.prototype.forEach.call(d.querySelectorAll('[data-go]'), b => b.addEventListener('click', () => show(b.dataset.go))); const hn = d.querySelector('#hname'); if (hn) hn.addEventListener('input', e => sv('optics_lab_student_v1', { name: e.target.value })); frames.appendChild(d); made.home = d; }
    else { const f = document.createElement('iframe'); f.title = TITLES[t]; f.srcdoc = DOCS[t]; f.dataset.t = t; f.addEventListener('load', () => tint(t)); frames.appendChild(f); made[t] = f; }
  }
  if (t === 'progress') renderProgress(made[t]);
  current = t; if (t !== 'home') { const v = visited(); if (!v[t]) { v[t] = 1; sv('optics_lab_visited_v1', v); } }
  Object.keys(made).forEach(k => { made[k].hidden = k !== t; });
  frames.setAttribute('aria-labelledby', 'tab-' + (t === 'home' ? 'theory' : t));
  updateNav(); if (t !== 'home' && t !== 'progress') tint(t);
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* ignore */ }
}
tabsEl.addEventListener('keydown', e => {
  const btns = Array.prototype.slice.call(tabsEl.querySelectorAll('.tab')), i = btns.findIndex(b => b === document.activeElement); if (i < 0) return;
  let n = -1;
  if (e.key === 'ArrowRight') n = (i + 1) % btns.length; else if (e.key === 'ArrowLeft') n = (i - 1 + btns.length) % btns.length; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = btns.length - 1;
  if (n < 0) return; e.preventDefault(); show(btns[n].dataset.t); btns[n].focus();
});
document.getElementById('prev').addEventListener('click', e => show(e.currentTarget.dataset.go));
document.getElementById('next').addEventListener('click', e => show(e.currentTarget.dataset.go));
document.getElementById('homeBtn').addEventListener('click', () => show('home'));
window.addEventListener('message', e => { if (e.data && e.data.go) show(e.data.go); });
window.addEventListener('storage', updateNav);
setInterval(() => { if (!document.hidden) updateNav(); }, 2500);
buildTabs();
const h = (location.hash || '').slice(1); show((Object.prototype.hasOwnProperty.call(DOCS, h) || PANELS[h]) ? h : 'home');
</script>
