ctx.closePath(); const g = ctx.createLinearGradient(x - rx, 0, x + rx, 0); g.addColorStop(0, 'rgba(150,200,255,.6)'); g.addColorStop(.5, 'rgba(235,245,255,.8)'); g.addColorStop(1, 'rgba(120,170,230,.55)');\n    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#3a4a66'; ctx.lineWidth = 1.6; ctx.stroke(); NB.glint(ctx, x, 90, 40); ctx.restore();\n    if (label) { ctx.fillStyle = '#10242E'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, x, 32); ctx.textAlign = 'left'; }\n  }\n  function carrier(c) {\n    const x = X(p[c]);\n    NB.base(ctx, x, 34);\n    if (c === 'o') {\n      NB.lamp(ctx, x, 14, 28);\n    } else if (c === 's') { NB.screen(ctx, x); }\n    else if (e === 3) { lensShape(x - 7, typeOf(pa), 7, '', 1); lensShape(x + 7, typeOf(pb), 7, '', 1); ctx.fillStyle = '#10242E'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pa + ' + ' + pb, x, 32); ctx.textAlign = 'left'; }\n    else if (e === 2) { c === 'a' ? lensShape(x, 'convex', 9, 'Lens ' + sub.aux, 1) : lensShape(x, 'concave', 9, 'Lens ' + sub.id, sub.inpath ? 1 : .3); }\n    else { c === 'a' ? lensShape(x, typeOf(pa), 9, 'Lens ' + pa, 1) : lensShape(x, typeOf(pb), 9, 'Lens ' + pb, 1); }\n  }\n  function drawBench() {\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);\n    NB.rail(ctx, W, H, X0, SC, X);\n    keys.slice().sort((a, b) => p[a] - p[b]).forEach(carrier);\n    if (e === 4) { ctx.fillStyle = '#334'; ctx.font = '12px system-ui, sans-serif'; ctx.fillText('← far-away window (outside the lab)', X(1), 18); }\n  }\n  function drawZoom() {\n    const v = p[zsel], W2 = 520, H2 = 130, PX = 48; zctx.clearRect(0, 0, W2, H2); zctx.fillStyle = '#f6f2e4'; zctx.fillRect(0, 0, W2, H2);\n    const c0 = Math.floor(v) - 5, xz = cm => (cm - c0) * PX; zctx.strokeStyle = '#222'; zctx.fillStyle = '#222'; zctx.lineWidth = 1; zctx.font = '12px system-ui, sans-serif'; zctx.textAlign = 'center';\n    for (let i = 0; i <= 100; i++) { const cm = c0 + i / 10; if (cm < 0 || cm > 100) continue; const x = xz(cm) + .5; if (x < -2 || x > W2 + 2) continue; const h = i % 10 === 0 ? 34 : i % 5 === 0 ? 24 : 16; zctx.beginPath(); zctx.moveTo(x, 60); zctx.lineTo(x, 60 + h); zctx.stroke(); }\n    for (let k = 0; k <= 10; k++) { const cm = c0 + k; if (cm < 0 || cm > 100) continue; zctx.fillText(String(cm), xz(cm), 118); }\n    zctx.fillStyle = '#c0392b'; zctx.beginPath(); zctx.moveTo(xz(v), 58); zctx.lineTo(xz(v) - 8, 30); zctx.lineTo(xz(v) + 8, 30); zctx.closePath(); zctx.fill(); zctx.fillStyle = '#7b828f'; zctx.fillRect(xz(v) - 5, 0, 10, 30);\n    zctx.textAlign = 'left'; zctx.fillStyle = '#555'; zctx.fillText(names[zsel] + ' pointer', 6, 16);\n  }\n  function drawScreen() {\n    const st = imaging(sub), W3 = 300, H3 = 220; sctx.clearRect(0, 0, W3, H3);\n    if (st.virtual) { const g = sctx.createRadialGradient(150, 110, 5, 150, 110, 120); g.addColorStop(0, 'rgba(255,245,200,.55)'); g.addColorStop(1, 'rgba(255,245,200,0)'); sctx.fillStyle = g; sctx.fillRect(0, 0, W3, H3); sc.style.filter = 'blur(10px)'; return; }\n    sctx.save(); sctx.translate(150, 110); sctx.rotate(Math.PI);\n    const dist = e === 4, sz = dist ? 14 : Math.max(8, Math.min(Math.abs(st.m), 6) * 24);\n    sctx.fillStyle = '#fff8d6'; sctx.fillRect(-sz / 2, -sz / 2, sz, sz); sctx.strokeStyle = '#3a2d00'; sctx.lineWidth = Math.max(1, sz / 16); sctx.beginPath(); sctx.moveTo(0, -sz / 2); sctx.lineTo(0, sz / 2); sctx.moveTo(-sz / 2, 0); sctx.lineTo(sz / 2, 0); sctx.stroke();\n    sctx.fillStyle = '#3a2d00'; sctx.beginPath(); sctx.moveTo(0, -sz / 2 - sz * .25); sctx.lineTo(-sz * .12, -sz / 2 - 2); sctx.lineTo(sz * .12, -sz / 2 - 2); sctx.closePath(); sctx.fill(); sctx.restore();\n    sc.style.filter = `blur(${st.sigma.toFixed(2)}px)`;\n  }\n  function redraw() { drawBench(); drawZoom(); drawScreen(); $$('[data-r=tabs] button', host).forEach((b, i) => b.setAttribute('aria-pressed', keys[i] === zsel)); }\n  redraw(); return { redraw, setPos };\n}\n\n/* ======================================================\n   Shared UI helpers\n   ====================================================== */\nconst doneFlags = sub => [true, sub.rows.length >= 5, sub.rows.length >= 5 && sub.rows.every(r => r.checked === true), !!(Object.values(sub.gr).length && Object.values(sub.gr).every(g => g.checked && g.checked.ok) && Object.values(sub.gr).length >= graphCount(sub.e)), !!sub.res.submitted, false];\nconst graphCount = () => 1;\nfunction refreshNav() {\n  $('#expTabs').innerHTML = [2, 3, 4].map(n => `<button type=\"button\" data-e=\"${n}\" aria-pressed=\"${S.exp === n}\">${EXP_NAMES[n]}<\/button>`).join('');\n  $$('#expTabs button').forEach(b => b.addEventListener('click', () => { S.exp = +b.dataset.e; S.step = 1; save(); render(); }));\n  $('#subTabs').innerHTML = SUBJ[S.exp].map(id => `<button type=\"button\" data-id=\"${id}\" aria-pressed=\"${S.sub[S.exp] === id}\">${S.exp === 2 ? 'Lens ' + id : id.replace('+', ' + ')}<\/button>`).join('');\n  $$('#subTabs button').forEach(b => b.addEventListener('click', () => { S.sub[S.exp] = b.dataset.id; save(); render(); }));\n  const sub = CS(), done = doneFlags(sub);\n  $('#steps').innerHTML = STEPS.map((s, i) => `<button type=\"button\" data-i=\"${i + 1}\" class=\"${done[i] ? 'done' : ''}\" ${S.step === i + 1 ? 'aria-current=\"step\"' : ''}>${i + 1}. ${s}<\/button>`).join('');\n  $$('#steps button').forEach(b => b.addEventListener('click', () => { S.step = +b.dataset.i; save(); render(); }));\n}\nfunction nextBtn(root, label) {\n  const d = document.createElement('div'); d.className = 'row noprint'; d.style.marginTop = '14px';\n  d.innerHTML = `${S.step > 1 ? '<button class=\"btn\" type=\"button\" data-n=\"-1\">Back<\/button>' : ''}${S.step < STEPS.length ? `<button class=\"btn primary\" type=\"button\" data-n=\"1\">${label || 'Next step'}<\/button>` : ''}`;\n  $$('button', d).forEach(b => b.addEventListener('click', () => { S.step += +b.dataset.n; save(); render(); window.scrollTo(0, 0); }));\n  root.appendChild(d);\n}\nfunction earlierF(id) {\n  /* the student's own measured f from Experiments 1 and 2, if available */\n  if (id === 'D' || id === 'E') { const s = S.subs['e2:' + id]; return s && s.res && isFinite(num(s.res.ff)) ? num(s.res.ff) : NaN; }\n  try { const s1 = JSON.parse(localStorage.getItem(KEY1)); const r = s1 && s1.lens && s1.lens[id] && s1.lens[id].res; return r && isFinite(num(r.ff)) ? num(r.ff) : NaN; } catch (e) { return NaN; }\n}\n\n/* ======================================================\n   Experiment definitions\n   ====================================================== */\nconst COLS = {\n  2: [{ k: 'O', l: 'Object<br>O (cm)', r: 1 }, { k: 'L1', l: 'Convex lens<br>L₁ (cm)', r: 1 }, { k: 'I1', l: 'Image I₁<br>concave out (cm)', r: 1 }, { k: 'L2', l: 'Concave lens<br>L₂ (cm)', r: 1 }, { k: 'I2', l: 'Image I₂<br>concave in (cm)', r: 1 },\n    { k: 'u', l: 'u = I₁ − L₂<br>(cm)' }, { k: 'v', l: 'v = I₂ − L₂<br>(cm)' }, { k: 'iu', l: '1/u<br>(cm⁻¹)' }, { k: 'iv', l: '1/v<br>(cm⁻¹)' }, { k: 'f', l: '|f| = uv/(v − u)<br>(cm)' }],\n  3: [{ k: 'O', l: 'Object<br>O (cm)', r: 1 }, { k: 'L', l: 'Lens pair<br>L (cm)', r: 1 }, { k: 'S', l: 'Screen<br>S (cm)', r: 1 },\n    { k: 'u', l: 'u = L − O<br>(cm)' }, { k: 'v', l: 'v = S − L<br>(cm)' }, { k: 'iu', l: '1/u<br>(cm⁻¹)' }, { k: 'iv', l: '1/v<br>(cm⁻¹)' }, { k: 'f', l: 'F = uv/(u + v)<br>(cm)' }],\n  4: [{ k: 'L1', l: 'Lens 1<br>L₁ (cm)', r: 1 }, { k: 'L2', l: 'Lens 2<br>L₂ (cm)', r: 1 }, { k: 'S', l: 'Screen<br>S (cm)', r: 1 },\n    { k: 'd', l: 'd = L₂ − L₁<br>(cm)' }, { k: 'bfl', l: 'BFL = S − L₂<br>(cm)' }, { k: 'iF', l: '1/F = (1 − d/f₁)/BFL<br>(cm⁻¹)' }, { k: 'F', l: 'F<br>(cm)' }]\n};\nconst DIG = { u: 1, v: 1, d: 1, bfl: 1, iu: 4, iv: 4, iF: 4, f: 2, F: 2 };\nconst TOLF = { u: () => 0.06, v: () => 0.06, d: () => 0.06, bfl: () => 0.06, iu: x => Math.max(0.0004, 0.01 * Math.abs(x)), iv: x => Math.max(0.0004, 0.01 * Math.abs(x)), iF: x => Math.max(0.0004, 0.02 * Math.abs(x)), f: x => 0.015 * Math.abs(x), F: x => 0.025 * Math.abs(x) };\nconst calcKeys = e => COLS[e].filter(c => !c.r).map(c => c.k);\nfunction expected(sub, r) {\n  if (sub.e === 2) { const u = num(r.I1) - num(r.L2), v = num(r.I2) - num(r.L2); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (v - u) }; }\n  if (sub.e === 3) { const u = num(r.L) - num(r.O), v = num(r.S) - num(r.L); return { u, v, iu: 1 / u, iv: 1 / v, f: u * v / (u + v) }; }\n  const f1 = num(sub.res.f1), d = num(r.L2) - num(r.L1), bfl = num(r.S) - num(r.L2), iF = (1 - d / f1) / bfl; return { d, bfl, iF, F: 1 / iF };\n}\nfunction rowVals(sub, r) { const ex = expected(sub, r), o = {}; calcKeys(sub.e).forEach(k => { o[k] = isFinite(num(r[k])) ? num(r[k]) : ex[k]; }); return o; }\n\nconst SRC = {\n  2: [['Judging the sharpest image twice (for I₁ and for I₂), so the two errors add up', 1], ['Index error: the pointers are not exactly under the lens centres', 1], ['The concave lens was too far from I₁, so the final image was faint and hard to focus', 1], ['The thickness of the lenses (the formulas are for thin lenses)', 1], ['A concave lens changes the colour of the light and so changes f', 0], ['The warm room lamp changed the focal length of the lens', 0]],\n  3: [['Judging the sharpest image position by eye', 1], ['Index error of the carrier pointers', 1], ['The two lenses were not exactly in contact, so a small gap changed F', 1], ['The f₁ and f₂ you compare with carry their own errors from earlier experiments', 1], ['The lens pair was heated by the lamp and changed its shape', 0], ['The thickness of the lenses (the formulas are for thin lenses)', 1]],\n  4: [['Judging the sharpest image of a very small image of the distant window', 1], ['d is a difference of two pointer readings, so index errors do not cancel completely', 1], ['BFL is short, so a small reading error is a large fraction of it', 1], ['f₁ from Experiment 1 has its own error, and it enters every point of the graph', 1], ['The distant window moved during the experiment', 0], ['The lenses expand when the lamp is on', 0]]\n};\nconst PRE = {\n  2: [['Place the concave lens between the convex lens and I₁, closer to I₁ than |f|', 1], ['Keep the object and all lens centres at the same height on one axis', 1], ['Do not move the object or the convex lens between phase 1 and phase 2', 1], ['Put the concave lens before the convex lens', 0], ['Focus slowly and judge the sharpest image from both sides', 1], ['Wipe the lens with a wet cloth before each reading', 0]],\n  3: [['Press the two lenses firmly together in one holder', 1], ['Keep the object and the lens centres on one axis', 1], ['Take object distances greater than 1.5 F', 1], ['Take the readings only for a single object distance', 0], ['Use a small aperture, or cover the edge of the lenses', 1], ['Wipe the lenses with a wet cloth before every reading', 0]],\n  4: [['Make sure the window really is far away (so the beam is nearly parallel)', 1], ['Keep both lenses on the same axis', 1], ['Do not let the carriers touch each other', 1], ['Take d larger than f₁ + f₂ every time', 0], ['Focus the image slowly and judge from both sides', 1], ['Move the lamp closer to heat the lenses evenly', 0]]\n};\n\n/* ---------- Step 1: aim, set-up ---------- */\nconst INFO = {\n  2: {\n    title: 'Experiment 2: focal length of a concave lens (auxiliary lens method)',\n    body: sub => `<div class=\"card\"><h3>Aim<\/h3><p>To determine the focal length of a concave lens using an auxiliary convex lens.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers · illuminated cross-wire · an auxiliary convex lens · the concave lens · screen · graph paper.<\/p>\n      <div class=\"row\"><label class=\"fld\">Concave lens<select disabled><option>Lens ${sub.id}<\/option><\/select><\/label>\n      <label class=\"fld\">Auxiliary convex lens<select id=\"aux\"><option value=\"A\">Lens A<\/option><option value=\"B\">Lens B<\/option><option value=\"C\">Lens C<\/option><\/select><\/label><\/div><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>A concave lens alone gives only a virtual image. So we let a convex lens form a real image I₁ on the screen first. Then we place the concave lens between the convex lens and I₁. The rays are now heading for I₁, so I₁ is a <b>virtual object<\/b> for the concave lens, at distance <i>u<\/i> = I₁ − L₂. The concave lens moves the image farther to I₂, at <i>v<\/i> = I₂ − L₂.<\/p>\n      <p class=\"eq\">1/v − 1/u = 1/f &nbsp;⇒&nbsp; |f| = uv/(v − u)<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">With u positive (virtual object) and v positive (real image), f comes out negative for a concave lens. We quote its magnitude |f|. A real final image forms only if u is smaller than |f|, so the concave lens must be placed close to I₁.<\/p>\n      <p>The graph of 1/v against 1/u is a straight line of slope +1. It cuts the x-axis at 1/|f|.<\/p><\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>With the concave lens out of the beam, focus the image I₁ of the object on the screen. Note O, L₁ and I₁.<\/li><li>Put the concave lens in, between the convex lens and I₁. Move the screen to focus again to get I₂. Note L₂ and I₂.<\/li><li>Repeat for at least five different positions.<\/li><li>Calculate u, v and |f|, plot the graph and find |f| from it.<\/li><\/ol><\/div>`,\n    readIntro: `<p>Each reading has two phases. In phase 1 the concave lens is <b>out<\/b> of the beam and you find the image I₁. In phase 2 you switch the concave lens <b>in<\/b>, place it before I₁, and refocus to find I₂. Do not move the object or the convex lens between the two phases.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and |f| for every row. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and |f| to 2 decimal places.'\n  },\n  3: {\n    title: 'Experiment 3: two thin lenses in contact',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To determine the equivalent focal length of two thin lenses in contact and to verify <span class=\"eq\">1/F = 1/f₁ + 1/f₂<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and carriers · illuminated cross-wire · Lens ${a} (${typeOf(a)}) and Lens ${b} (${typeOf(b)}) mounted together in one holder · screen · graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>Two thin lenses in contact act as one thin lens. The light from the object meets the first lens, and the image it would form is the object for the second. Adding the two lens equations gives<\/p>\n      <p class=\"eq\">1/F = 1/f₁ + 1/f₂, &nbsp; P = P₁ + P₂<\/p>\n      <p>Here f is positive for a convex lens and negative for a concave lens. We measure F by the u–v method, with distances taken from the lens pair, and compare it with the value from the f₁ and f₂ you found earlier.<\/p><\/div>\n      <div class=\"note\">Use your own earlier results for f₁ and f₂: Experiment 1 for the convex lenses and Experiment 2 for the concave lenses. If you did not measure a lens yet, the result page will tell you.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Fix the lens pair on its carrier. Place the object beyond 1.5 F (estimate F from f₁ and f₂).<\/li><li>Focus the image on the screen and read the three pointers. Repeat for five object distances.<\/li><li>Fill the table and calculate F for each reading.<\/li><li>Plot 1/v against 1/u, read the intercepts and find F.<\/li><li>Compare with 1/F = 1/f₁ + 1/f₂.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The two lenses sit together on the lens carrier. Put the object far enough away (more than about 1.5 F) and focus the image on the screen. Read the three pointers and record. Take at least five readings with different object distances.<\/p>`,\n    tableIntro: 'Work out u, v, 1/u, 1/v and F for each row, as in Experiment 1. Give u and v to 0.1 cm, 1/u and 1/v to 4 decimal places, and F to 2 decimal places.'\n  },\n  4: {\n    title: 'Experiment 4: two thin lenses separated by a distance',\n    body: sub => { const [a, b] = pairIds(sub.id); return `<div class=\"card\"><h3>Aim<\/h3><p>To study how the equivalent focal length F of two thin lenses depends on their separation d, and to verify <span class=\"eq\">1/F = 1/f₁ + 1/f₂ − d/(f₁f₂)<\/span>.<\/p><\/div>\n      <div class=\"card\"><h3>Apparatus<\/h3><p>Optical bench with scale and two lens carriers · Lens ${a} (${typeOf(a)}) as lens 1 and Lens ${b} (${typeOf(b)}) as lens 2 · screen · a far-away window as the object · graph paper.<\/p><\/div>\n      <div class=\"card\"><h3>Theory<\/h3><p>For a distant object the light is almost parallel. It focuses at the back focal length BFL behind lens 2. For two thin lenses separated by d,<\/p>\n      <p class=\"eq\">BFL = F (1 − d/f₁) &nbsp;&nbsp; so &nbsp;&nbsp; 1/F = (1 − d/f₁) / BFL<\/p>\n      <p>and the formula to verify is <span class=\"eq\">1/F = (1/f₁ + 1/f₂) − d/(f₁f₂)<\/span>. So a graph of 1/F against d is a straight line. Its intercept (at d = 0) is 1/f₁ + 1/f₂, and its slope is −1/(f₁f₂). From the slope you can find f₂.<\/p>\n      <p style=\"font-size:.93rem;color:var(--muted)\">F is measured from the principal planes, not from lens 2. That is why we measure BFL and then convert.<\/p><\/div>\n      <div class=\"note\">You need f₁ (the lens 1 value you measured in Experiment 1). The table page asks for it.<\/div>\n      <div class=\"card\"><h3>Procedure in outline<\/h3><ol style=\"margin:0;padding-left:1.3em;max-width:70ch\"><li>Place lens 1 and lens 2 on the rail at a separation d (keep d between about 4 and 12 cm).<\/li><li>Focus the image of the distant window on the screen and read the three pointers.<\/li><li>Repeat for at least five values of d.<\/li><li>Calculate d, BFL, 1/F and F. Plot 1/F against d.<\/li><li>From the slope find f₂, and compare with its value from the earlier experiments.<\/li><\/ol><\/div>`; },\n    readIntro: `<p>The object is a window far outside the lab, so the light arrives almost parallel. Set lens 1 and lens 2 a few centimetres apart, and focus the image of the window on the screen. Read the three pointers. Take at least five readings with different separations d (about 4 to 12 cm).<\/p>`,\n    tableIntro: 'First enter f₁, the focal length of lens 1 that you measured. Then work out d, BFL, 1/F and F for each row. Give d and BFL to 0.1 cm, 1/F to 4 decimal places and F to 2 decimal places.'\n  }\n};\nfunction step1(root, sub) {\n  root.innerHTML = `<h2>${INFO[sub.e].title}<\/h2>` + INFO[sub.e].body(sub);\n  if (sub.e === 2) { const sel = $('#aux', root); sel.value = sub.aux; sel.disabled = sub.rows.length > 0; sel.addEventListener('change', () => { sub.aux = sel.value; save(); }); }\n  nextBtn(root, 'Go to the bench');\n}\n\n/* ---------- Step 2: readings ---------- */\nfunction field(id, label, val) { return `<label class=\"fld\">${label}<input id=\"${id}\" inputmode=\"decimal\" value=\"${val || ''}\"><\/label>`; }\nconst ptrOK = (t, a) => isFinite(t) && Math.abs(t - a) <= 0.06;\nfunction step2(root, sub) {\n  const e = sub.e, p = sub.pos;\n  root.innerHTML = `<h2>Take readings<\/h2>${INFO[e].readIntro}<div id=\"bench\"><\/div><div class=\"card\" id=\"rec\"><\/div>`;\n  mountBench($('#bench', root), sub);\n  const rec = $('#rec', root);\n  const blank = () => Object.fromEntries(calcKeys(e).map(k => [k, '']));\n  const note = html => { $('#rfb', rec).innerHTML = html; };\n  function auto() { return `<label class=\"chk\"><input type=\"checkbox\" id=\"auto\" ${S.auto ? 'checked' : ''}><span>Skip the scale-reading practice: fill the pointer readings for me<\/span><\/label>`; }\n  function hookAuto() { $('#auto', rec).addEventListener('change', ev => { S.auto = ev.target.checked; save(); }); }\n  function val(id, actual) { return S.auto ? actual : num($('#' + id, rec).value); }\n  function addRow(fields, extra) { sub.rows.push(Object.assign({ checked: null }, fields, blank(), extra || {})); save(); refreshNav(); }\n  const count = () => `<p style=\"margin:8px 0 0;font-size:.93rem;color:var(--muted)\">Readings recorded so far: <b>${sub.rows.length}<\/b> of at least 5.<\/p>`;\n\n  function drawRec() {\n    if (e === 3) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rL', 'Lens-pair pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const O = val('rO', p.o), L = val('rL', p.a), Sx = val('rS', p.s);\n        if (![O, L, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(O, p.o) || !ptrOK(L, p.a) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open “Read the scale” for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No image can form on the screen with the object this close. Move the object farther away.'));\n        if (sub.rows.some(r => Math.abs(num(r.O) - O) < .05 && Math.abs(num(r.L) - L) < .05 && Math.abs(num(r.S) - Sx) < .05)) return note(T('bad', 'You have already recorded this setting. Change the object distance.'));\n        addRow({ O: String(O), L: String(L), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else if (e === 4) {\n      rec.innerHTML = `<h3>Record reading ${sub.rows.length + 1}<\/h3><div class=\"row\">${field('rA', 'Lens 1 pointer (cm)')}${field('rB', 'Lens 2 pointer (cm)')}${field('rS', 'Screen pointer (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\" ${sub.rows.length >= 8 ? 'disabled' : ''}>Add to the observation table<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n      hookAuto();\n      $('#add', rec).addEventListener('click', () => {\n        const A = val('rA', p.a), B = val('rB', p.b), Sx = val('rS', p.s);\n        if (![A, B, Sx].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n        if (!ptrOK(A, p.a) || !ptrOK(B, p.b) || !ptrOK(Sx, p.s)) return note(T('bad', 'A reading does not match its pointer. Open “Read the scale” for that carrier and read it to the nearest millimetre.'));\n        const st = imaging(sub); if (st.virtual) return note(T('bad', 'No real image forms on the screen with this separation. Try a smaller d.'));\n        if (sub.rows.some(r => Math.abs(num(r.L2) - num(r.L1) - (B - A)) < .05)) return note(T('bad', 'You already have a reading with this separation. Change d.'));\n        addRow({ L1: String(A), L2: String(B), S: String(Sx) }, { dtrue: +st.delta.toFixed(2) }); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded.`));\n      });\n    } else {\n      const ph = sub.stage.phase;\n      if (ph === 1) {\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 1: concave lens OUT of the beam<\/h3><div class=\"row\">${field('rO', 'Object pointer (cm)')}${field('rA', 'Convex lens pointer (cm)')}${field('rI', 'Screen pointer for I₁ (cm)')}<button class=\"btn primary\" id=\"lock\" type=\"button\" style=\"align-self:flex-end\">Lock phase 1<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#lock', rec).addEventListener('click', () => {\n          const O = val('rO', p.o), A = val('rA', p.a), I = val('rI', p.s);\n          if (sub.inpath) return note(T('bad', 'Take the concave lens out of the beam first (use the switch above the carriers).'));\n          if (![O, A, I].every(isFinite)) return note(T('', 'Enter all three pointer readings.'));\n          if (!ptrOK(O, p.o) || !ptrOK(A, p.a) || !ptrOK(I, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub); if (st.virtual) return note(T('bad', 'The convex lens makes no real image with the object this close. Move the object farther away.'));\n          sub.stage = { phase: 2, O, L1: A, I1: I, tO: p.o, tA: p.a, d1: +st.delta.toFixed(2) }; save(); drawRec();\n          note(T('good', 'Phase 1 locked. Now switch the concave lens IN, place it before I₁ (closer to I₁ than its focal length), and refocus the screen.'));\n        });\n      } else {\n        const g = sub.stage;\n        rec.innerHTML = `<h3>Reading ${sub.rows.length + 1}, phase 2: concave lens IN the beam<\/h3><p style=\"margin:0 0 8px;font-size:.95rem\">Locked from phase 1: O = ${g.O}, L₁ = ${g.L1}, I₁ = ${g.I1}<\/p><div class=\"row\">${field('rB', 'Concave lens pointer (cm)')}${field('rI2', 'Screen pointer for I₂ (cm)')}<button class=\"btn primary\" id=\"add\" type=\"button\" style=\"align-self:flex-end\">Add to the observation table<\/button><button class=\"btn\" id=\"redo\" type=\"button\" style=\"align-self:flex-end\">Start phase 1 again<\/button><\/div>${auto()}<div id=\"rfb\"><\/div>${count()}`;\n        hookAuto();\n        $('#redo', rec).addEventListener('click', () => { sub.stage = { phase: 1 }; save(); drawRec(); });\n        $('#add', rec).addEventListener('click', () => {\n          const B = val('rB', p.b), I2 = val('rI2', p.s);\n          if (!sub.inpath) return note(T('bad', 'Switch the concave lens IN the beam first.'));\n          if (Math.abs(p.o - g.tO) > 0.05 || Math.abs(p.a - g.tA) > 0.05) return note(T('bad', 'You moved the object or the convex lens after phase 1. Press “Start phase 1 again”.'));\n          if (![B, I2].every(isFinite)) return note(T('', 'Enter both pointer readings.'));\n          if (!ptrOK(B, p.b) || !ptrOK(I2, p.s)) return note(T('bad', 'A reading does not match its pointer. Read the scale again.'));\n          const st = imaging(sub);\n          if (st.virtual) return note(T('bad', 'No real image forms. The concave lens is too far from I₁ (more than its focal length). Move it closer to I₁.'));\n          if (g.I1 - B < 0.3) return note(T('bad', 'The concave lens must be placed before I₁ (to the left of it), so that I₁ is a virtual object for it.'));\n          if (I2 - g.I1 < 0.3) return note(T('bad', 'The new image should be farther away than I₁. Refocus the screen.'));\n          addRow({ O: String(g.O), L1: String(g.L1), I1: String(g.I1), L2: String(B), I2: String(I2) }, { dtrue: +Math.max(Math.abs(g.d1), Math.abs(st.delta)).toFixed(2) });\n          sub.stage = { phase: 1 }; save(); drawRec(); note(T('good', `Reading ${sub.rows.length} recorded. For the next one, take the concave lens out of the beam and change the object distance.`));\n        });\n      }\n    }\n  }\n  drawRec(); nextBtn(root, 'Go to the observation table');\n}\n\n/* ---------- Step 3: observation table ---------- */\nfunction step3(root, sub) {\n  const e = sub.e, cols = COLS[e], ck = calcKeys(e);\n  root.innerHTML = `<h2>Observation table<\/h2><p>${INFO[e].tableIntro}<\/p>\n    ${e === 4 ? `<div class=\"row\" style=\"margin-bottom:8px\"><label class=\"fld\">f₁ of lens 1 (cm)<input id=\"f1\" inputmode=\"decimal\" value=\"${sub.res.f1 || ''}\"><\/label><button class=\"btn sm\" id=\"use1\" type=\"button\" style=\"align-self:flex-end\">Use my result from Experiment 1<\/button><\/div><div id=\"f1note\"><\/div>` : ''}\n    <div class=\"tw\"><table class=\"ob\"><thead><tr><th>No.<\/th>${cols.map(c => `<th>${c.l}<\/th>`).join('')}<\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" id=\"chk\" type=\"button\">Check my calculations<\/button><button class=\"btn\" id=\"assist\" type=\"button\">Fill the calculated columns for me<\/button><button class=\"btn\" id=\"del\" type=\"button\">Delete the last row<\/button><\/div>\n    <div id=\"tfb\"><\/div><div id=\"mean\" class=\"note\" style=\"margin-top:10px\"><\/div><div id=\"ray\" style=\"margin-top:12px\"><\/div>`;\n  const tb = $('#tb', root), mk = ck[ck.length - 1];\n  const ray = e === 3 ? mountRay($('#ray', root), () => sub.rows) : null;\n  function meanBox() {\n    const arr = sub.rows.map(r => num(r[mk])).filter(isFinite);\n    $('#mean', root).innerHTML = arr.length ? `Mean of the ${e === 4 ? 'F' : e === 3 ? 'F' : '|f|'} values you entered: <b>${fmt(arr.reduce((a, b) => a + b, 0) / arr.length, 2)} cm<\/b> (from ${arr.length} reading${arr.length > 1 ? 's' : ''}).${e === 4 ? ' (For this experiment F changes with d, so the mean is not meaningful. The graph is what matters.)' : ''}` : 'The mean of your values will appear here.';\n  }\n  function drawRows() {\n    tb.innerHTML = sub.rows.length ? sub.rows.map((r, i) => `<tr data-i=\"${i}\"><td>${i + 1}<\/td>${cols.map(c => c.r ? `<td>${r[c.k]}<\/td>` : `<td><input data-k=\"${c.k}\" inputmode=\"decimal\" value=\"${r[c.k]}\" aria-label=\"${c.k} for reading ${i + 1}\"><\/td>`).join('')}<\/tr>`).join('') : `<tr><td colspan=\"${cols.length + 1}\">No readings yet. Go back and take some.<\/td><\/tr>`;\n    $$('input', tb).forEach(inp => inp.addEventListener('input', () => { const r = sub.rows[+inp.closest('tr').dataset.i]; r[inp.dataset.k] = inp.value; r.checked = null; inp.classList.remove('ok', 'bad'); save(); meanBox(); refreshNav(); }));\n    meanBox(); if (ray) ray.refresh();\n  }\n  if (e === 4) {\n    $('#f1', root).addEventListener('input', ev => { sub.res.f1 = ev.target.value; sub.rows.forEach(r => { r.checked = null; }); save(); });\n    $('#use1', root).addEventListener('click', () => { const v = earlierF(pairIds(sub.id)[0]); if (isFinite(v)) { sub.res.f1 = String(v); $('#f1', root).value = v; save(); $('#f1note', root).innerHTML = ''; } else $('#f1note', root).innerHTML = T('', 'I could not find a saved result for that lens from Experiment 1. Type your own value.'); });\n  }\n  $('#chk', root).addEventListener('click', () => {\n    const fb = $('#tfb', root);\n    if (e === 4 && !isFinite(num(sub.res.f1))) { fb.innerHTML = T('bad', 'Enter f₁ at the top first.'); return; }\n    let bad = 0, empty = 0; const msgs = [];\n    sub.rows.forEach((r, i) => {\n      const ex = expected(sub, r), tr = tb.children[i], okk = {};\n      ck.forEach(k => { const inp = $(`[data-k=${k}]`, tr); inp.classList.remove('ok', 'bad'); const t = num(r[k]); if (!isFinite(t)) { empty++; inp.classList.add('bad'); return; } okk[k] = Math.abs(t - ex[k]) <= TOLF[k](ex[k]); if (okk[k]) inp.classList.add('ok'); else { bad++; inp.classList.add('bad'); } });\n      r.checked = ck.every(k => okk[k]);\n      if (!r.checked) { const first = ck.find(k => okk[k] === false); if (first) msgs.push(`Row ${i + 1}: check <b>${first}<\/b> again.`); }\n    });\n    save(); refreshNav();\n    if (!sub.rows.length) fb.innerHTML = T('', 'You have no readings yet.');\n    else if (empty) fb.innerHTML = T('', `${empty} box${empty > 1 ? 'es are' : ' is'} still empty. Fill them in, then check again.`);\n    else if (bad) fb.innerHTML = T('bad', msgs.join('<br>') || 'Some entries are wrong.');\n    else fb.innerHTML = T('good', 'All your calculations are correct.');\n  });\n  $('#assist', root).addEventListener('click', () => {\n    if (e === 4 && !isFinite(num(sub.res.f1))) { $('#tfb', root).innerHTML = T('bad', 'Enter f₁ at the top first.'); return; }\n    sub.rows.forEach(r => { const ex = expected(sub, r); ck.forEach(k => { r[k] = fmt(ex[k], DIG[k]); }); r.checked = null; }); save(); drawRows(); refreshNav(); $('#tfb', root).innerHTML = T('', 'The columns are filled. Press “Check my calculations” to mark them as verified.');\n  });\n  $('#del', root).addEventListener('click', () => { sub.rows.pop(); save(); drawRows(); refreshNav(); });\n  drawRows(); nextBtn(root, 'Go to the graph');\n}\n\n/* ---------- Step 4: graph ---------- */\nconst GSPEC = {\n  2: { name: '1/v against 1/u', xh: '1/u (cm⁻¹)', yh: '1/v (cm⁻¹)', xsc: [0.005, 0.01, 0.02, 0.05], ysc: [0.005, 0.01, 0.02, 0.05], data: v => [v.iu, v.iv] },\n  3: { name: '1/v against 1/u', xh: '1/u (cm⁻¹)', yh: '1/v (cm⁻¹)', xsc: [0.005, 0.01, 0.02, 0.05], ysc: [0.005, 0.01, 0.02, 0.05], data: v => [v.iu, v.iv] },\n  4: { name: '1/F against d', xh: 'd (cm)', yh: '1/F (cm⁻¹)', xsc: [1, 2, 2.5, 5], ysc: [0.001, 0.002, 0.005, 0.01, 0.02], data: v => [v.d, v.iF] }\n};\nfunction step4(root, sub) {\n  const e = sub.e, sp = GSPEC[e], g = graphOf(sub, 'g');\n  root.innerHTML = `<h2>Graph: ${sp.name}<\/h2><p>Plot on the graph paper by clicking where each point belongs. Choose the scale yourself, label the axes, plot every point, then place the ruler line.<\/p>\n  <div class=\"gcols\"><div><div class=\"paperwrap\"><canvas id=\"paper\" width=\"${PW}\" height=\"${PH}\" aria-label=\"Graph paper\"><\/canvas><\/div><div class=\"cursorout\" id=\"cur\">Move over the paper to read coordinates.<\/div><\/div><div class=\"gside\" id=\"side\"><\/div><\/div>`;\n  const cv = $('#paper', root), ctx = cv.getContext('2d'), side = $('#side', root); let flags = null, dragH = null;\n  const vals = sub.rows.map(r => rowVals(sub, r));\n  const data = () => vals.map(v => sp.data(v));\n  const redraw = () => drawPaper(ctx, g, 2, { flags });\n  function lineInfo() { const [a, b] = g.line, dx = b[0] - a[0], dy = b[1] - a[1]; return { xint: a[0] - a[1] * dx / dy, yint: a[1] - a[0] * dy / dx, slope: dy / dx }; }\n  function readPanel() {\n    const box = $('#gread', side); if (!(g.checked && g.checked.plotOk)) { box.innerHTML = ''; return; }\n    let h = '';\n    if (e === 2) h = `<p style=\"margin:0 0 8px;font-size:.95rem\">Extend your line to the x-axis. Where it cuts the axis (1/v = 0) the reading is 1/|f|.<\/p><div class=\"row\">${field('ga', 'x-intercept (cm⁻¹)', g.a)}${field('gf', '|f| = 1/(x-intercept) (cm)', g.f)}<\/div>`;\n    else if (e === 3) h = `<p style=\"margin:0 0 8px;font-size:.95rem\">The line cuts both axes at 1/F. Read both intercepts.<\/p><div class=\"row\">${field('ga', 'x-intercept (cm⁻¹)', g.a)}${field('gb', 'y-intercept (cm⁻¹)', g.b)}${field('gf', 'F = 2/(sum of intercepts) (cm)', g.f)}<\/div>`;\n    else h = `<p style=\"margin:0 0 8px;font-size:.95rem\">Read the y-intercept (1/F at d = 0). Then read two points far apart on your line to find its slope. Finally, slope = −1/(f₁f₂), so f₂ = −1/(slope × f₁).<\/p><div class=\"row\">${field('ga', 'y-intercept 1/F at d = 0 (cm⁻¹)', g.a)}${field('gb', 'slope of the line (cm⁻²)', g.b)}${field('gf', 'f₂ from the slope (cm)', g.f)}<\/div>`;\n    box.innerHTML = `<div class=\"card\"><h3>Read the graph<\/h3>${h}<button class=\"btn primary sm\" id=\"rok\" type=\"button\" style=\"margin-top:8px\">Check<\/button><div id=\"rfb2\"><\/div><\/div>`;\n    $('#rok', box).addEventListener('click', () => {\n      g.a = $('#ga', box).value; g.f = $('#gf', box).value; if ($('#gb', box)) g.b = $('#gb', box).value; save();\n      const fb = $('#rfb2', box); if (!g.line) { fb.innerHTML = T('', 'Place the ruler line first.'); return; }\n      const li = lineInfo(), a = num(g.a), b = num(g.b), f = num(g.f), xs = parseFloat(g.xs), ys = parseFloat(g.ys);\n      if (e === 2) {\n        if (![a, f].every(isFinite)) { fb.innerHTML = T('', 'Enter both numbers.'); return; }\n        if (Math.abs(a - li.xint) > 0.3 * xs) { fb.innerHTML = T('bad', `Your x-intercept does not match where your line cuts the axis. (It is near ${fmt(li.xint, 4)}.)`); return; }\n        if (Math.abs(f - 1 / a) > 0.03 * f) { fb.innerHTML = T('bad', '|f| = 1 divided by the x-intercept.'); return; }\n        g.checked.ok = true; fb.innerHTML = T('good', `Good. From the graph, <b>|f| = ${fmt(f, 2)} cm<\/b>.`);\n      } else if (e === 3) {\n        if (![a, b, f].every(isFinite)) { fb.innerHTML = T('', 'Enter all three numbers.'); return; }\n        if (Math.abs(a - li.xint) > 0.3 * xs || Math ${fmt(pred, 2)} cm<\/b> (P₁ + P₂ = ${fmt(100 / p1, 2)} + ${fmt(100 / p2, 2)} = ${fmt(100 / p1 + 100 / p2, 2)} D). You measured <b>${fmt(ff, 2)} cm<\/b>, a difference of <b>${fmt(diff, 1)}%<\/b>.<br>${diff <= 5 ? '1/F = 1/f₁ + 1/f₂ is verified within experimental error.' : diff <= 8 ? 'The formula holds, within the larger errors of a combined measurement.' : 'The difference is bigger than expected. The errors in f₁ and f₂ add to the error in F. Check them.'}<br>The accepted value of F for this pair is ${fmt(tv, 2)} cm, so your measurement is ${fmt(err, 1)}% from it.`;\n    } else {\n      const f1 = num(sub.res.f1), f2g = num($('#fm', root).value), f2e = num($('#p2', root).value);\n      r.mean = $('#fm', root).value; r.p2 = $('#p2', root).value;\n      if (![f2g, f2e].every(isFinite)) { fb.innerHTML = T('', 'Fill in both values of f₂ first.'); return; }\n      if (typeOf(pairIds(sub.id)[1]) !== (f2g > 0 ? 'convex' : 'concave')) { fb.innerHTML = T('bad', 'Check the sign of f₂ from the slope. f₂ is positive for a convex lens and negative for a concave lens.'); return; }\n      const tv = trueValue(sub), diff = Math.abs(f2g - f2e) / Math.abs(f2e) * 100, err = Math.abs(f2g - tv) / Math.abs(tv) * 100; r.err = err.toFixed(1); good = diff <= 12;\n      const devs = sub.rows.map(q => { const v = rowVals(sub, q), pr = 1 / f1 + 1 / f2e - v.d / (f1 * f2e); return Math.abs(v.iF - pr) / Math.abs(pr) * 100; }).filter(isFinite), mx = devs.length ? Math.max(...devs) : NaN;\n      html = `From the slope you found f₂ = ${fmt(f2g, 2)} cm. From your earlier experiment it is ${fmt(f2e, 2)} cm, a difference of <b>${fmt(diff, 1)}%<\/b>.<br>If you use f₁ = ${fmt(f1, 2)} cm and f₂ = ${fmt(f2e, 2)} cm in 1/F = 1/f₁ + 1/f₂ − d/(f₁f₂), no measured point is more than <b>${fmt(mx, 1)}%<\/b> away from the prediction.<br>${mx <= 6 ? 'The formula describes your data well: F changes with d exactly as predicted.' : 'The scatter is larger than expected. BFL is short here, so small focusing errors matter.'}<br>The accepted value of f₂ is ${fmt(tv, 2)} cm, so your slope result is ${fmt(err, 1)}% from it.`;\n    }\n    html += `<br>Sources of error: ${sOK} correct and ${sBad} wrong. Precautions: ${pOK} correct and ${pBad} wrong.`;\n    if (sBad || pBad) html += ' (Warm lamps, wet cloths and invented effects are not the issue here.)';\n    r.submitted = true; save(); refreshNav(); fb.innerHTML = T(good ? 'good' : 'bad', html);\n  });\n  nextBtn(root, 'Go to the lab report');\n}\n\n/* ---------- Step 6: report ---------- */\nfunction step6(root, sub) {\n  const e = sub.e;\n  if (!sub.rows.length) { root.innerHTML = '<h2>Lab report<\/h2><p>You have not taken any readings for this setting yet.<\/p>'; nextBtn(root); return; }\n  const cols = COLS[e], g = graphOf(sub, 'g'); let img = '';\n  if (g.pts.length) { const c = document.createElement('canvas'); c.width = PW; c.height = PH; drawPaper(c.getContext('2d'), g, 2, {}); img = `<img alt=\"Graph\" src=\"${c.toDataURL('image/png')}\" width=\"${PW}\">`; }\n  const rows = sub.rows.map((r, i) => `<tr><td>${i + 1}<\/td>${cols.map(c => `<td>${r[c.k]}<\/td>`).join('')}<\/tr>`).join('');\n  const r = sub.res, sc = SRC[e], pc = PRE[e];\n  const aim = { 2: 'To determine the focal length of a concave lens using an auxiliary convex lens.', 3: 'To determine the equivalent focal length of two thin lenses in contact and verify 1/F = 1/f₁ + 1/f₂.', 4: 'To study how the equivalent focal length of two thin lenses depends on their separation and verify 1/F = 1/f₁ + 1/f₂ − d/(f₁f₂).' }[e];\n  const th = { 2: '1/v − 1/u = 1/f with u the virtual-object distance (I₁ − L₂) and v the final image distance (I₂ − L₂); |f| = uv/(v − u).', 3: '1/F = 1/f₁ + 1/f₂ for thin lenses in contact; P = P₁ + P₂.', 4: 'BFL = F(1 − d/f₁) and 1/F = 1/f₁ + 1/f₂ − d/(f₁f₂); the graph of 1/F against d is a straight line with intercept 1/f₁ + 1/f₂ and slope −1/(f₁f₂).' }[e];\n  const result = e === 2 ? `|f| of the concave Lens ${sub.id} = <b>${r.ff || '—'} cm<\/b>${r.submitted ? ` (${r.err}% from the accepted value)` : ''}` : e === 3 ? `F of the pair ${sub.id.replace('+', ' + ')} = <b>${r.ff || '—'} cm<\/b>; predicted from f₁ = ${r.p1 || '—'} cm and f₂ = ${r.p2 || '—'} cm` : `f₂ from the slope = <b>${r.mean || g.f || '—'} cm<\/b>; from the earlier experiment = ${r.p2 || '—'} cm; f₁ = ${r.f1 || '—'} cm`;\n  root.innerHTML = `<div class=\"row noprint\" style=\"margin-bottom:10px\"><button class=\"btn primary\" id=\"prt\" type=\"button\">Print or save as PDF<\/button><button class=\"btn\" id=\"dl\" type=\"button\">Download report as a file<\/button><span id=\"rmsg\" style=\"font-size:.9rem;color:var(--muted)\"><\/span><\/div>\n    <div class=\"rep\"><h2>${INFO[e].title}<\/h2><h3>Aim<\/h3><p>${aim}<\/p><h3>Theory<\/h3><p>${th}<\/p>\n    <h3>Observation table (${e === 2 ? 'Lens ' + sub.id + ', auxiliary Lens ' + sub.aux : sub.id.replace('+', ' + ')})<\/h3><div class=\"tw\"><table><tr><th>No.<\/th>${cols.map(c => `<th>${c.l}<\/th>`).join('')}<\/tr>${rows}<\/table><\/div>\n    <h3>Graph<\/h3><div>${img || '<p>No graph plotted yet.<\/p>'}<\/div><h3>Result<\/h3><p>${result}.<\/p>${e === 4 ? '' : '<p>' + statsLine(sub.rows.map(q => num(q[calcKeys(e)[calcKeys(e).length - 1]])).filter(isFinite), e === 2 ? '|f|' : 'F') + '<\/p>'}\n    <h3>Sources of error<\/h3><p>${r.src.length ? r.src.map(i => sc[i][0]).join('; ') : 'not filled in'}.<\/p><h3>Precautions<\/h3><p>${r.pre.length ? r.pre.map(i => pc[i][0]).join('; ') : 'not filled in'}.<\/p><\/div>`;\n  hookReport(root); nextBtn(root);\n}\nconst STEP_FNS = [null, step1, step2, step3, step4, step5, step6];\n\n\n\n/* ======================================================\n   Shared helpers: confirm dialog, report, ray diagram, error analysis\n   ====================================================== */\nfunction askConfirm(msg, yes, onYes) {\n  const prev = document.activeElement, ov = document.createElement('div'); ov.className = 'modal-ov';\n  ov.innerHTML = '<div class=\"modal\" role=\"alertdialog\" aria-modal=\"true\" aria-label=\"Please confirm\"><p>' + msg + '<\/p><div class=\"row\"><button class=\"btn primary\" type=\"button\" data-y=\"1\">' + yes + '<\/button><button class=\"btn\" type=\"button\" data-y=\"0\">Cancel<\/button><\/div><\/div>';\n  const key = ev => { if (ev.key === 'Escape') close(); };\n  const close = () => { ov.remove(); document.removeEventListener('keydown', key); if (prev && prev.focus) prev.focus(); };\n  ov.addEventListener('click', ev => { if (ev.target === ov) close(); });\n  ov.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const y = b.dataset.y === '1'; close(); if (y) onYes(); }));\n  document.addEventListener('keydown', key); document.body.appendChild(ov); ov.querySelector('[data-y=\"0\"]').focus();\n}\nfunction hookReport(root) {\n  const msg = $('#rmsg', root);\n  $('#prt', root).addEventListener('click', () => { try { window.print(); } catch (e) { msg.textContent = 'Printing is blocked here. Use \"Download report as a file\" and print that file.'; } });\n  $('#dl', root).addEventListener('click', () => {\n    try {\n      const c = $('.rep', root).cloneNode(true), vv = c.querySelector('#viva');\n      if (vv) { if (vv.previousElementSibling) vv.previousElementSibling.remove(); vv.remove(); }\n      const html = '<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Lab report<\/title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:20px auto;padding:0 16px;color:#111;line-height:1.5}table{border-collapse:collapse;font-size:.9rem;margin:6px 0}td,th{border:1px solid #bbb;padding:3px 8px;text-align:center}img{max-width:100%;height:auto;border:1px solid #ccc}h2{border-bottom:2px solid #111;padding-bottom:4px}h3{margin:1.1em 0 .3em}<\/style><\/head><body>' + c.innerHTML + '<\/body><\/html>';\n      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'lens-lab-report.html';\n      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n      msg.textContent = 'Report downloaded.';\n    } catch (e) { msg.textContent = 'Download is blocked here. Open the lab in a normal browser tab.'; }\n  });\n}\nfunction rayUV(r) { const O = num(r.O), L = num(r.L), Sx = num(r.S); return { u: L - O, v: Sx - L }; }\nfunction drawRay(cv, u, v) {\n  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = 700, H = 290;\n  cv.width = W * dpr; cv.height = H * dpr;\n  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  const ink = css('--ink'), muted = css('--muted'), surf = css('--surface'), c1 = css('--accent'), c2 = css('--ok'), c3 = css('--warn');\n  ctx.fillStyle = surf; ctx.fillRect(0, 0, W, H); ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';\n  if (!(u > 0 && v > 0 && isFinite(u + v))) { ctx.fillStyle = muted; ctx.fillText('No valid u and v for this reading.', W / 2, H / 2); return; }\n  const f = u * v / (u + v), pad = 36, xmin = -u - 5, xmax = v + 5, sx = (W - 2 * pad) / (xmax - xmin), X = x => pad + (x - xmin) * sx, cy = 125;\n  const h = Math.min(52, 100 * u / v), hi = h * v / u, lx = X(0);\n  ctx.strokeStyle = muted; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(pad - 14, cy); ctx.lineTo(W - pad + 14, cy); ctx.stroke();\n  ctx.fillStyle = muted; ctx.font = '12px system-ui, sans-serif';\n  [[-f, 'F'], [f, 'F′'], [-2 * f, '2F'], [2 * f, '2F′']].forEach(([x, t]) => { const px = X(x); if (px > 8 && px < W - 8) { ctx.beginPath(); ctx.moveTo(px, cy - 5); ctx.lineTo(px, cy + 5); ctx.stroke(); ctx.fillText(t, px, cy + 19); } });\n  ctx.beginPath(); ctx.moveTo(lx, cy - 105); ctx.quadraticCurveTo(lx - 20, cy, lx, cy + 105); ctx.quadraticCurveTo(lx + 20, cy, lx, cy - 105); ctx.closePath();\n  ctx.globalAlpha = .18; ctx.fillStyle = c1; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke();\n  const P0 = [X(-u), cy - h], I = [X(v), cy + hi];\n  const ray = (mid, col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(P0[0], P0[1]); ctx.lineTo(mid[0], mid[1]); ctx.lineTo(I[0], I[1]); ctx.stroke(); };\n  ray([lx, cy - h], c1); ray([lx, cy], c2); ray([lx, cy + hi], c3);\n  ctx.font = 'bold 13px system-ui, sans-serif';\n  const arr = (x, y2, label) => { ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x, y2); ctx.stroke(); const d = y2 < cy ? 1 : -1; ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x - 5, y2 + d * 10); ctx.lineTo(x + 5, y2 + d * 10); ctx.closePath(); ctx.fill(); ctx.textAlign = 'center'; ctx.fillText(label, x, y2 < cy ? y2 - 8 : y2 + 18); };\n  arr(P0[0], P0[1], 'object'); arr(I[0], I[1], 'image');\n  ctx.font = '12px system-ui, sans-serif';\n  const dim = (xa, xb, label) => { ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(xa, 262); ctx.lineTo(xb, 262); ctx.moveTo(xa, 256); ctx.lineTo(xa, 268); ctx.moveTo(xb, 256); ctx.lineTo(xb, 268); ctx.stroke(); ctx.textAlign = 'center'; ctx.fillText(label, (xa + xb) / 2, 254); };\n  dim(X(-u), lx, 'u = ' + fmt(u, 1) + ' cm'); dim(lx, X(v), 'v = ' + fmt(v, 1) + ' cm');\n  ctx.textAlign = 'left'; ctx.fillStyle = ink; ctx.font = '13px system-ui, sans-serif';\n  ctx.fillText('1/f = 1/u + 1/v, so f = ' + fmt(f, 2) + ' cm', 12, 20);\n}\nfunction mountRay(host, getRows) {\n  host.innerHTML = '<div class=\"card\"><h3>Ray diagram of your reading<\/h3><p style=\"margin:0 0 8px;font-size:.95rem\">Pick a reading. The diagram is drawn from <i>your<\/i> own object and image distances (u and v). Three rays leave the top of the object: one parallel to the axis, one through the centre of the lens, and one through F. If you judged the sharp image well, all three meet exactly at the image.<\/p><div class=\"row\" data-r=\"sel\" style=\"margin-bottom:8px\"><\/div><div class=\"cvwrap2\"><canvas aria-label=\"Ray diagram drawn from your reading\"><\/canvas><\/div><div data-r=\"cap\" style=\"font-size:.93rem;margin-top:6px\"><\/div><\/div>';\n  const sel = host.querySelector('[data-r=sel]'), cv = host.querySelector('canvas'), cap = host.querySelector('[data-r=cap]'); let cur = 0, shown = -1;\n  function refresh() {\n    const rows = getRows();\n    if (!rows.length) { sel.innerHTML = ''; shown = -1; cv.style.display = 'none'; cap.textContent = 'Record at least one reading to see its ray diagram.'; return; }\n    cv.style.display = ''; cur = Math.min(cur, rows.length - 1);\n    if (shown !== rows.length) { sel.innerHTML = ''; rows.forEach((_, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Reading ' + (i + 1); b.addEventListener('click', () => { cur = i; refresh(); }); sel.appendChild(b); }); shown = rows.length; }\n    Array.prototype.forEach.call(sel.children, (b, i) => { b.className = 'btn sm' + (i === cur ? ' primary' : ''); });\n    const uv = rayUV(rows[cur]); drawRay(cv, uv.u, uv.v);\n    cap.innerHTML = 'Reading ' + (cur + 1) + ': u = <b>' + fmt(uv.u, 1) + ' cm<\/b>, v = <b>' + fmt(uv.v, 1) + ' cm<\/b>, so f = uv/(u + v) = <b>' + fmt(uv.u * uv.v / (uv.u + uv.v), 2) + ' cm<\/b> and the magnification is v/u = ' + fmt(uv.v / uv.u, 2) + '. The image is real and inverted.';\n  }\n  refresh(); return { refresh };\n}\nfunction statsCard(arr, unit, name) {\n  const n = arr.length;\n  if (n < 2) return '<div class=\"card\"><h3>Error analysis<\/h3><p style=\"margin:0\">Fill the ' + name + ' column of the observation table for at least two readings. The mean deviation and the standard error will then appear here.<\/p><\/div>';\n  const mean = arr.reduce((a, b) => a + b, 0) / n, dev = arr.map(x => Math.abs(x - mean)), md = dev.reduce((a, b) => a + b, 0) / n;\n  const sd = Math.sqrt(arr.reduce((a, x) => a + (x - mean) * (x - mean), 0) / (n - 1)), se = sd / Math.sqrt(n);\n  const rows = arr.map((x, i) => '<tr><td>' + (i + 1) + '<\/td><td>' + fmt(x, 2) + '<\/td><td>' + fmt(dev[i], 2) + '<\/td><\/tr>').join('');\n  return '<div class=\"card\"><h3>Error analysis of your ' + name + ' values<\/h3><div class=\"tw\"><table class=\"ob\" style=\"min-width:0\"><thead><tr><th>No.<\/th><th>' + name + ' (' + unit + ')<\/th><th>|' + name + ' − mean| (' + unit + ')<\/th><\/tr><\/thead><tbody>' + rows + '<\/tbody><\/table><\/div>'\n    + '<p style=\"margin:10px 0 4px\">Mean = <b>' + fmt(mean, 2) + ' ' + unit + '<\/b>. Mean deviation Δ' + name + ' = <b>' + fmt(md, 2) + ' ' + unit + '<\/b>, which is <b>' + fmt(md / Math.abs(mean) * 100, 1) + '%<\/b> of the mean.<\/p>'\n    + '<p style=\"margin:0 0 4px\">Standard deviation = ' + fmt(sd, 2) + ' ' + unit + '. Standard error of the mean = ' + fmt(se, 2) + ' ' + unit + '.<\/p>'\n    + '<p style=\"margin:0\">Quote your result as <b>' + name + ' = ' + fmt(mean, 2) + ' ± ' + fmt(md, 2) + ' ' + unit + '<\/b> (mean deviation, as school lab manuals do) or with ± ' + fmt(se, 2) + ' ' + unit + ' (standard error, as degree labs do).<\/p><\/div>';\n}\nfunction statsLine(arr, name) {\n  name = name || 'f'; const n = arr.length; if (n < 2) return '';\n  const mean = arr.reduce((a, b) => a + b, 0) / n, md = arr.reduce((a, x) => a + Math.abs(x - mean), 0) / n;\n  return '<b>Error analysis:<\/b> mean deviation Δ' + name + ' = ' + fmt(md, 2) + ' cm (' + fmt(md / Math.abs(mean) * 100, 1) + '% of the mean), so ' + name + ' = ' + fmt(mean, 2) + ' ± ' + fmt(md, 2) + ' cm.';\n}\n\n/* ======================================================\n   Router\n   ====================================================== */\nfunction render() { refreshNav(); const main = $('#main'); main.innerHTML = ''; const root = document.createElement('div'); main.appendChild(root); STEP_FNS[S.step](root, CS()); }\n$('#resetBtn').addEventListener('click', () => askConfirm('Reset the whole lab? All readings, graphs and results will be erased and new lenses will be given.', 'Reset lab', () => { S = newState(); save(); render(); window.scrollTo(0, 0); }));\nwindow.__lab = { S: () => S, CS, bestScreen: () => bestScreen(CS()), setStep: n => { S.step = n; render(); }, setExp: (e, id) => { S.exp = e; if (id) S.sub[e] = id; S.step = 1; render(); }, rerender: render, imaging: () => imaging(CS()), graphGeom: { PW, PH, SQ, OX, OY } };\nrender();\n})();\n<\/script>\n<\/body>\n<\/html>\n","errors":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: Error analysis<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F1F6F6; --surface:#FFFFFF; --ink:#10242E; --muted:#4A6068; --line:#CBDADC; --soft:#E1F0F0;\n  --accent:#0A7C8A; --ok:#1B7F4A; --okbg:#E1F4E8; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6; --amber:#B9770E;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0A1A21; --surface:#10272F; --ink:#E6F1F2; --muted:#9DB6BB; --line:#274149; --soft:#14323B;\n    --accent:#5FD3DB; --ok:#52D08F; --okbg:#123626; --bad:#FF8A80; --badbg:#3A1E1B; --warn:#F5C451; --warnbg:#3A3015; --amber:#F2B84B; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.6rem,4vw,2.3rem)} h2{font-size:1.6rem} h3{font-size:1.15rem;margin-top:1.3em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\nsub,sup{line-height:0}\n.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}\n.top .in{max-width:1040px;margin:0 auto;padding:8px 16px}\n.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.title{font-family:var(--serif);font-size:1.05rem;font-weight:700}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}\n.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer}\n.steps button[aria-current=\"step\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.steps button[aria-current=\"step\"]{color:#0A1A21}}\n.steps button.done::after{content:\" ✓\";color:var(--ok)}\n.steps button[aria-current=\"step\"].done::after{color:inherit}\n.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}\n.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.95rem}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.btn.primary{color:#0A1A21}}\n.btn.sm{padding:3px 9px;font-size:.85rem}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 14px}\n.card h3{margin-top:0}\n.note{border-left:5px solid var(--accent);background:var(--soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:0 0 12px;max-width:74ch;font-size:.97rem}\n.teacher{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\n.teacher.good{border-color:var(--ok);background:var(--okbg)}\n.teacher.bad{border-color:var(--bad);background:var(--badbg)}\n.teacher b.who{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}\n.hidden{display:none !important}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.12rem}\n.fld{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}\n.fld input,.fld select,.fld textarea{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:150px}\n.fld textarea{width:100%;min-width:260px;max-width:620px;min-height:74px;resize:vertical}\n.fld input.ok{border-color:var(--ok);background:var(--okbg)} .fld input.bad{border-color:var(--bad);background:var(--badbg)}\n.chk{display:flex;gap:9px;align-items:flex-start;margin:4px 0;font-size:.96rem}\n.chk input{margin-top:5px}\n.tw{overflow-x:auto}\ntable.ob{border-collapse:collapse;font-size:.93rem;min-width:560px}\n.ob th,.ob td{border:1px solid var(--line);padding:4px 6px;text-align:center}\n.ob th{background:var(--soft);font-weight:600}\n.ob input{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-family:var(--mono);font-size:.9rem}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:6px;flex-wrap:wrap}\n.seg button{border:0;background:var(--bg);font-size:.88rem;padding:5px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.seg button[aria-pressed=\"true\"]{color:#0A1A21}}\n.chip{display:inline-block;font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted)}\n.chip.on{border-color:var(--ok);color:var(--ok);font-weight:600}\n.chip.warnc{border-color:var(--warn);color:var(--warn);font-weight:600}\n.kpi{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}\n.kpi div{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;min-width:120px}\n.kpi b{display:block;font-family:var(--serif);font-size:1.25rem}\n.kpi span{font-size:.82rem;color:var(--muted)}\n.cvwrap canvas{display:block;width:100%;max-width:720px;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}\n.modal-ov{position:fixed;inset:0;background:rgba(5,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}\n.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.4)}\n.modal p{margin:0 0 14px}\ndetails.how{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 14px;margin:0 0 14px}\ndetails.how summary{cursor:pointer;font-weight:600}\n@media (max-width:700px){.top{position:static}.wrap{padding:16px 12px 70px}.row{gap:8px 10px}}\n@media print{.top,.btn,.noprint{display:none !important} body{background:#fff;color:#000} .wrap{padding:0}}\n\n/* notebook-style tables */\ntable.ob{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.ob th,.ob td{border:0;border-bottom:1px solid #C6D6EC;padding:5px 8px}\n.ob th{background:transparent;font-family:var(--serif);color:var(--accent);border-bottom:2px solid var(--accent)}\n.ob td:first-child,.ob th:first-child{border-right:2px solid #E7B5B1}\n.ob input{border-width:0 0 1.5px;border-style:dashed;border-radius:0;background:transparent}\n.ob input:focus{background:var(--soft);outline-offset:0}\n@media (prefers-color-scheme: dark){.ob th,.ob td{border-bottom-color:#2A4452}.ob td:first-child,.ob th:first-child{border-right-color:#6A3B3B}}\n/* bench: darkroom in dark mode, scrollable at real size on phones */\n@media (prefers-color-scheme: dark){.benchwrap canvas{filter:brightness(.68) contrast(1.06)}}\n@media (max-width:760px){.benchwrap canvas{min-width:720px}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><div class=\"in\"><div class=\"row\"><span class=\"title\">Error analysis · put an honest ± on your focal length<\/span>\n<button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'exp1'},'*')\">Back to Lab 3<\/button>\n<button class=\"btn sm\" type=\"button\" onclick=\"parent.postMessage({go:'challenge'},'*')\">Go to the Challenge<\/button><\/div><\/div><\/div>\n<main class=\"wrap\">\n<h2>Error analysis workbench<\/h2>\n<p>A measurement without an uncertainty is only half a result. Here you turn the readings you took on the bench into <b>f ± Δf<\/b>: every reading gets an error bar, the line is fitted with weights, and the numbers tell you whether your errors are believable.<\/p>\n<details class=\"how\"><summary>How the numbers are worked out (short)<\/summary>\n<p style=\"margin-top:8px\">Each pointer reading has an uncertainty <i>a<\/i> (half the least count is usual). The screen has a larger one, because the image looks equally sharp over a small range <i>s<\/i> (the focusing uncertainty): ΔS = √(a² + s²).<\/p>\n<p>With u = L − O and v = S − L, and f = uv/(u+v):<\/p>\n<p class=\"eq\">Δf² = (f<sub>u<\/sub>ΔO)² + ((f<sub>u<\/sub> − f<sub>v<\/sub>)ΔL)² + (f<sub>v<\/sub>ΔS)², f<sub>u<\/sub> = v²/(u+v)², f<sub>v<\/sub> = u²/(u+v)²<\/p>\n<p>The lens reading L enters both u and v, so it is handled once, not twice. On the graph of 1/v against 1/u, the fitted line has intercept 1/f. The fit uses the “effective variance” method, so errors in both 1/u and 1/v count. For the displacement method, f = (D² − d²)/4D with its own propagation.<\/p><\/details>\n\n<div class=\"card\"><h3>1. Choose your data<\/h3>\n<div class=\"row\"><span class=\"seg\" id=\"meth\" role=\"group\" aria-label=\"Method\"><\/span><\/div>\n<div class=\"row\" id=\"srcrow\" style=\"margin-top:6px\"><\/div>\n<div id=\"srcnote\" class=\"note\" style=\"margin-top:10px\"><\/div><\/div>\n\n<div class=\"card\"><h3>2. Your reading uncertainties<\/h3>\n<div class=\"row\">\n<label class=\"fld\">Pointer reading ± (cm)<input id=\"ua\" inputmode=\"decimal\" value=\"0.05\"><\/label>\n<label class=\"fld\">Focusing range ± (cm)<input id=\"us\" inputmode=\"decimal\" value=\"0.3\"><\/label>\n<\/div>\n<p style=\"font-size:.93rem;color:var(--muted);margin-top:8px\">The scale is marked in mm, so ±0.05 cm is fair for a pointer you read carefully. For the focusing range, slide the screen until the image is just noticeably blurred on both sides, and take half that spread. Change the numbers and watch how the result changes.<\/p><\/div>\n\n<div class=\"card\"><h3>3. Readings and errors<\/h3>\n<div class=\"tw\"><table class=\"ob\" id=\"tbl\"><thead><\/thead><tbody><\/tbody><\/table><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"btn\" id=\"addrow\" type=\"button\">Add a row<\/button><button class=\"btn\" id=\"resetrows\" type=\"button\">Reload from the lab<\/button><\/div>\n<div id=\"msg\"><\/div><\/div>\n\n<div class=\"card\" id=\"resCard\"><h3>4. Results<\/h3><div class=\"kpi\" id=\"kpi\"><\/div><div id=\"verdict\"><\/div><\/div>\n<div class=\"card\" id=\"graphCard\"><h3>5. Graphs with error bars<\/h3>\n<div class=\"cvwrap\"><canvas id=\"cv1\" width=\"720\" height=\"420\" role=\"img\" aria-label=\"Graph with error bars\"><\/canvas><\/div>\n<div class=\"cvwrap\" style=\"margin-top:12px\"><canvas id=\"cv2\" width=\"720\" height=\"300\" role=\"img\" aria-label=\"Focal length for each reading with error bars\"><\/canvas><\/div>\n<p style=\"font-size:.9rem;color:var(--muted);margin-top:8px\" id=\"gcap\"><\/p><\/div>\n<div class=\"card\"><h3>6. Which reading limits you?<\/h3><div class=\"cvwrap\"><canvas id=\"cv3\" width=\"720\" height=\"170\" role=\"img\" aria-label=\"Error budget bar chart\"><\/canvas><\/div><p id=\"budget\" style=\"margin-top:8px\"><\/p><\/div>\n<div class=\"card noprint\"><h3>7. Keep this result<\/h3>\n<p>Save the result so the report, the Challenge and your mentor can use it.<\/p>\n<div class=\"row\"><button class=\"btn primary\" id=\"save\" type=\"button\">Save f ± Δf<\/button><span id=\"savemsg\"><\/span><\/div>\n<div id=\"saved\" style=\"margin-top:10px\"><\/div><\/div>\n<\/main>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst num = s => { const x = parseFloat(String(s).replace('−', '-').replace(',', '.')); return isFinite(x) ? x : NaN; };\nfunction fmt(n, d = 2) { if (!isFinite(n)) return '—'; let r = Math.round(n * 10 ** d) / 10 ** d; if (Object.is(r, -0)) r = 0; return String(r).replace('-', '−'); }\nfunction sig(n, d = 2) { if (!isFinite(n)) return '—'; if (n === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(n))); return fmt(n, Math.max(0, d - 1 - e)); }\nfunction ld(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }\nconst KEYR = 'optics_lab_errors_v1';\n\nlet method = 'uv', srcId = null, rows = [], ST = { a: 0.05, s: 0.3 }, last = null;\n\n/* ---------- sources ---------- */\nfunction sources(m) {\n  const out = [];\n  const e1 = ld('optics_lab_exp1_v1'), e1b = ld('optics_lab_exp1b_v1'), ch = ld('optics_lab_challenge_v1');\n  if (m === 'uv') {\n    ['A', 'B', 'C'].forEach(id => { const l = e1 && e1.lens && e1.lens[id]; out.push({ id: 'e1' + id, label: 'Lab 3 · Lens ' + id, rows: l ? l.rows.map(r => ({ O: r.O, L: r.L, S: r.S })) : [] }); });\n    [['X', 'Challenge · lens X'], ['Y', 'Challenge · lens Y'], ['XY', 'Challenge · pair X+Y']].forEach(([k, lab]) => { const d = ch && ch.data && ch.data[k]; out.push({ id: 'ch' + k, label: lab, rows: d && d.uv ? d.uv.map(r => ({ O: r.O, L: r.L, S: r.S })) : [] }); });\n  } else {\n    ['A', 'B', 'C'].forEach(id => { const l = e1b && e1b.lens && e1b.lens[id]; out.push({ id: 'b' + id, label: 'Lab 4 · Lens ' + id, rows: l ? l.dis.rows.map(r => ({ O: r.O, S: r.S, L1: r.L1, L2: r.L2 })) : [] }); });\n    [['X', 'Challenge · lens X'], ['Y', 'Challenge · lens Y'], ['XY', 'Challenge · pair X+Y']].forEach(([k, lab]) => { const d = ch && ch.data && ch.data[k]; out.push({ id: 'cd' + k, label: lab, rows: d && d.dis ? d.dis.map(r => ({ O: r.O, S: r.S, L1: r.L1, L2: r.L2 })) : [] }); });\n  }\n  out.push({ id: 'manual', label: 'My own numbers', rows: [] });\n  return out;\n}\nfunction loadSource() {\n  const list = sources(method), s = list.find(x => x.id === srcId) || list.find(x => x.rows.length >= 3) || list[list.length - 1];\n  srcId = s.id; rows = s.rows.map(r => Object.assign({}, r));\n  if (s.id === 'manual' && !rows.length) rows = method === 'uv' ? [{ O: '', L: '', S: '' }, { O: '', L: '', S: '' }, { O: '', L: '', S: '' }, { O: '', L: '', S: '' }, { O: '', L: '', S: '' }] : [{ O: '', S: '', L1: '', L2: '' }, { O: '', S: '', L1: '', L2: '' }, { O: '', S: '', L1: '', L2: '' }, { O: '', S: '', L1: '', L2: '' }];\n  drawSrc();\n}\nfunction drawSrc() {\n  $('#meth').innerHTML = [['uv', 'u–v method'], ['dis', 'Displacement method']].map(([k, t]) => `<button type=\"button\" data-m=\"${k}\" aria-pressed=\"${k === method}\">${t}<\/button>`).join('');\n  $$('#meth button').forEach(b => b.addEventListener('click', () => { method = b.dataset.m; srcId = null; loadSource(); build(); }));\n  const list = sources(method);\n  $('#srcrow').innerHTML = list.map(s => `<button type=\"button\" class=\"btn sm\" data-s=\"${s.id}\" aria-pressed=\"${s.id === srcId}\" style=\"${s.id === srcId ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : ''}\">${s.label}${s.rows.length ? ' (' + s.rows.length + ')' : ''}<\/button>`).join('');\n  $$('#srcrow button').forEach(b => b.addEventListener('click', () => { srcId = b.dataset.s; loadSource(); build(); }));\n  const cur = list.find(x => x.id === srcId);\n  $('#srcnote').innerHTML = cur.id === 'manual' ? 'Type your own readings: in the u–v method the object, lens and screen pointer readings (cm); in the displacement method the object and screen readings and the two lens readings L<sub>1<\/sub>, L<sub>2<\/sub>.' : cur.rows.length ? `Using the ${cur.rows.length} reading${cur.rows.length > 1 ? 's' <\/div>`);\n  if (tr && Math.abs(tr.z) > 2.5) out.push(`<div class=\"teacher bad\"><b class=\"who\">Teacher’s remark<\/b>f is drifting steadily with ${method === 'uv' ? 'the object distance u' : 'D'} (trend ${fmt(tr.b, 3)} ± ${fmt(tr.sb, 3)} cm per cm, ${fmt(Math.abs(tr.z), 1)}σ). Random error does not do that. Suspect a <b>systematic error<\/b>: a pointer that is not exactly under the lens centre, or an offset between the object and screen scales. ${method === 'uv' ? 'Compare with the displacement method: it does not depend on where the lens pointer sits.' : ''}<\/div>`);\n  out.push(`<p style=\"font-size:.9rem;color:var(--muted)\">Check on the line: ${check}.<\/p>`);\n  ver.innerHTML = out.join('');\n  drawAll(P, fit, wm);\n  const sO = P.reduce((s, p) => s + p.cO ** 2, 0), sL = P.reduce((s, p) => s + p.cL ** 2, 0), sS = P.reduce((s, p) => s + p.cS ** 2, 0), tot = sO + sL + sS;\n  drawBudget(method === 'uv' ? [['Object reading', sO / tot], ['Lens reading', sL / tot], ['Screen focusing', sS / tot]] : [['Distance D (O and S readings)', sO / tot], ['Lens shift d (focusing at both positions)', sL / tot]]);\n  const big = method === 'uv' ? [['the object reading', sO], ['the lens reading', sL], ['focusing the screen', sS]].sort((x, y) => y[1] - x[1])[0] : (sL > sO ? ['focusing the lens at its two positions', sL] : ['the D readings', sO]);\n  $('#budget').innerHTML = `The biggest share of your uncertainty comes from <b>${big[0]}<\/b>. To shrink Δf, improve that first: taking more readings helps only the random part, while a better focusing judgement or a longer baseline helps everything.`;\n  renderSaved();\n}\n\n/* ---------- drawing ---------- */\nfunction nice(lo, hi, k = 6) { const span = hi - lo || 1, raw = span / k, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p, st = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; const a = Math.floor(lo / st) * st, b = Math.ceil(hi / st) * st, t = []; for (let v = a; v <= b + st / 2; v += st) t.push(+v.toFixed(10)); retur { $('#savemsg').textContent = ' Add at least 3 usable readings first.'; return; }\n  const list = sources(method), cur = list.find(x => x.id === srcId), s = ld(KEYR) || { v: 1, results: [] }, id = srcId;\n  s.results = s.results.filter(r => r.id !== id); s.results.push({ id, label: cur.label, method, f: last.f, df: last.df, n: last.n, red: last.red, how: last.how, t: new Date().toISOString() });\n  try { localStorage.setItem(KEYR, JSON.stringify(s)); $('#savemsg').textContent = ' Saved.'; } catch (e) { $('#savemsg').textContent = ' Could not save in this browser.'; }\n  renderSaved();\n});\n$('#addrow').addEventListener('click', () => { rows.push(method === 'uv' ? { O: '', L: '', S: '' } : { O: '', S: '', L1: '', L2: '' }); build(); });\n$('#resetrows').addEventListener('click', () => { loadSource(); build(); });\n['ua', 'us'].forEach(id => $('#' + id).addEventListener('input', update));\nwindow.addEventListener('resize', () => update());\nloadSource(); build(); renderSaved();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n","challenge":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: The Challenge<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F1F6F6; --surface:#FFFFFF; --ink:#10242E; --muted:#4A6068; --line:#CBDADC; --soft:#E1F0F0;\n  --accent:#0A7C8A; --ok:#1B7F4A; --okbg:#E1F4E8; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6; --amber:#B9770E;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0A1A21; --surface:#10272F; --ink:#E6F1F2; --muted:#9DB6BB; --line:#274149; --soft:#14323B;\n    --accent:#5FD3DB; --ok:#52D08F; --okbg:#123626; --bad:#FF8A80; --badbg:#3A1E1B; -- && predOk(); if (i === 5) return reach(4) && benchOk(); if (i === 6) return reach(5) && explOk(); return reach(6) && resOk(); }\nfunction doneFlags() { return [true, planOk(), predOk(), benchOk(), explOk(), resOk(), S.submitted]; }\nfunction refreshNav() {\n  const d = doneFlags(); $('#kitchip').textContent = 'Kit ' + S.kit;\n  $('#steps').innerHTML = STEPS.map((s, i) => { const ok = reach(i + 1); return `<button type=\"button\" data-i=\"${i + 1}\" class=\"${d[i] ? 'done' : ''}\" ${S.step === i + 1 ? 'aria-current=\"step\"' : ''} ${ok ? '' : 'disabled title=\"Finish the earlier steps first\"'} style=\"${ok ? '' : 'opacity:.5;cursor:not-allowed'}\">${i + 1}. ${s}<\/button>`; }).join('');\n  $$('#steps button').forEach(b => b.addEventListener('click', () => { if (!reach(+b.dataset.i)) return; S.step = +b.dataset.i; save(); render(); window.scrollTo(0, 0); }));\n}\nfunction nextBtn(root, label, can, why) {\n  const d = document.createElement('div'); d.className = 'row noprint'; d.style.marginTop = '16px';\n  d.innerHTML = `${S.step > 1 ? '<button class=\"btn\" type=\"button\" data-n=\"-1\">Back<\/button>' : ''}${S.step < STEPS.length ? `<button class=\"btn primary\" type=\"button\" data-n=\"1\" ${can === false ? 'disabled' : ''}>${label || 'Next step'}<\/button>` : ''}${can === false && why ? `<span style=\"font-size:.9rem;color:var(--muted)\">${why}<\/span>` : ''}`;\n  $$('button', d).forEach(b => b.addEventListener('click', () => { S.step += +b.dataset.n; save(); render(); window.scrollTo(0, 0); }));\n  root.appendChild(d);\n}\nfunction radios(name, opts, val) { return opts.map(([v, t]) => `<label class=\"opt\"><input type=\"radio\" name=\"${name}\" value=\"${v}\" ${val === v ? 'checked' : ''}><span>${t}<\/span><\/label>`).join(''); }\nfunction askConfirm(msg, label, fn) {\n  const o = document.createElement('div'); o.className = 'modal-ov'; o.innerHTML = `<div class=\"modal\" role=\"dialog\" aria-modal=\"true\"><p>${msg}<\/p><div class=\"row\"><button class=\"btn\" ine, steepest and flattest lines)\n   ====================================================== */\nconst PW = 510, PH = 540, SQ = 30, OX = 45, OY = PH - 45, XR = 15, YR = 16;\nconst SCALES = []; [-4, -3, -2, -1, 0, 1, 2, 3].forEach(k => [1, 2, 2.5, 5].forEach(m => SCALES.push(+(m * 10 ** k).toPrecision(6))));\nconst toP = (g, x, y) => [OX + x / g.xs * SQ, OY - y / g.ys * SQ];\nconst toD = (g, px, py) => [(px - OX) / SQ * g.xs, (OY - py) / SQ * g.ys];\nfunction gdata(sys, kind) {\n  const d = S.data[sys];\n  if (kind === 'uv') return d.uv.map(r => { const O = num(r.O), L = num(r.L), Sx = num(r.S), u = L - O, v = Sx - L; return [1 / u, 1 / v]; }).filter(p => p.every(isFinite) && p[0] > 0 && p[1] > 0);\n  return d.dis.map(r => { const D = num(r.S) - num(r.O), dd = Math.abs(num(r.L2) - num(r.L1)); return [4 * D, D * D - dd * dd]; }).filter(p => p.every(isFinite) && p[0] > 0);\n}\nfunction lsl(pts) { const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0), sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0), m = (n * sxy - sx * sy) / (n * sxx - sx * sx), c = (sy - m * sx) / n; return { m, c }; }\nconst LC = { best: ['#0A7C8A', 'Best-fit line'], hi: ['#D9730D', 'Steepest line'], lo: ['#7B3FA0', 'Flattest line'] };\nfunction drawPaper(ctx, g, opts) {\n  ctx.clearRect(0, 0, PW, PH); ctx.fillStyle = '#FFFDF7'; ctx.fillRect(0, 0, PW, PH);\n  const line = (c, w, st) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); for (let x = OX % st; x <= PW; x += st) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, PH); } for (let y = OY % st; y <= PH; y += st) { ctx.moveTo(0, y + .5); ctx.lineTo(PW, y + .5); } ctx.stroke(); };\n  line('#F4DAD3', 1, 3); line('#EBBFB4', 1, 15); line('#D98F81', 1.2, SQ);\n  const xs = parseFloat(g.xs), ys = parseFloat(g.ys), ok = xs > 0 && ys > 0;\n  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(OX, OY); ctx.lineTo(OX + XR * SQ + 20, OY); c
