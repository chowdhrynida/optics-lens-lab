<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combination of Lenses: theory and virtual lab</title>
<style>
:root{color-scheme:light dark;--bg:#F1F6F6;--surface:#FFFFFF;--ink:#10242E;--muted:#4A6068;--line:#CBDADC;--soft:#E1F0F0;--accent:#0A7C8A;--ok:#1B7F4A;--okbg:#E1F4E8;--amber:#C07A00;--p-learn:#0A7C8A;--p-practise:#2D6CB5;--p-think:#B35A06;--p-review:#7A4EA6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0A1A21;--surface:#10272F;--ink:#E6F1F2;--muted:#9DB6BB;--line:#274149;--soft:#14323B;--accent:#5FD3DB;--ok:#52D08F;--okbg:#123626;--amber:#F2B84B;--p-learn:#5FD3DB;--p-practise:#7DB2F0;--p-think:#F2A65A;--p-review:#B79BE0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
.bar{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg)}
.bar .in{max-width:1240px;margin:0 auto;padding:8px 14px 0}
.bar .hd{display:flex;align-items:baseline;gap:10px 18px;flex-wrap:wrap}
.bar h1{font-family:var(--serif);font-size:1.15rem;margin:0}
.bar h1 button{all:unset;cursor:pointer}
.bar h1 button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.hint{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 0;margin-top:2px;scrollbar-width:thin}
.tab[data-ph=learn]{--c:var(--p-learn)}.tab[data-ph=practise]{--c:var(--p-practise)}.tab[data-ph=think]{--c:var(--p-think)}.tab[data-ph=review]{--c:var(--p-review)}
.tab{--c:var(--accent);position:relative;flex:1 0 98px;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0 3px 8px;cursor:pointer;color:var(--ink);scroll-snap-align:center;font:inherit;border-radius:8px}
.tab .cap{height:16px;font-size:.74rem;color:var(--c);align-self:flex-start;white-space:nowrap;padding-left:2px;font-weight:600}
.tab::before{content:"";position:absolute;top:36px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.tab:first-child::before{display:none}
.tab::after{content:"";position:absolute;top:36px;left:-50%;width:100%;height:2px;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .7s ease .1s;z-index:0}
.tab:first-child::after{display:none}
.tab.lit::after{transform:scaleX(1)}
.node{position:relative;z-index:1;width:30px;height:40px;display:grid;place-items:center}
.node svg{position:absolute;inset:0;width:30px;height:40px;overflow:visible}
.node path{fill:var(--bg);stroke:var(--muted);stroke-width:1.6;transition:fill .15s}
.node b{position:relative;font-size:.8rem;font-variant-numeric:tabular-nums}
.tab:hover .node path{stroke:var(--c)}
.tab.part .node path{fill:var(--soft);stroke:var(--c)}
.tab.done .node path{fill:var(--okbg);stroke:var(--ok)}
.tab.done .node b{color:var(--ok)}
.tab[aria-selected="true"] .node path{fill:var(--c);stroke:var(--c)}
.tab[aria-selected="true"] .node b{color:#fff}
@media (prefers-color-scheme: dark){.tab[aria-selected="true"] .node b{color:#0A1A21}}
.tab .lbl{font-size:.82rem;font-weight:650;margin-top:3px;text-align:center;line-height:1.15}
.tab .sub{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.15;margin-top:1px}
.tab[aria-selected="true"] .lbl{color:var(--c)}
.tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--c)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-2px}
.frames{flex:1 1 auto;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
.frames .pan,.frames .prog{position:absolute;inset:0;overflow:auto;background:var(--bg)}
.frames .pan[hidden],.frames .prog[hidden]{display:none}
.prog .in{max-width:900px;margin:0 auto;padding:22px 16px 60px}
.prog h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 6px}
.prog h3{font-family:var(--serif);font-size:1.1rem;margin:22px 0 8px}
.prog p{margin:0 0 10px;color:var(--muted);max-width:68ch}
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--ok)}
.prow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin:0 0 6px}
.prow b{min-width:7.5em}
.chip{font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--muted)}
.chip.on{border-color:var(--ok);color:var(--ok);font-weight:600}
.prow .go,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 13px;cursor:pointer;font:inherit;font-size:.92rem}
.prow .go{margin-left:auto}
.prow .go:hover,.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
@media (prefers-color-scheme: dark){.btn.primary{color:#0A1A21}}
.nm{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:12px 0}
.nm label{display:flex;flex-direction:column;gap:3px;font-size:.9rem;color:var(--muted)}
.nm input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;width:min(280px,100%)}
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(24px,6vh,64px) 18px 40px;text-align:center}
.home h2{font-family:var(--serif);font-size:clamp(2.6rem,9vw,5.6rem);line-height:1.02;margin:0;letter-spacing:-.01em}
.home .by{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.6vw,1.4rem);color:var(--muted);margin:14px 0 0}
.home .by b{font-style:normal;color:var(--accent);font-weight:650}
.home .art{width:min(600px,92%);height:auto;margin:22px 0 8px;color:var(--ink)}
.home .sub2{max-width:58ch;color:var(--muted);margin:0 0 20px;line-height:1.55}
.home .start{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:650;padding:11px 26px;border-radius:10px;cursor:pointer}
@media (prefers-color-scheme: dark){.home .start{color:#0A1A21}}
.home .start:focus-visible,.cards button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.home .nm{justify-content:center}
.phase{width:min(1040px,100%);margin-top:30px;text-align:left}
.phase[data-ph=learn]{--c:var(--p-learn)}.phase[data-ph=practise]{--c:var(--p-practise)}.phase[data-ph=think]{--c:var(--p-think)}.phase[data-ph=review]{--c:var(--p-review)}
.phase h3{border-left:4px solid var(--c);padding-left:10px;font-family:var(--serif);font-size:1.05rem;margin:0 0 8px;color:var(--ink)}
.phase h3 span{font-family:var(--sans);font-weight:400;font-size:.88rem;color:var(--muted);margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cards button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;text-align:left}
.cards button:hover{border-color:var(--c)}.cards button b{color:var(--ink)}
.cards b{display:block;font-family:var(--serif);font-size:1.02rem;margin-bottom:3px}
.cards span{font-size:.88rem;color:var(--muted)}
.foot{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg);font-size:.85rem;color:var(--muted);padding:5px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.foot b{color:var(--ink);font-weight:650}
.foot .btn{padding:3px 12px;font-size:.88rem;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .btn[disabled]{opacity:.35;cursor:default}
.foot .mid{text-align:center;flex:1}
@media (max-width:700px){.bar .in{padding:6px 8px 0}.bar h1{font-size:1rem}.foot .mid .cr{display:none}.tab{flex-basis:92px}}
@media print{.bar,.foot{display:none}.frames .pan{position:static;overflow:visible}}

.home .ray{stroke-dasharray:1;stroke-dashoffset:1;animation:ray 1.5s ease-out forwards}
.home .ray:nth-child(2){animation-delay:.15s}.home .ray:nth-child(3){animation-delay:.3s}.home .ray:nth-child(4){animation-delay:.45s}
.home .fp{transform-box:fill-box;transform-origin:center;animation:fp 1.8s ease-in-out 1.5s 3}
@keyframes ray{to{stroke-dashoffset:0}}
@keyframes fp{50%{transform:scale(1.9);opacity:.55}}
@media (prefers-reduced-motion:reduce){.home .ray{animation:none;stroke-dashoffset:0}.home .fp{animation:none}.tab::after{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="hd"><h1><button id="homeBtn" type="button" title="Back to the start page">Combination of Lenses</button></h1><span class="hint" id="pos"></span></div>
  <nav class="tabs" role="tablist" aria-label="Steps of the lab"></nav>
</div></header>
<div class="frames" id="frames"></div>
<footer class="foot"><button class="btn" id="prev" type="button">← Home</button><span class="mid"><span class="cr">Combination of Lenses · Made by <b>Nida Chowdhury</b></span></span><button class="btn primary" id="next" type="button">Theory →</button></footer>

font-weight:700}\n@media (prefers-color-scheme: dark){.dots button[aria-current=\"step\"]{color:#0A1A21}}\n.dots button.done{border-color:var(--ok);color:var(--ok)}\n.wrap{max-width:900px;margin:0 auto;padding:30px 18px 80px}\n.kicker{font-size:.9rem;color:var(--muted);margin:0 0 4px}\n.narr p{font-size:1.06rem}\n.narr b{font-weight:650}\n.cvwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:6px 0 0}\n.cvwrap canvas{display:block}\n.ctrls{border:1px solid var(--line);border-top:0;background:var(--surface);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}\n.ctrls:empty{display:none}\n.ctrls label{display:flex;align-items:center;gap:8px;font-size:.95rem;flex-wrap:wrap}\n.ctrls input[type=range]{width:190px;accent-color:var(--accent)}\n.ctrls output{font-variant-numeric:tabular-nums;font-weight:650;min-width:3ch;display:inline-block}\n.ctrls .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}\n.seg button{border:0;background:var(--bg);font-size:.9rem;padding:5px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n@media (prefers-color-scheme: dark){.seg button[aria-pressed=\"true\"]{color:#0A1A21}}\n.readout{border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--surface);padding:10px 14px;font-size:.97rem;font-variant-numeric:tabular-nums}\n.readout:empty{display:none}\n.readout div+div{margin-top:3px}\n.readout .hl{font-weight:650}\n.tasks{margin:16px 0 0;max-width:68ch}\n.task{display:flex;gap:10px;align-items:flex-start;border-left:5px solid var(--accent);background:var(--soft);padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0}\n.task .tk{font-weight:800;color:var(--muted);flex:0 0 1.2em}\n.task.ok{border-color:var(--ok);background:var(--okbg)}\n.task.ok .tk{color:var(--ok)}\n.found{margin-top:10px;max-width:68ch}\n.found .f{border-left:5px solid var(--ok);background:var(--okbg);padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0}\n.found .f b.t{display:block;margin-bottom:2px}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.15rem}\n.hidden{display:none !important}\n.teaser{margin:22px 0 0;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted)}\n.teaser b{color:var(--ink)}\n.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}\n.btn{border:1px solid var(--line);background:var(--surface);padding:9px 18px;border-radius:8px;cursor:pointer}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.btn.primary{color:#0A1A21}}\n.btn[disabled]{opacity:.4;cursor:not-allowed}\n.recap{display:grid;gap:10px;margin:8px 0 18px;max-width:72ch}\n.recap button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer}\n.recap button:hover{border-color:var(--accent)}\n.recap b{display:block}\n.recap span{color:var(--muted);font-size:.95rem}\n@media (max-width:700px){.top .in{padding:6px 12px;gap:8px}.dots{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:3px}.dots button{flex:0 0 auto}.wrap{padding:20px 14px 70px}}\n/* notebook-style tables */\ntable.ob{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.ob th,.ob td{border:0;border-bottom:1px solid #C6D6EC;padding:5px 8px}\n.ob th{background:transparent;font-family:var(--serif);color:var(--accent);border-bottom:2px solid var(--accent)}\n.ob td:first-child,.ob th:first-child{border-right:2px solid #E7B5B1}\n.ob input{border-width:0 0 1.5px;border-style:dashed;border-radius:0;background:transparent}\n.ob input:focus{background 0], EDGE = Math.sqrt(R * R - (R - Tk / 2) ** 2);\n  const hit = (P, d, C, first) => { const ox = P[0] - C[0], oy = P[1] - C[1], b = ox * d[0] + oy * d[1], c = ox * ox + oy * oy - R * R, disc = b * b - c; if (disc < 0) return null; const q = Math.sqrt(disc); return first ? -b - q : -b + q; };\n  const refr = (d, N, eta) => { const ci = -(d[0] * N[0] + d[1] * N[1]), k = 1 - eta * eta * (1 - ci * ci); if (k < 0) return null; const a = eta * ci - Math.sqrt(k); return [eta * d[0] + a * N[0], eta * d[1] + a * N[1]]; };\n  function ray(h, n, xs, xe) {\n    let d = [1, 0]; const s1 = hit([xs, h], d, C1, true); if (s1 === null) return null;\n    const P1 = [xs + s1, h]; d = refr(d, [(P1[0] - C1[0]) / R, (P1[1] - C1[1]) / R], 1 / n); if (!d) return null;\n    const s2 = hit(P1, d, C2, false); if (s2 === null) return null;\n    const P2 = [P1[0] + s2 * d[0], P1[1] + s2 * d[1]]; d = refr(d, [-(P2[0] - C2[0]) / R, -(P2[1] - C2[1]) / R], n); if (!d) return null;\n    return { pts: [[xs, h], P1, P2, [xe, P2[1] + (xe - P2[0]) * d[1] / d[0]]], xc: Math.abs(d[1]) > 1e-9 ? P2[0] - P2[1] * d[0] / d[1] : null };\n  }\n  return { C1, C2, EDGE, ray };\n}\n\n/* ---------- canvas helpers ---------- */\nfunction createCanvas(host, W, H) {\n  const cv = document.createElement('canvas'), dpr = Math.min(window.devicePixelRatio || 1, 2);\n  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = '100%'; cv.style.maxWidth = W + 'px'; cv.style.minWidth = Math.min(W, 520) + 'px'; cv.style.height = 'auto'; host.appendChild(cv);\n  return { cv, ctx: cv.getContext('2d'), dpr, W, H };\n}\nfunction makeView(W, H, xmin, xmax, sy) { const sx = W / (xmax - xmin); return { W, H, sx, sy, xmin, xmax, X: x => (x - xmin) * sx, Y: y => H / 2 - y * sy }; }\nfunction pal() { return { ink: css('--ink'), muted: css('--muted'), grid: css('--grid'), a: css('--a'), b: css('--b'), c: css('--c'), img: css('--img'), bg: css('--surface') }; }\nfunction seg(ctx, v, x1, y1, x2, y2, color, w, dash) { ctx.beginPath(); ctx.setLineDash(dash || []); ctx.strokeStyle = color; ctx.lineWidth = w || 1.6; ctx.moveTo(v.X(x1), v.Y(y1)); ctx.lineTo(v.X(x2), v.Y(y2)); ctx.stroke(); ctx.setLineDash([]); }\nfunction poly(ctx, v, pts, color, w, dash) { ctx.beginPath(); ctx.setLineDash(dash || []); ctx.strokeStyle = color; ctx.lineWidth = w || 1.6; pts.forEach((p, i) => { i ? ctx.lineTo(v.X(p[0]), v.Y(p[1])) : ctx.moveTo(v.X(p[0]), v.Y(p[1])); }); ctx.stroke(); ctx.setLineDash([]); }\nfunction txt(ctx, s, x, y, color, size, align) { ctx.fillStyle = color; ctx.font = (size || 12) + 'px system-ui, sans-serif'; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y); }\nfunction dotAt(ctx, v, x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(v.X(x), v.Y(y), r || 4, 0, 6.3); ctx.fill(); }\nfunction gridBg(ctx, v, P) {\n  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, v.W, v.H); ctx.strokeStyle = P.grid; ctx.lineWidth = 1; ctx.beginPath();\n  const step = v.sx * 10;\n  for (let x = v.X(0) % step; x < v.W; x += step) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, v.H); }\n  for (let y = (v.H / 2) % step; y < v.H; y += step) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(v.W, Math.round(y) + .5); }\n  ctx.stroke();\n}\nfunction axisLine(ctx, v, P) { seg(ctx, v, v.xmin, 0, v.xmax, 0, P.ink, 1.4); }\nfunction tick(ctx, v, P, x, label, below) { const X = v.X(x); ctx.strokeStyle = P.ink; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(X, v.Y(0) - 5); ctx.lineTo(X, v.Y(0) + 5); ctx.stroke(); txt(ctx, label, X, v.Y(0) + (below ? 20 : -10), P.ink, 12, 'center'); }\nfunction lensSym(ctx, v, P, x, convex, halfPx, label, dx, tw) {\n  tw = tw || 1; const X = v.X(x) + (dx || 0), cy = v.H / 2, Y0 = cy - halfPx, Y1 = cy + halfPx;\n  ctx.save(); ctx.beginPath();\n  if (convex) { const b = 16 * tw; ctx.moveTo(X, Y0); ctx.quadraticCurveTo(X - 2 * b, cy, X, Y1); ctx.quadraticCurveTo(X + 2 * b, cy, X, Y0); }\n  else { const e = 14 * tw, c = 4 * tw; ctx.moveTo(X - e, Y0); ctx.lineTo(X + e, Y0); ctx.quadraticCurveTo(X + 2 * c - e, cy, X + e, Y1); ctx.lineTo(X - e, Y1); ctx.quadraticCurveTo(X - 2 * c + e, cy, X - e, Y0); }\n  ctx.closePath(); ctx.globalAlpha = .22; ctx.fillStyle = P.a; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();\n  ctx.strokeStyle = P.muted; ctx.lineWidth = 1; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(X, Y0 - 4); ctx.lineTo(X, Y1 + 4); ctx.stroke(); ctx.setLineDash([]);\n  if (label) txt(ctx, label, X, Y0 - 9, P.ink, 13, 'center');\n}\nfunction vArrow(ctx, v, x, y1, color, dash, label, up) {\n  const X = v.X(x), Ya = v.Y(0), Yb = v.Y(y1); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X, Ya); ctx.lineTo(X, Yb); ctx.stroke(); ctx.setLineDash([]);\n  if (Math.abs(Yb - Ya) > 6) { const dir = Yb < Ya ? -1 : 1; ctx.beginPath(); ctx.moveTo(X, Yb); ctx.lineTo(X - 6, Yb - dir * 11); ctx.lineTo(X + 6, Yb - dir * 11); ctx.closePath(); ctx.fill(); }\n  if (label) { ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, X, up ? Math.min(Ya, Yb) - 8 : Math.max(Ya, Yb) + 18); }\n}\n/* moving dots along a polyline: light \"travelling\" */\nfunction photons(ctx, pts, time, color, speed, gap) {\n  if (reduce) return;\n  speed = speed || 70; gap = gap || 46;\n  const L = []; let total = 0;\n  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(l); total += l; }\n  ctx.fillStyle = color; ctx.globalAlpha = .9;\n  for (let d = (time * speed) % gap; d < total; d += gap) {\n    let rem = d;\n    for (let i = 0; i < L.length; i++) { if (rem <= L[i]) { const t = L[i] ? rem / L[i] : 0; ctx.beginPath(); ctx.arc(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, 3.4, 0, 6.3); ctx.fill(); break; } rem -= L[i]; }\n  }\n  ctx.globalAlpha = 1;\n}\nfunction setRO(html) { const el = $('[data-r=ro]', $('#stage')); if (el._h !== html) { el.innerHTML = html; el._h = html; } }\nconst toPx = (v, pts) => pts.map(p => [v.X(p[0]), v.Y(p[1])]);\n\n/* ---------- UI builders ---------- */\nfunction slider(parent, o) {\n  const lab = document.createElement('label');\n  lab.innerHTML = `${o.label} <output><\/output>${o.unit ? ' ' + o.unit : ''} <input type=\"range\" min=\"${o.min}\" max=\"${o.max}\" step=\"${o.step}\" value=\"${o.value}\" aria-label=\"${o.aria || o.label.replace(/<[^>]+>/g, '')}\">`;\n  const inp = $('input', lab), out = $('output', lab); out.textContent = o.value;\n  inp.addEventListener('input', () => { out.textContent = inp.value; o.on(+inp.value); });\n  parent.appendChild(lab);\n  return { inp, set(v) { inp.value = v; out.textContent = v; }, el: lab };\n}\nfunction segment(parent, opts, value, on) {\n  const s = document.createElement('span'); s.className = 'seg';\n  opts.forEach(([val, label]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.dataset.v = val; b.addEventListener('click', () => { set(val); on(val); }); s.appendChild(b); });\n  function set(v) { $$('button', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); }\n  set(value); parent.appendChild(s); return { set, el: s };\n}\n\n/* ---------- scene frame ---------- */\nlet idx = 0, cur = null, raf = null, T = 0;\nfunction frame(o) {\n  const stage = $('#stage');\n  stage.innerHTML = `<article class=\"scene\"><p class=\"kicker\">Chapter ${idx + 1} of ${scenes.length}<\/p><h2>${o.title}<\/h2><div class=\"narr\">${o.narr}<\/div>\n    <div class=\"cvwrap\" data-r=\"cv\"><\/div><div class=\"ctrls\" data-r=\"ctrls\"><\/div><div class=\"readout\" data-r=\"ro\" aria-live=\"polite\"><\/div>\n    <div class=\"tasks\" data-r=\"tasks\"><\/div><div class=\"found\" data-r=\"found\" aria-live=\"polite\"><\/div>\n    ${o.teaser ? `<p class=\"teaser\"><b>Next question:<\/b> ${o.teaser}<\/p>` : ''}<\/article>`;\n  const f = { cv: $('[data-r=cv]', stage), ctrls: $('[data-r=ctrls]', stage), ro: $('[data-r=ro]', stage), tasks: $('[data-r=tasks]', stage), found: $('[data-r=found]', stage), solved: {} };\n  (o.tasks || []).forEach((t, i) => { const d = document.createElement('div'); d.className = 'task'; d.innerHTML = `<span class=\"tk\">○<\/span><span><b>Try this:<\/b> ${t.text}<\/span>`; f.tasks.appendChild(d); t.el = d; });\n  f.solve = i => {\n    const t = o.tasks[i]; if (f.solved[i]) return; f.solved[i] = true;\n    t.el.classList.add('ok'); $('.tk', t.el).textContent = '✓';\n    const d = document.createElement('div'); d.className = 'f'; d.innerHTML = `<b class=\"t\">${t.foundTitle}<\/b>${t.found}`; f.found.appendChild(d);\n    if (o.tasks.every((_, k) => f.solved[k])) markDone(idx);\n  };\n  if (!o.tasks || !o.tasks.length) markDone(idx);\n  return f;\n}\nconst doneSet = new Set();\nfunction markDone(i) { doneSet.add(i); renderDots(); }\n\n/* ======================================================\n   Chapter 1: light bends\n   ====================================================== */\nfunction ch1() {\n  const f = frame({\n    title: 'How does light bend?',\n    narr: '<p>Light travels in straight lines, until it meets a boundary between two transparent materials. Then its speed changes, and its path bends. This is <b>refraction<\/b>, and everything a lens does comes from it.<\/p><p>Below, a ray goes from air into glass. Change the angle and the glass and watch what the ray does.<\/p>',\n    tasks: [{ text: 'Keep the angle of incidence near 60° and find a glass that bends the ray by at least 28° (that is, i − r ≥ 28°).',\n      foundTitle: 'The glass matters.',\n      found: '<p>A larger refractive index n bends light more. The rule is <span class=\"eq\">sin i = n sin r<\/span> (Snell’s law). Remember that n matters: it comes back in the next chapter, when we shape the glass into a lens.<\/p>' }],\n    teaser: 'Bending depends on the angle at which the ray meets the surface. So what if the surface were <b>curved<\/b>, so that every ray met it at just the right angle?'\n  });\n  const { ctx, dpr } = createCanvas(f.cv, 760, 340);\n  const S = { i: 40, n: 1.5 };\n  const g = document.createElement('div'); g.className = 'grp'; f.ctrls.appendChild(g);\n  slider(f.ctrls, { label: 'Angle of incidence i', min: 0, max: 85, step: 1, value: S.i, unit: '°', on: v => { S.i = v; draw(); } });\n  slider(f.ctrls, { label: 'Refractive index of the glass n', min: 1, max: 2, step: 0.05, value: S.n, on: v => { S.n = v; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = P.bg; ctx.fillRect(0, 0, 760, 340);\n    ctx.fillStyle = P.a; ctx.globalAlpha = .13; ctx.fillRect(0, 170, 760, 170); ctx.globalAlpha = 1;\n    const Ox = 380, Oy = 170, L = 175, i = S.i * Math.PI / 180, r = Math.asin(Math.sin(i) / S.n);\n    ctx.strokeStyle = P.muted; ctx.lineWidth = 1.2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(Ox, 10); ctx.lineTo(Ox, 330); ctx.stroke(); ctx.setLineDash([]);\n    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, Oy); ctx.lineTo(760, Oy); ctx.stroke();\n    const A = [Ox - L * Math.sin(i), Oy - L * Math.cos(i)], B = [Ox + L * Math.sin(r), Oy + L * Math.cos(r)];\n    ctx.strokeStyle = P.a; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(Ox, Oy); ctx.stroke();\n    ctx.strokeStyle = P.b; ctx.beginPath(); ctx.moveTo(Ox, Oy); ctx.lineTo(B[0], B[1]); ctx.stroke();\n    ctx.globalAlpha = .25; ctx.strokeStyle = P.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(Ox, Oy); ctx.lineTo(Ox + L * Math.sin(i), Oy - L * Math.cos(i)); ctx.stroke(); ctx.globalAlpha = 1;\n    ctx.strokeStyle = P.a; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(Ox, Oy, 50, -Math.PI / 2 - i, -Math.PI / 2, false); ctx.stroke();\n    ctx.strokeStyle = P.b; ctx.beginPath(); ctx.arc(Ox, Oy, 50, Math.PI / 2 - r, Math.PI / 2, false); ctx.stroke();\n    txt(ctx, 'i', Ox - 62 * Math.sin(i / 2) - 4, Oy - 62 * Math.cos(i / 2), P.a, 15, 'center'); txt(ctx, 'r', Ox + 64 * Math.sin(r / 2), Oy + 64 * Math.cos(r / 2) + 6, P.b, 15, 'center');\n    txt(ctx, 'air, n = 1', 14, 28, P.muted, 14); txt(ctx, 'glass, n = ' + S.n.toFixed(2), 14, 330, P.muted, 14); txt(ctx, 'normal', Ox + 8, 24, P.muted, 12);\n    photons(ctx, [A, [Ox, Oy], B], T, P.ink, 90, 40);\n    setRO(`<div>i = <span class=\"hl\">${fmt(S.i, 0)}°<\/span>, r = <span class=\"hl\">${fmt(r * 180 / Math.PI, 1)}°<\/span>. The ray bends by <span class=\"hl\">${fmt(S.i - r * 180 / Math.PI, 1)}°<\/span> towards the normal.<\/div><div>sin i = ${fmt(Math.sin(i), 3)}, n sin r = ${fmt(S.n * Math.sin(r), 3)}<\/div>`);\n    if (Math.abs(S.i - 60) <= 3 && S.i - r * 180 / Math.PI >= 28) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 2: a lens is shaped glass\n   ====================================================== */\nfunction ch2() {\n  const f = frame({\n    title: 'How does a piece of glass aim light?',\n    narr: '<p>Take a thin slab of glass and give both faces a curve of radius R. A ray far from the middle meets the surface at a steeper angle, so it bends more. A ray through the middle meets the glass almost flat and barely bends. The result is the one we want: <b>parallel rays all meet at one point<\/b>, the focus.<\/p><p>Every ray below is traced exactly through the two curved faces with Snell’s law. Change R and n and see what happens to the focal length f.<\/p>',\n    tasks: [{ text: 'Make the lens focus the beam at about 20 cm (between 19 and 21 cm).',\n      foundTitle: 'Curvature and material set f.',\n      found: '<p>A more strongly curved face (smaller R) or a larger n gives a shorter focal length. For two faces with equal curvature, <span class=\"eq\">f = R / 2(n − 1)<\/span>. In general, <span class=\"eq\">1/f = (n − 1)(1/R<sub>1<\/sub> − 1/R<sub>2<\/sub>)<\/span>. One lens, one fixed f. Keep that in mind.<\/p>' }],\n    teaser: 'We now have a lens with focal length f. Where does it put the <b>image<\/b> of an object?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -35, 95, W / 130);\n  const S = { R: 30, n: 1.5 }, hs = [-3, -2, -1, 1, 2, 3];\n  slider(f.ctrls, { label: 'Radius of curvature R', min: 15, max: 50, step: 1, value: S.R, unit: 'cm', on: x => { S.R = x; draw(); } });\n  slider(f.ctrls, { label: 'Refractive index n', min: 1.3, max: 1.9, step: 0.05, value: S.n, on: x => { S.n = x; draw(); } });\n  function draw() {\n    const P = pal(), L = thickLens(S.R, 2); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    const par = L.ray(0.2, S.n, -35, 95), fm = par ? par.xc : null;\n    hs.forEach(h => { const r = L.ray(h, S.n, -35, 95); if (r) { poly(ctx, v, r.pts, P.a, 1.5); photons(ctx, toPx(v, r.pts), T, P.a, 80, 52); } });\n    ctx.restore();\n    ctx.beginPath(); const N = 40;\n    for (let k = 0; k <= N; k++) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C1[0] - Math.sqrt(S.R * S.R - y * y); k ? ctx.lineTo(v.X(x), v.Y(y)) : ctx.moveTo(v.X(x), v.Y(y)); }\n    for (let k = N; k >= 0; k--) { const y = -L.EDGE + 2 * L.EDGE * k / N, x = L.C2[0] + Math.sqrt(S.R * S.R - y * y); ctx.lineTo(v.X(x), v.Y(y)); }\n    ctx.closePath(); ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = P.a; ctx.fill(); ctx.restore(); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke();\n    if (fm !== null && fm > 0 && fm < 95) { dotAt(ctx, v, fm, 0, P.img, 5); txt(ctx, 'focus', v.X(fm), v.Y(0) + 24, P.img, 13, 'center'); seg(ctx, v, 0, -9, fm, -9, P.muted, 1.2); txt(ctx, 'f = ' + fmt(fm) + ' cm', v.X(fm / 2), v.Y(-9) - 6, P.muted, 12, 'center'); }\n    const ft = S.R / (2 * (S.n - 1));\n    setRO(`<div>Measured focal length: <span class=\"hl\">${fm === null ? '—' : fmt(fm) + ' cm'}<\/span><\/div><div>Formula f = R in; };\n  cv.style.touchAction = matchMedia('(max-width:700px)').matches ? 'auto' : 'pan-y'; cv.style.cursor = 'ew-resize';\n  cv.addEventListener('pointerdown', e => { if (Math.abs(wx(e) + S.d) * v.sx < 40) { drag = true; cv.setPointerCapture(e.pointerId); } });\n  cv.addEventListener('pointermove', e => { if (drag) { S.d = clamp(Math.round(-wx(e)), 5, 95); sl.set(S.d); draw(); } });\n  cv.addEventListener('pointerup', () => { drag = false; }); cv.addEventListener('pointercancel', () => { drag = false; });\n  function draw() {\n    const P = pal(), d = S.d, u = -d, vv = imageDist(u, F), m = isFinite(vv) ? vv / u : Infinity;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    tick(ctx, v, P, -20, 'F'); tick(ctx, v, P, 20, 'F′'); tick(ctx, v, P, -40, '2F'); tick(ctx, v, P, 40, '2F′');\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    const lenses = [{ x: 0, f: F }], rays = [[0, P.a], [-h / d, P.b]]; if (Math.abs(d - F) > .05) rays.push([-h / (d - F), P.c]);\n    rays.forEach(([s, col]) => { const t = trace(-d, h, s, lenses, 100); poly(ctx, v, t.pts, col, 1.7); photons(ctx, toPx(v, t.pts), T, col, 80, 56); if (isFinite(vv) && vv < 0) seg(ctx, v, 0, t.pts[1][1], vv, m * h, col, 1.2, [5, 4]); });\n    vArrow(ctx, v, -d, h, P.ink, null, 'object', true);\n    if (isFinite(vv) && Math.abs(vv) < 120 && Math.abs(m * h) * 9 < H / 2 - 4) vArrow(ctx, v, vv, m * h, P.img, vv < 0 ? [5, 4] : null, 'image', m * h > 0);\n    ctx.restore(); lensSym(ctx, v, P, 0, true, 125, 'f = +20 cm');\n    setRO(isFinite(vv)\n      ? `<div>u = <span class=\"hl\">${fmt(u, 0)}<\/span> cm, v = <span class=\"hl\">${sgn(vv)}<\/span> cm, m = <span class=\"hl\">${sgn(m, 2)}<\/span><\/div><div>The image is ${vv > 0 ? 'real' : 'virtual'}, ${m < 0 ? 'inverted' : 'erect'} and ${Math.abs(m) > 1.03 ? 'magnified' : Math.abs(m) < .97 ? 'smaller' : 'the same size'}.<\/div>`\n      : `<div>The object is at F, so the rays leave parallel and the image is at infinity.<\/div>`);\n    if (isFinite(m) && Math.abs(m + 1) <= 0.06) f.solve(0);\n  }\n  return { draw };\n}\n\n/* ======================================================\n   Chapter 4: one lens is not enough\n   ====================================================== */\nfunction ch4() {\n  const f = frame({\n    title: 'Is one lens enough?',\n    narr: '<p>The three-ray picture is an idealisation: it assumes rays close to the axis. A real lens is a piece of glass with real curved faces, and wide beams misbehave.<\/p><p>Here every ray is traced exactly through a thick glass lens (n = 1.5, R = 30 cm). Make the beam wider.<\/p>',\n    tasks: [{ text: 'Widen the beam until the outer rays cross the axis more than 5 cm closer to the lens than the central rays.',\n      foundTitle: 'One lens has no single focus for a wide beam.',\n      found: '<p>This is <b>spherical aberration<\/b>: rays far from the axis are bent too strongly. A second effect, <b>chromatic aberration<\/b>, comes from the glass bending blue light more than red. And a single lens has only <b>one fixed focal length<\/b> and cannot give a very large magnification in a short length.<\/p><p>A second lens (convex and concave together, of different glasses) can cancel these errors, and it lets us change the effective focal length. But first we must learn how two lenses work together.<\/p>' }],\n    teaser: 'How does light behave when it meets a <b>second lens<\/b> after the first?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -55, 75, W / 130), L = thickLens(30, 6);\n  const S = { hm: 3 };\n  slider(f.ctrls, { label: 'Widest ray height', min: 2, max: 12, step: 1, value: S.hm, unit: 'cm', on: x => { S.hm = x; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    for (let h = -S.hm; h <= S.hm + 1e-9; h += 1) { ub>1<\/sub> has f<sub>1<\/sub> = +20 cm and the object is 60 cm in front of it.<\/p>',\n    tasks: [{ text: 'In step 2, slide L₂ closer to L₁ than the image I₁ (so that d is less than v₁).',\n      foundTitle: 'A virtual object.',\n      found: '<p>L<sub>2<\/sub> now catches the rays <i>before<\/i> they meet, so I<sub>1<\/sub> lies behind L<sub>2<\/sub>. It is a <b>virtual object<\/b> and its distance u<sub>2<\/sub> = v<sub>1<\/sub> − d is positive. The lens formula still works with that sign. The total magnification is <span class=\"eq\">m = m<sub>1<\/sub> × m<sub>2<\/sub><\/span>.<\/p>' }],\n    teaser: 'The sums are messy when the lenses are far apart. What if the lenses <b>touch<\/b>? Does it get simpler?'\n  });\n  const W = 760, H = 300, { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, -75, 175, 10), F1 = 20, U = 60, h = 2;\n  const S = { step: 1, d: 60, f2: 30 };\n  const grp = document.createElement('span'); grp.className = 'grp'; f.ctrls.appendChild(grp);\n  const stepSeg = segment(grp, [['1', 'Step 1: L₁ alone'], ['2', 'Step 2: add L₂']], '1', val => { S.step = +val; draw(); });\n  slider(f.ctrls, { label: 'Position of L₂ (d)', min: 5, max: 100, step: 1, value: S.d, unit: 'cm', on: x => { S.d = x; if (S.step === 1) { S.step = 2; stepSeg.set('2'); } draw(); } });\n  slider(f.ctrls, { label: 'f₂ of L₂', min: 15, max: 60, step: 5, value: S.f2, unit: 'cm', on: x => { S.f2 = x; draw(); } });\n  function draw() {\n    const P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    const two = S.step === 2, lenses = two ? [{ x: 0, f: F1 }, { x: S.d, f: S.f2 }] : [{ x: 0, f: F1 }];\n    const tA = trace(-U, h, 0, lenses, 175), tB = trace(-U, h, -h / U, lenses, 175);\n    const v1 = imageDist(-U, F1), m1 = v1 / -U, u2 = v1 - S.d;\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    [[tA, P.a], [tB, P.b]].forEach(([t, c]) => { poly(ctx, v, t.pts, c, 1.7); photons(ctx, toPx(v, t.pts), T, c, 80, 56); = 4;\n  const { ctx, dpr } = createCanvas(f.cv, W, H), v = makeView(W, H, XMIN, XMAX, 10);\n  const S = Object.assign({ t1: 'convex', m1: 20, t2: 'convex', m2: 30, d: 0 }, cfg.state);\n  const ctl = {};\n  if (cfg.types) {\n    const g1 = document.createElement('span'); g1.className = 'grp'; g1.innerHTML = '<b>L<sub>1<\/sub><\/b>'; f.ctrls.appendChild(g1);\n    ctl.s1 = segment(g1, [['convex', 'Convex'], ['concave', 'Concave']], S.t1, val => { S.t1 = val; draw(); });\n  }\n  if (cfg.f1) ctl.f1 = slider(f.ctrls, { label: '|f<sub>1<\/sub>|', min: 10, max: 60, step: 5, value: S.m1, unit: 'cm', aria: 'Focal length of lens 1', on: x => { S.m1 = x; draw(); } });\n  if (cfg.types) {\n    const g2 = document.createElement('span'); g2.className = 'grp'; g2.innerHTML = '<b>L<sub>2<\/sub><\/b>'; f.ctrls.appendChild(g2);\n    ctl.s2 = segment(g2, [['convex', 'Convex'], ['concave', 'Concave']], S.t2, val => { S.t2 = val; draw(); });\n  }\n  if (cfg.f2) ctl.f2 = slider(f.ctrls, { label: '|f<sub>2<\/sub>|', min: 10, max: 60, step: 5, value: S.m2, unit: 'cm', aria: 'Focal length of lens 2', on: x => { S.m2 = x; draw(); } });\n  if (cfg.d) ctl.d = slider(f.ctrls, { label: 'Separation d', min: 0, max: 120, step: 1, value: S.d, unit: 'cm', on: x => { S.d = x; draw(); } });\n  let chart = null;\n  if (cfg.chart) { const host = document.createElement('div'); host.className = 'cvwrap'; host.style.marginTop = '10px'; f.cv.parentNode.insertBefore(host, f.ctrls.nextSibling); chart = createCanvas(host, 760, 190); }\n\n  function geom() {\n    const f1 = S.t1 === 'convex' ? S.m1 : -S.m1, f2 = S.t2 === 'convex' ? S.m2 : -S.m2, d = S.d, lenses = [{ x: 0, f: f1 }, { x: d, f: f2 }];\n    const t1 = trace(XMIN, YB, 0, lenses, XMAX), t2 = trace(XMIN, -YB, 0, lenses, XMAX), e = t1.exit;\n    let xf = null, xH = null, Fm = null;\n    if (Math.abs(e.s) > 1e-9) { xf = e.x - e.y / e.s; xH = e.x + (YB - e.y) / e.s; Fm = xf - xH; }\n    return { f1, f2, d, t1, t2, e, xf, xH, F: Fm, slope: e.s };\n  }\n  function drawChart(g) {\n    if (!chart) return; const c = chart.ctx, P = pal(); c.setTransform(chart.dpr, 0, 0, chart.dpr, 0, 0);\n    c.fillStyle = P.bg; c.fillRect(0, 0, 760, 190);\n    const px0 = 56, px1 = 730, py0 = 20, py1 = 150, pw = px1 - px0, ph = py1 - py0, f1 = g.f1, f2 = g.f2;\n    const pw_ = d => { const t = trace(XMIN, YB, 0, [{ x: 0, f: f1 }, { x: d, f: f2 }], XMAX); return -t.exit.s / YB; };\n    const pts = []; let lo = 1e9, hi = -1e9; for (let d = 0; d <= 120; d += 2) { const p = pw_(d); pts.push([d, p]); lo = Math.min(lo, p); hi = Math.max(hi, p); }\n    lo = Math.min(lo, 0) - 0.005; hi = Math.max(hi, 0) + 0.005;\n    const X = d => px0 + d / 120 * pw, Y = p => py1 - (p - lo) / (hi - lo) * ph;\n    c.strokeStyle = P.grid; c.lineWidth = 1; c.beginPath(); for (let d = 0; d <= 120; d += 20) { c.moveTo(X(d), py0); c.lineTo(X(d), py1); } c.stroke();\n    c.strokeStyle = P.muted; c.lineWidth = 1.2; c.beginPath(); c.moveTo(px0, Y(0)); c.lineTo(px1, Y(0)); c.stroke();\n    c.strokeStyle = P.a; c.lineWidth = 2.4; c.beginPath(); pts.forEach((p, i) => { i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])); }); c.stroke();\n    const pc = pw_(g.d); c.fillStyle = P.img; c.beginPath(); c.arc(X(g.d), Y(pc), 6, 0, 6.3); c.fill();\n    c.fillStyle = P.ink; c.font = '12px system-ui, sans-serif'; c.textAlign = 'center'; for (let d = 0; d <= 120; d += 20) c.fillText(d + '', X(d), py1 + 16);\n    c.fillText('separation d (cm)', (px0 + px1) / 2, py1 + 34); c.textAlign = 'left'; c.fillStyle = P.muted; c.fillText('1/F  (1 per cm)', 6, 14);\n    c.textAlign = 'right'; c.fillText('0', px0 - 6, Y(0) + 4);\n  }\n  function draw() {\n    const g = geom(), P = pal(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); gridBg(ctx, v, P); axisLine(ctx, v, P);\n    tick(ctx, v, P, -Math.abs(g.f1), 'F₁', true); tick(ctx, v, P, Math.abs(g.f1), 'F₁′', true); tick(ctx, v, P, g.d - Math.abs(g.f2), 'F₂', false); tick(ctx, v, P, g.d + Math.abs(g.f2), 'F₂′', false);\n    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();\n    [[g.t1, P.a], [g.t2, P.b]].forEach(([t, c]) => { poly(ctx, v, t.pts, c, 1.8); photons(ctx, toPx(v, t.pts), T, c, 80, 52); });\n    if (g.xf !== null) {\n      const real = g.xf >= g.d - 1e-6;\n      if (!real) { seg(ctx, v, g.d, g.e.y, g.xf, 0, P.a, 1.2, [5, 4]); seg(ctx, v, g.d, g.t2.exit.y, g.xf, 0, P.b, 1.2, [5, 4]); }\n      if (g.xf > XMIN && g.xf < XMAX) { dotAt(ctx, v, g.xf, 0, P.img, 5); txt(ctx, real ? 'focus' : 'virtual focus', v.X(g.xf), v.Y(0) + 34, P.img, 13, 'center'); }\n      if (cfg.showH) {\n        if (g.xH < g.d - 1e-6) seg(ctx, v, g.d, g.e.y, g.xH, YB, P.a, 1.1, [2, 3]);\n        seg(ctx, v, g.xH, -12, g.xH, 12, P.muted, 1.4, [4, 4]); txt(ctx, 'H′', v.X(g.xH), v.Y(12) - 6, P.muted, 13, 'center');\n        seg(ctx, v, g.xH, -10, g.xf, -10, P.muted, 1.3); txt(ctx, 'F = ' + fmt(g.F) + ' cm', v.X((g.xH + g.xf) / 2), v.Y(-10) - 6, P.muted, 12, 'center');\n      }\n    } else txt(ctx, 'The beam leaves parallel', W - 14, 22, P.muted, 13, 'right');\n    ctx.restore();\n    if (g.d < 0.5) { lensSym(ctx, v, P, 0, g.f1 > 0, 110, 'L₁', -9, .55); lensSym(ctx, v, P, 0, g.f2 > 0, 110, 'L₂', 9, .55); }\n    else { lensSym(ctx, v, P, 0, g.f1 > 0, 110, 'L₁', 0, .55); lensSym(ctx, v, P, g.d, g.f2 > 0, 110, 'L₂', 0, .55); }\n    txt(ctx, 'parallel beam from a far-away object →', 14, H - 10, P.muted, 12);\n    drawChart(g);\n    let html;\n    if (g.xf === null) html = `<div>The beam leaves <span class=\"hl\">parallel<\/span>. Its width changes by a factor of <span class=\"hl\">${fmt(Math.abs(g.e.y / YB), 2)}<\/span>.<\/div>`;\n    else html = `<div>Measured from the rays: <span class=\"hl\">F = ${sgn(g.F)} cm<\/span> (from H′), back focal length ${sgn(g.xf - g.d)} cm from L₂. The pair is ${g.F > 0 ? 'converging' : 'diverging'}.<\/div>`;\n    if (cfg.powers) { const p1 = 100 / g.f1, p2 = 100 / g.f2; html += `<div>Powers: P₁ = ${sgn(p1, 2)} D, P₂ = ${sgn(p2, 2)} D, P₁ + P₂ = ${sgn(p1 + p2, 2)} D. Measured 1/F = ${g.F === null ? '0' : sgn(100 / g.F, 2)} D.<\/div>`; }\n    setRO(html);\n    cfg.onUpdate && cfg.onUpdate(g, S);\n  }\n  return { draw };\n}\n\nfunction ch6() {\n  const f = frame({\n    title: 'What if the two lenses touch?',\n    narr: '<p>Put two lenses in contact and send in a beam of parallel light, as if from a very distant object. The beam focuses at some point, and the distance from the lenses to that point is the focal length F of the <b>pair<\/b>. The diagram measures F directly from the rays. It does not use any formula.<\/p><p>Change the two lenses and compare the numbers. The panel also lists each lens’s <b>power<\/b>, P = 1/f, in dioptres (f in metres).<\/p>',\n    tasks: [{ text: 'Choose the two lenses so that the pair focuses the beam at exactly 10 cm (F between 9.2 and 10.8 cm).',\n      foundTitle: 'Powers add.',\n      found: '<p>Two +20 cm lenses (P = +5 D each) give a pair with F = 10 cm (P = +10 D). In general, for lenses in contact, <span class=\"eq\">P = P<sub>1<\/sub> + P<sub>2<\/sub><\/span>, which means <span class=\"eq\">1/F = 1/f<sub>1<\/sub> + 1/f<sub>2<\/sub><\/span>. A concave lens has negative power, so it subtracts.<\/p>' }],\n    teaser: 'Touching lenses just add their powers. What happens if we <b>pull them apart<\/b>?'\n  });\n  const bb = beamBench(f, { types: true, f1: true, f2: true, d: false, powers: true, state: { m1: 20, m2: 30, d: 0 },\n    onUpdate: g => { if (g.d < 0.5 && g.F !== null && g.F >= 9.2 && g.F <= 10.8) f.solve(0); } });\n  return { draw: bb.draw };\n}\n\nfunction ch7() {\n  const f = frame({\n    title: 'What if we pull them apart?',\n    narr: '<p>Keep two convex lenses, f<sub>1<\/sub> = +20 cm and f<sub>2<\/sub> = +30 cm, and slide L<sub>2<\/sub> away. The focal length of the pair is measured from the rays, from the dotted plane H′ (the <b>principal plane<\/b> where the incoming ray and the outgoing ray, extended, cross).<\/p><p>The chart below plots 1/F, the strength of the pair, against the separation d. The orange dot shows where you are now.<\/p>',\n    tasks: [{ text: 'Find the separation d at which the pair’s focal length is 15 cm (between 14.4 and 15.6).',\n      foundTitle: 'The strength falls in a straight line as d grows.',\n      found: '<p>At d = 10 cm, F = 15 cm. The line on the chart has a simple rule: <span class=\"eq\">1/F = 1/f<sub>1<\/sub> + 1/f<sub>2<\/sub> − d/(f<sub>1<\/sub>f<sub>2<\/sub>)<\/span>. At d = 0 it reduces to the contact rule. Changing d changes F, which is exactly how a zoom lens changes its focal length.<\/p>' }],\n    teaser: 'Look at the chart: the line crosses <b>zero<\/b> at some d. What does a pair with no strength do to light?'\n  });\n  const bb = beamBench(f, { types: false, f1: false, f2: false, d: true, showH: true, chart: true, state: { t1: 'convex', m1: 20, t2: 'convex', m2: 30, d: 0 },\n    onUpdate: g => { if (g.F !== null && g.F >= 14.4 && g.F <= 15.6) f.solve(0); } });\n  return { draw: bb.draw };\n}\n\nfunction ch8() {\n  const f = frame({\n    title: 'Are there special distances?',\n    narr: '<p>Yes. The chart in the last chapter crossed zero. Where the strength of the pair is zero, F is infinite: a parallel beam goes in and a <b>parallel beam comes out<\/b>. Two ways to reach it are below. Play with all the controls.<\/p>',\n    tasks: [\n      { text: 'Make the beam leave parallel while the lenses are apart (d bigger than 1 cm). Try two convex lenses first.',\n        foundTitle: 'The afocal pair.',\n        found: '<p>For two convex lenses, the beam leaves parallel when <span class=\"eq\">d = f<sub>1<\/sub> + f<sub>2<\/sub><\/span>: L<sub>1<\/sub>’s focus coincides with L<sub>2<\/sub>’s focus. The beam’s width changes by the ratio f<sub>2<\/sub>/f<sub>1<\/sub>. This is the astronomical telescope and the laser beam expander. With a concave L<sub>2<\/sub>, the same idea with d = f<sub>1<\/sub> − |f<sub>2<\/sub>| gives the Galilean telescope.<\/p>' },\n      { text: 'Make the two lenses cancel each other: touching (d = 0), a convex and a concave lens of the same |f|, so the beam passes unbent.',\n        foundTitle: 'Opposite lenses cancel.',\n        found: '<p>With P<sub>1<\/sub> = +P and P<sub>2<\/sub> = −P, the powers add to zero: <span class=\"eq\">P = P<sub>1<\/sub> + P<sub>2<\/sub> = 0<\/span>. The pair is like a plain sheet of glass. Real combinations use partial cancellation: a convex and a concave lens of different glasses together cancel colour errors (the achromatic doublet) while the pair still converges.<\/p>' }\n    ],\n    teaser: 'You now have every piece. Let’s <b>put the whole story together<\/b>.'\n  });\n  const bb = beamBench(f, { types: true, f1: true, f2: true, d: true, showH: true, powers: true, state: { t1: 'convex', m1: 30, t2: 'convex', m2: 20, d: 20 },\n    onUpdate: (g, S) => {\n      if (g.d > 1 && Math.abs(g.slope) < 0.004) f.solve(0);\n      if (g.d < 0.5 && S.t1 !== S.t2 && Math.abs(g.slope) < 0.004) f.solve(1);\n    } });\n  return { draw: bb.draw };\n}\n\n/* ======================================================\n   Chapter 9: recap\n   ====================================================== */\nfunction ch9() {\n  const f = frame({\n    title: 'The whole story in one page',\n    narr: '<p>Here is the thread from start to finish. Each line is something you saw yourself. Tap a line to go back to that chapter.<\/p>'\n  });\n  const items = [\n    ['Light bends when it enters glass.', 'sin i = n sin r. A larger n bends more.', 0],\n    ['Curved glass aims the bending: a lens.', '1/f = (n − 1)(1/R₁ − 1/R₂)', 1],\n    ['One lens forms an image.', '1/v − 1/u = 1/f, m = v/u', 2],\n    ['One lens is not enough.', 'Aberrations; one fixed f; limited magnification.', 3],\n    ['Two lenses form a chain.', 'I₁ is the object for L₂, and m = m₁ × m₂.', 4],\n    ['Lenses in contact: powers add.', 'P = P₁ + P₂, so 1/F = 1/f₁ + 1/f₂', 5],\n    ['Pull them apart: F changes with d.', '1/F = 1/f₁ + 1/f₂ − d/(f₁f₂)', 6],\n    ['Special distances.', 'd = f₁ + f₂ gives an afocal pair; opposite lenses can cancel.', 7]\n  ];\n  const box = document.createElement('div'); box.className = 'recap';\n  items.forEach(([a, b, k]) => { const bt = document.createElement('button'); bt.type = 'button'; bt.innerHTML = `<b>${k + 1}. ${a}<\/b><span>${b}<\/span>`; bt.addEventListener('click', () => go(k)); box.appendChild(bt); });\n  f.found.appendChild(box);\n  const p = document.createElement('p'); p.innerHTML = '<b>What comes next:<\/b> in the lab you will measure the focal length of a lens combination yourself, and compare it with these formulas.'; f.found.appendChild(p);\n  const lab = document.createElement('button'); lab.type = 'button'; lab.className = 'btn primary'; lab.textContent = 'Go to the lab: Experiment 1'; lab.style.marginRight = '10px'; lab.addEventListener('click', () => parent.postMessage({ go: 'exp1' }, '*')); f.found.appendChild(lab);\n  const r = document.createElement('button'); r.type = 'button'; r.className = 'btn'; r.textContent = 'Start the story again'; r.addEventListener('click', () => go(0)); f.found.appendChild(r);\n  return { draw() {} };\n}\n\n/* ======================================================\n   Navigation\n   ====================================================== */\nconst scenes = [ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8, ch9];\nfunction renderDots() {\n  $('#dots').innerHTML = scenes.map((_, i) => `<button type=\"button\" data-i=\"${i}\" class=\"${doneSet.has(i) && i !== idx ? 'done' : ''}\" ${i === idx ? 'aria-current=\"step\"' : ''} aria-label=\"Chapter ${i + 1}\">${i + 1}<\/button>`).join('');\n  $$('#dots button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));\n}\nfunction go(i) {\n  idx = clamp(i, 0, scenes.length - 1); cur = scenes[idx]();\n  $('#back').disabled = idx === 0; $('#next').textContent = idx === scenes.length - 1 ? 'Back to the start' : 'Next chapter'; $('#next').dataset.last = idx === scenes.length - 1;\n  renderDots(); cur.draw(); window.scrollTo(0, 0);\n}\n$('#back').addEventListener('click', () => go(idx - 1));\n$('#next').addEventListener('click', () => go(idx === scenes.length - 1 ? 0 : idx + 1));\ndocument.addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });\nfunction loop(ts) { T = ts / 1000; if (cur) cur.draw(); raf = requestAnimationFrame(loop); }\nif (!reduce) raf = requestAnimationFrame(loop);\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cur && cur.draw());\ngo(0);\n})();\n<\/script>\n<\/body>\n<\/html>\n","method":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Which method, and when?<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F1F6F6; --surface:#FFFFFF; --ink:#10242E; --muted:#4A6068; --line:#CBDADC; --soft:#E1F0F0;\n  --accent:#0A7C8A; --ok:#1B7F4A; --okbg:#E1F4E8; --warn:#8A5A00; --warnbg:#FFF3D6;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0A1A21; --surface:#10272F; --ink:#E6F1F2; --muted:#9DB6BB; --line:#274149; --soft:#14323B; --accent:#5FD3DB; --ok:#52D08F; --okbg:#123626; --warn:#F5C451; --warnbg:#3A3015; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.7rem,4.5vw,2.4rem)} h2{font-size:1.5rem;margin-top:1.8em} h3{font-size:1.1rem;margin-top:1.1em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\n.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}\n.lead{color:var(--muted);font-size:1.08rem;max-width:62ch}\n.goals{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}\n.goals button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}\n.goals button[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.goals button[aria-pressed=\"true\"]{color:#0A1A21}}\n.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px}\n.card.rec{border-color:var(--ok);box-shadow:0 0 0 2px var(--okbg)}\n.card h3{margin:0 0 4px;font-size:1.08rem}\n.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 9px;margin-right:6px;color:var(--muted)}\n.tag.ok{border-color:var(--ok);color:var(--ok);font-weight:650}\n.card dl{margin:8px 0 10px;font-size:.93rem}\n.card dt{font-weight:650;margin-top:5px}\n.card dd{margin:0;color:var(--muted)}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);color:var(--ink)}\n.go{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 12px;cursor:pointer;font-size:.9rem}\n.go:hover{border-color:var(--accent)}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;font-size:.92rem;width:100%;min-width:760px;background:var(--surface)}\nth,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}\nth{background:var(--soft)}\n.note{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\nul{max-width:72ch;padding-left:1.3em}\nli{margin-bottom:.4em}\n/* notebook-style tables */\ntable.ob{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.ob th,.ob td{border:0;border-bottom:1px solid #C6D6EC;padding:5px 8px}\n.ob th{background:transparent;font-family:var(--serif);color:var(--accent);border-bottom:2px solid var(--accent)}\n.ob td:first-child,.ob th:first-child{border-right:2px solid #E7B5B1}\n.ob input{border-width:0 0 1.5px;border-style:dashed;border-radius:0;background:transparent}\n.ob input:focus{background:var(--soft);outline-offset:0}\n@media (prefers-color-scheme: dark){.ob th,.ob td{border-bottom-color:#2A4452}.ob td:first-child,.ob th:first-child{border-right-color:#6A3B3B}}\n/* bench: darkroom in dark mode, scrollable at real size on phones */\n@media (prefers-color-scheme: dark){.benchwrap canvas{filter:brightness(.68) contrast(1.06)}}\n@media (max-width:760px){.benchwrap canvas{min-width:720px}}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n  <h1>Which method, and when?<\/h1>\n  <p class=\"lead\">Every experiment in this lab finds a focal length, but each uses a different method. The best choice depends on <b>what<\/b> you want to find and <b>which error<\/b> you most want to avoid. Pick your goal below.<\/p>\n\n  <h2 style=\"margin-top:1em\">1. Pick what you want to find<\/h2>\n  <div class=\"goals\" id=\"goals\" role=\"group\" aria-label=\"What do you want to find?\"><\/div>\n  <div class=\"cards\" id=\"cards\" aria-live=\"polite\"><\/div>\n\n  <h2>2. All the methods compared<\/h2>\n  <p>“Main error” says where the method is weakest. “Accuracy” is a rough guide for a bench of this kind: the order matters more than any single number.<\/p>\n  <div class=\"tw\"><table id=\"cmp\"><\/table><\/div>\n\n  <h2>3. Two sign conventions, one law<\/h2>\n  <p>The theory story uses the Cartesian convention. The labs use “real distances are positive”. They describe the same physics. Keep to one inside a single problem.<\/p>\n  <div class=\"tw\"><table>\n    <tr><th><\/th><th>Real distances positive (the labs)<\/th><th>Cartesian (the theory story)<\/th><\/tr>\n    <tr><td>Lens formula<\/td><td class=\"eq\">1/f = 1/u + 1/v<\/td><td class=\"eq\">1/v − 1/u = 1/f<\/td><\/tr>\n    <tr><td>Object distance<\/td><td>u is positive for a real object<\/td><td>u is negative for a real object<\/td><\/tr>\n    <tr><td>Image distance<\/td><td>v is positive for a real image<\/td><td>v is positive for a real image<\/td><\/tr>\n    <tr><td>Convex lens f<\/td><td>positive<\/td><td>positive<\/td><\/tr>\n    <tr><td>Concave lens f<\/td><td>negative<\/td><td>negative<\/td><\/tr>\n    <tr><td>Magnification<\/td><td class=\"eq\">m = I/O (the size, positive)<\/td><td class=\"eq\">m = v/u (negative if inverted)<\/td><\/tr>\n    <tr><td>Two lenses separated by d<\/td><td class=\"eq\">1/F = 1/f₁ + 1/f₂ − d/(f₁f₂)<\/td><td class=\"eq\">1/F = 1/f₁ + 1/f₂ − d/(f₁f₂)<\/td><\/tr>\n  <\/table><\/div>\n\n  <h2>4. Common claims, corrected<\/h2>\n  <ul>\n    <li><b>“The displacement method is error-free.”<\/b> No method is. The displacement method removes the error from the position of the lens pointer (it cancels in d), but you still judge two sharp images, and D still carries the pointer errors of the object and the screen.<\/li>\n    <li><b>“Combination of lenses is a separate method.”<\/b> It is a <i>set-up<\/i>, not a method. You can apply the u–v, displacement, magnification or distant-object method to a pair of lenses. What changes is the theory behind it.<\/li>\n    <li><b>“I can measure u and v from the lenses for any lens system.”<\/b> For two lenses in contact, this is a good approximation. For lenses separated by d, u and v belong to the <i>principal planes<\/i>, which lie a few centimetres away from the lenses. Measuring from the lenses gives a systematic error. The <b>method of magnification<\/b> avoids it: the slope gives F, and the intercepts tell you where the planes are.<\/li>\n    <li><b>“A graph removes all errors.”<\/b> A graph averages out <i>random<\/i> scatter and shows a bad point at once. It cannot remove a <i>systematic<\/i> error such as an index error.<\/li>\n    <li><b>“The formula needs a thin lens.”<\/b> Yes, and that is another reason to prefer methods that find F directly (like the magnification method) when the lens is thick.<\/li>\n    <li><b>“Plane-mirror and u–v give the same f.”<\/b> They should agree within experimental error, but they have different weak points. The plane-mirror method needs a no-parallax judgement, and it can mislead you with a <b>false position<\/b> (when the pin is where its image falls on the mirror). Always move the mirror a little to check.<\/li>\n  <\/ul>\n  <div class=\"note\">There are more than six methods. This lab covers nine set-ups: the distant object, u–v, its graphs, displacement, plane mirror, auxiliary lens, lenses in contact, lenses separated (BFL), and the method of magnification.<\/div>\n<\/main>\n\n<script>\n(() => {\n'use strict';\nconst METHODS = {\n  dist:  { n: 'Distant object (rough f)', how: 'Focus a far-away object on a screen. The image forms about one focal length behind the lens.', f: 'f ≈ lens-to-screen distance', m: 'Lens and screen positions', e: 'The object is not at infinity; judging the sharpest image. Good for ±10%.', a: 'Rough', tab: 'exp1', lab: 'Experiment 1, step 2' },\n  uv:    { n: 'u–v method', how: 'Fix the lens. Place the object at several distances, focus the image on the screen, and read u and v.', f: '1/f = 1/u + 1/v', m: 'u and v (three pointers)', e: 'Judging the sharpest image once per reading; the lens pointer index error enters both u and v.', a: 'Fair', tab: 'exp1', lab: 'Experiment 1' },\n  uvg:   { n: 'Graphical forms of u–v', how: 'Plot v against u (the curve cuts v = u at 2f) or 1/v against 1/u (a straight line with intercepts 1/f).', f: 'Intercept = 1/f; u = v = 2f', m: 'The same readings as u–v', e: 'Averages out random scatter; cannot remove a systematic error.', a: 'Better than a single reading', tab: 'exp1', lab: 'Experiment 1, graphs' },\n  disp:  { n: 'Displacement method', how: 'Fix the object and the screen D apart (D greater than 4f). Find the two lens positions that give a sharp image, d apart.', f: 'f = (D² − d²)/4D', m: 'D and d', e: 'Two sharp-image judgements per reading. The lens-pointer index error cancels in d.', a: 'Good', tab: 'exp1b', lab: 'Experiment 1B' },\n  mirror:{ n: 'Plane-mirror (auto-collimation) method', how: 'Put a plane mirror behind the lens. Move the pin until its image sits on it with no parallax. Check by moving the mirror.', f: 'f = pin-to-lens distance', m: 'Pin and lens pointers', e: 'Parallax judgement; the false position when the image falls on the mirror.', a: 'Good, and quick', tab: 'exp1b', lab: 'Experiment 1B' },\n  aux:   { n: 'Auxiliary-lens method (concave lens)', how: 'A convex lens makes a real image I₁. A concave lens placed before I₁ moves the image to I₂. I₁ is a virtual object for the concave lens.', f: '|f| = uv/(v − u)', m: 'I₁, I₂ and the concave-lens position', e: 'Two focusing judgements; the concave lens must be closer to I₁ than |f|.', a: 'Fair', tab: 'exp234', lab: 'Experiment 2' },\n  contact:{ n: 'Two lenses in contact', how: 'Treat the pair as one thin lens and use u–v (or its graph).', f: '1/F = 1/f₁ + 1/f₂, P = P₁ + P₂', m: 'u and v from the pair', e: 'The lenses are not exactly in contact; the f₁ and f₂ you compare with have errors.', a: 'Fair', tab: 'exp234', lab: 'Experiment 3' },\n  bfl:   { n: 'Separated lenses: distant object and BFL', how: 'Measure the back focal length BFL for several d, then convert it to F.', f: '1/F = (1 − d/f₁)/BFL', m: 'd and BFL', e: 'BFL is short, so a small error is a big fraction; f₁ enters every point.', a: 'Fair', tab: 'exp234', lab: 'Experiment 4' },\n  mag:   { n: 'Method of magnification (college method)', how: 'Fix d. Measure u, v and the image size I at several object distances. Plot v against (1 + m) and u against (1 + 1/m).', f: 'Slope = F; intercepts β, α give the principal planes', m: 'u, v, I (and O)', e: 'Measuring the image size to about 1 mm. Needs f₁ and f₂ only for comparison.', a: 'Good, and it finds the planes too', tab: 'college', lab: 'Combination of Lenses' }\n};\nconst GOALS = [\n  { k: 'convex', t: 'Focal length of a convex lens', why: 'Three good routes. Pick by what you care about.', list: [['mirror', 'Quickest'], ['uvg', 'Standard'], ['disp', 'Most reliable']] },\n  { k: 'concave', t: 'Focal length of a concave lens', why: 'A concave lens alone gives only a virtual image, so you need help from a convex lens.', list: [['aux', 'The practical way']] },\n  { k: 'contact', t: 'F of two lenses in contact', why: 'Treat the pair as one thin lens.', list: [['contact', 'Simplest'], ['uvg', 'With a graph']] },\n  { k: 'sep', t: 'F of two lenses separated by d', why: 'The principal planes matter here. The method of magnification finds F and the planes together.', list: [['mag', 'Best: finds F and the planes'], ['bfl', 'Shows how F changes with d']] },\n  { k: 'mag', t: 'How magnification behaves', why: 'Magnification is size of image divided by size of object. Plot it against the distances.', list: [['mag', 'The magnification method']] },\n  { k: 'rough', t: 'A rough value, quickly', why: 'Use it to decide where to place the object before the careful measurement.', list: [['dist', 'The first step']] }\n];\nconst CMP = ['dist', 'uv', 'uvg', 'disp', 'mirror', 'aux', 'contact', 'bfl', 'mag'];\nconst go = t => parent.postMessage({ go: t }, '*');\nconst goals = document.getElementById('goals'), cards = document.getElementById('cards');\nfunction show(k) {\n  const g = GOALS.find(x => x.k === k);\n  Array.prototype.forEach.call(goals.children, b => b.setAttribute('aria-pressed', b.dataset.k === k));\n  cards.innerHTML = '<div style=\"grid-column:1/-1;max-width:70ch;margin-bottom:2px\"><b>' + g.t + '.<\/b> ' + g.why + '<\/div>' + g.list.map(([id, tag], i) => {\n    const m = METHODS[id];\n    return '<div class=\"card' + (i === 0 && g.list.length > 1 ? '' : '') + '\"><span class=\"tag ok\">' + tag + '<\/span><h3>' + m.n + '<\/h3><dl><dt>How<\/dt><dd>' + m.how + '<\/dd><dt>Formula<\/dt><dd class=\"eq\">' + m.f + '<\/dd><dt>You measure<\/dt><dd>' + m.m + '<\/dd><dt>Main weakness<\/dt><dd>' + m.e + '<\/dd><\/dl><button class=\"go\" type=\"button\" data-go=\"' + m.tab + '\">Try it: ' + m.lab + '<\/button><\/div>';\n  }).join('');\n  Array.prototype.forEach.call(cards.querySelectorAll('.go'), b => b.addEventListener('click', () => go(b.dataset.go)));\n}\nGOALS.forEach(g => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = g.k; b.textContent = g.t; b.addEventListener('click', () => show(g.k)); goals.appendChild(b); });\ndocument.getElementById('cmp').innerHTML = '<tr><th>Method<\/th><th>What it finds<\/th><th>Key formula<\/th><th>Main error<\/th><th>Accuracy<\/th><th>In this lab<\/th><\/tr>' + CMP.map(id => { const m = METHODS[id]; return '<tr><td><b>' + m.n + '<\/b><\/td><td>' + m.how.split('.')[0] + '.<\/td><td class=\"eq\">' + m.f + '<\/td><td>' + m.e + '<\/td><td>' + m.a + '<\/td><td><button class=\"go\" type=\"button\" data-go=\"' + m.tab + '\">' + m.lab + '<\/button><\/td><\/tr>'; }).join('');\nArray.prototype.forEach.call(document.querySelectorAll('#cmp .go'), b => b.addEventListener('click', () => go(b.dataset.go)));\nshow('sep');\n})();\n<\/script>\n<\/body>\n<\/html>\n","exp1":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Optics Lab: Experiment 1, focal length of a convex lens<\/title>\n<style>\n:root{\n  color-scheme: light dark;\n  --bg:#F1F6F6; --surface:#FFFFFF; --ink:#10242E; --muted:#4A6068; --line:#CBDADC; --soft:#E1F0F0;\n  --accent:#0A7C8A; --ok:#1B7F4A; --okbg:#E1F4E8; --bad:#B42318; --badbg:#FBE9E7; --warn:#8A5A00; --warnbg:#FFF3D6;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,\"Book Antiqua\",Georgia,serif;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root{ --bg:#0A1A21; --surface:#10272F; --ink:#E6F1F2; --muted:#9DB6BB; --line:#274149; --soft:#14323B;\n    --accent:#5FD3DB; --ok:#52D08F; --okbg:#123626; --bad:#FF8A80; --badbg:#3A1E1B; --warn:#F5C451; --warnbg:#3A3015; }\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.6}\nh1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .45em}\nh1{font-size:clamp(1.6rem,4vw,2.3rem)} h2{font-size:1.6rem} h3{font-size:1.15rem;margin-top:1.3em}\np{margin:0 0 .9em;max-width:70ch}\nbutton,input,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}\nsub,sup{line-height:0}\n.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}\n.top .in{max-width:1040px;margin:0 auto;padding:8px 16px}\n.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.title{font-family:var(--serif);font-size:1.05rem;font-weight:700}\n.lensTabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.lensTabs button{border:0;background:var(--surface);padding:5px 14px;cursor:pointer}\n.lensTabs button+button{border-left:1px solid var(--line)}\n.lensTabs button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.lensTabs button[aria-pressed=\"true\"],.seg button[aria-pressed=\"true\"]{color:#0A1A21}}\n.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}\n.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer}\n.steps button[aria-current=\"step\"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}\n@media (prefers-color-scheme: dark){.steps button[aria-current=\"step\"]{color:#0A1A21}}\n.steps button.done::after{content:\" ✓\";color:var(--ok)}\n.steps button[aria-current=\"step\"].done::after{color:inherit}\n.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}\n.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.95rem}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}\n@media (prefers-color-scheme: dark){.btn.primary{color:#0A1A21}}\n.btn.sm{padding:3px 9px;font-size:.85rem}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\n.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;margin:0 0 14px}\n.card h3{margin-top:0}\n.note{border-left:5px solid var(--accent);background:var(--soft);padding:9px 13px;border-radius:0 6px 6px 0;margin:0 0 12px;max-width:74ch;font-size:.97rem}\n.teacher{border-left:5px solid var(--warn);background:var(--warnbg);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;max-width:76ch;font-size:.96rem}\n.teacher.good{border-color:var(--ok);background:var(--okbg)}\n.teacher.bad{border-color:var(--bad);background:var(--badbg)}\n.teacher b.who{display:block;font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}\n.hidden{display:none !important}\n.eq{font-family:\"Cambria Math\",\"STIX Two Math\",var(--serif);font-size:1.12rem}\n\n/* bench */\n.benchwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#e9e4d8,#d8d1c0)}\n.benchwrap canvas{display:block}\n.carriers{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0}\n.car{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.88rem}\n.car b{display:block;margin-bottom:3px}\n.car .b6{display:flex;gap:3px}\n.car .b6 button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:.82rem;font-family:var(--mono)}\n.car .b6 button:hover{border-color:var(--accent)}\n.viewro ck;background:#FFFDF7;cursor:crosshair;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}\n.gcols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.gcols>div{min-width:0;max-width:100%}\n.paperwrap{display:block}\n.gside{flex:1 1 280px;max-width:420px}\n.cursorout{font-family:var(--mono);font-size:.88rem;color:var(--muted);min-height:1.5em}\n\n/* report */\n.rep{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 26px;max-width:860px}\n.rep h2{font-size:1.4rem;border-bottom:2px solid var(--ink);padding-bottom:4px}\n.rep h3{font-size:1.05rem;margin-top:1.1em}\n.rep table{border-collapse:collapse;font-size:.9rem;margin:6px 0}\n.rep td,.rep th{border:1px solid var(--line);padding:3px 8px;text-align:center}\n.rep img{max-width:100%;height:auto;border:1px solid var(--line);margin:4px 0}\n.cvwrap2 canvas{display:block;width:100%;max-width:700px;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}\n.modal-ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}\n.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.4)}\n.modal p{margin:0 0 14px}\n.paperwrap canvas{width:100%;max-width:510px;height:auto}\n.gcols>div:first-child{flex:1 1 320px;max-width:530px}\n.zoombox canvas{height:auto}\n@media (max-width:700px){.top{position:static}.steps{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.steps button{flex:0 0 auto;white-space:nowrap}.wrap{padding:16px 12px 70px}.row{gap:8px 10px}}\n@media print{\n  .top,.btn,.noprint{display:none !important}\n  body{background:#fff;color:#000} .wrap{padding:0} .rep{border:0;padding:0}\n}\n/* notebook-style tables */\ntable.ob{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.ob t = '#1d232b'; ctx.fillStyle = '#1d232b'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.textAlign = 'center';\n    for (let i = 0; i <= 100; i++) { const x = X(i) + .5, h = i % 10 === 0 ? 14 : i % 5 === 0 ? 10 : 6; ctx.beginPath(); ctx.moveTo(x, 172); ctx.lineTo(x, 172 + h); ctx.stroke(); if (i % 10 === 0) ctx.fillText(String(i), x, 194); }\n    ctx.textAlign = 'left'; ctx.fillStyle = '#46505c'; ctx.font = '10px system-ui, sans-serif'; ctx.fillText('cm', X(100) + 8, 194);\n  }\n  function base(ctx, x, bw) {\n    const h = bw / 2;\n    ctx.fillStyle = g(ctx, x - 3, 0, x + 3, 0, [[0, '#8D97A4'], [.45, '#EEF1F4'], [1, '#7A8492']]); ctx.fillRect(x - 3, 70, 6, 68);\n    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x - h + 2, 160, bw - 4, 3);\n    ctx.fillStyle = g(ctx, 0, 136, 0, 150, [[0, '#EEF1F4'], [.5, '#AEB6C1'], [1, '#7C8695']]); rr(ctx, x - h, 136, bw, 14, 3);\n    ctx.fillStyle = '#2B3038'; ctx.fillRect(x - h, 150, bw, 9); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(x - h + 2, 137, bw - 4, 2);\n    ctx.fillStyle = g(ctx, x + h - 12, 0, x + h - 2, 0, [[0, '#1b1e24'], [.5, '#6A727E'], [1, '#1b1e24']]); ctx.beginPath(); ctx.arc(x + h - 7, 143, 5, 0, 6.3); ctx.fill();\n    ctx.fillStyle = '#4a525d'; ctx.fillRect(x - 1, 159, 2, 10);\n    ctx.fillStyle = '#d6402f'; ctx.beginPath(); ctx.moveTo(x, 173.5); ctx.lineTo(x - 4.5, 164); ctx.lineTo(x + 4.5, 164); ctx.closePath(); ctx.fill();\n    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x - .8, 165, 1.6, 6);\n  }\n  function lamp(ctx, x, A, B, mark) {\n    const x0 = x - A, w = B, bx = x0 + w - 2;\n    const gl = ctx.createRadialGradient(bx + 2, 84, 2, bx + 2, 84, 72); gl.addColorStop(0, 'rgba(255,214,110,.55)'); gl.addColorStop(1, 'rgba(255,214,110,0)'); ctx.fillStyle = gl; ctx.fillRect(x0 - 40, 12, w + 150, 150);\n    ctx.fillStyle = g(ctx, x0, 0, x0 + w, 0, [[0, '#262B33'], [.45, '#555D6B'], [1, '#22272E']]); rr(ctx, x0, 52, w, 62, 5);\n    ctx.fillStyle = 'rgba(0,0,0,.55)'; for (let i = 0; i < 5; i
